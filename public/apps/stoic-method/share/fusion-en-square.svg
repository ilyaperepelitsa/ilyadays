<svg xmlns="http://www.w3.org/2000/svg" class="dg-svg share" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-labelledby="fusion-en-square-t fusion-en-square-d"><title id="fusion-en-square-t">Fusing a section into an article</title><desc id="fusion-en-square-d">Article 1: 10 passages on the left feed 5 fused claims; coloured lines under the words show which passages back them (5 colours for 9 quoted passages, never the same colour for two passages of one claim; the passage numbers tell them apart); two points said once by a single passage stand apart; the claims are gathered into the statement “I am a member of one body of reasoning beings, made for a shared life with them.” The word “because” in claim 5 is the editor&#x27;s inference, in purple.</desc><style>svg{--dg-bg:#ffffff;--dg-ink:#171b22;--dg-mu:#626c7a;--dg-line:#dfe4eb;--dg-faint:#d3d9e1;--dg-soft:#f1f3f6;--dg-accent:#c64227;--dg-e:#55468f;--dg-et:#ece9f6;--dg-p1:#4379f9;--dg-p2:#cc689e;--dg-p3:#853f13;--dg-p4:#989401;--dg-p5:#861192;--dg-c1:#2a62b8;--dg-c2:#cf5a2e;--dg-c3:#17998a;--dg-c4:#c99412;--dg-c5:#cc6593;--dg-c6:#5e8c1f;--dg-c7:#7656c9;--dg-fb:#2a62b8;--dg-fa:#17998a;--dg-fl:#c64227;--dg-d1:#1d3f73;--dg-d2:#4f7fc4;--dg-d3:#8fb0e3;--dg-d4:#b7bec8;--dg-sans:Manrope, system-ui, -apple-system, 'Segoe UI', sans-serif;--dg-serif:Georgia, 'Times New Roman', serif}.dg-svg{font-family:var(--dg-sans);overflow:visible}.dg-svg text{fill:var(--dg-ink);font-family:var(--dg-sans)}.dg-svg .f{font-family:var(--dg-serif)}.dg-svg .mu{fill:var(--dg-mu)}.dg-svg .ac{fill:var(--dg-accent)}.dg-svg .halo{paint-order:stroke;stroke:var(--dg-bg);stroke-width:5px;stroke-linejoin:round}.dg-svg .bg{fill:var(--dg-bg)}.dg-svg .soft{fill:var(--dg-soft)}.dg-svg .faint{fill:var(--dg-faint)}.dg-svg .ink{fill:var(--dg-ink)}.dg-svg .k{stroke:var(--dg-ink)}.dg-svg .km{stroke:var(--dg-mu)}.dg-svg .kl{stroke:var(--dg-line)}.dg-svg .kf{stroke:var(--dg-faint)}.dg-svg .kb{stroke:var(--dg-bg)}.dg-svg .nf{fill:none}.dg-svg .sac{stroke:var(--dg-accent)}.dg-svg .ef{fill:var(--dg-e)}.dg-svg .etf{fill:var(--dg-et)}.dg-svg .ek{stroke:var(--dg-e)}.dg-svg .p1{fill:var(--dg-p1)}.dg-svg .sp1{stroke:var(--dg-p1)}.dg-svg .p2{fill:var(--dg-p2)}.dg-svg .sp2{stroke:var(--dg-p2)}.dg-svg .p3{fill:var(--dg-p3)}.dg-svg .sp3{stroke:var(--dg-p3)}.dg-svg .p4{fill:var(--dg-p4)}.dg-svg .sp4{stroke:var(--dg-p4)}.dg-svg .p5{fill:var(--dg-p5)}.dg-svg .sp5{stroke:var(--dg-p5)}.dg-svg .c1{fill:var(--dg-c1)}.dg-svg .sc1{stroke:var(--dg-c1)}.dg-svg .c2{fill:var(--dg-c2)}.dg-svg .sc2{stroke:var(--dg-c2)}.dg-svg .c3{fill:var(--dg-c3)}.dg-svg .sc3{stroke:var(--dg-c3)}.dg-svg .c4{fill:var(--dg-c4)}.dg-svg .sc4{stroke:var(--dg-c4)}.dg-svg .c5{fill:var(--dg-c5)}.dg-svg .sc5{stroke:var(--dg-c5)}.dg-svg .c6{fill:var(--dg-c6)}.dg-svg .sc6{stroke:var(--dg-c6)}.dg-svg .c7{fill:var(--dg-c7)}.dg-svg .sc7{stroke:var(--dg-c7)}.dg-svg .fb{fill:var(--dg-fb)}.dg-svg .sfb{stroke:var(--dg-fb)}.dg-svg .fa{fill:var(--dg-fa)}.dg-svg .sfa{stroke:var(--dg-fa)}.dg-svg .fl{fill:var(--dg-fl)}.dg-svg .sfl{stroke:var(--dg-fl)}.dg-svg .d1{fill:var(--dg-d1)}.dg-svg .sd1{stroke:var(--dg-d1)}.dg-svg .d2{fill:var(--dg-d2)}.dg-svg .sd2{stroke:var(--dg-d2)}.dg-svg .d3{fill:var(--dg-d3)}.dg-svg .sd3{stroke:var(--dg-d3)}.dg-svg .d4{fill:var(--dg-d4)}.dg-svg .sd4{stroke:var(--dg-d4)}</style><rect width="1200" height="1200" class="bg"/><text x="72.0" y="104.0" font-size="50" font-weight="400" class="f">Fusing a section into an article</text><text x="72.0" y="149.5" font-size="26" font-weight="500" class="mu">Article 1, “A member of one body”: <tspan data-d="a1-members">10</tspan> passages, <tspan data-d="a1-claims">5</tspan> fused claims, <tspan data-d="a1-single">2</tspan> said once. 5 colours for</text><text x="72.0" y="184.9" font-size="26" font-weight="500" class="mu">9 passages; two that back one claim never share one.</text><path d="M178.0 484.1 C251.7 484.1 251.7 269.7 312.0 269.7" class="nf sp3" stroke-width="2.2" opacity=".9"/><path d="M178.0 557.8 C251.7 557.8 251.7 284.2 312.0 284.2" class="nf sp4" stroke-width="2.2" opacity=".9"/><path d="M178.0 631.6 C251.7 631.6 251.7 298.7 312.0 298.7" class="nf sp1" stroke-width="2.2" opacity=".9"/><path d="M178.0 705.3 C251.7 705.3 251.7 313.2 312.0 313.2" class="nf sp5" stroke-width="2.2" opacity=".9"/><path d="M178.0 262.9 C251.7 262.9 251.7 327.6 312.0 327.6" class="nf sp2" stroke-width="2.2" opacity=".9"/><path d="M178.0 484.1 C251.7 484.1 251.7 388.7 312.0 388.7" class="nf sp3" stroke-width="2.2" opacity=".9"/><path d="M178.0 262.9 C251.7 262.9 251.7 410.4 312.0 410.4" class="nf sp2" stroke-width="2.2" opacity=".9"/><path d="M178.0 336.6 C251.7 336.6 251.7 432.1 312.0 432.1" class="nf sp5" stroke-width="2.2" opacity=".9"/><path d="M178.0 631.6 C251.7 631.6 251.7 507.7 312.0 507.7" class="nf sp1" stroke-width="2.2" opacity=".9"/><path d="M178.0 779.1 C251.7 779.1 251.7 536.6 312.0 536.6" class="nf sp2" stroke-width="2.2" opacity=".9"/><path d="M178.0 484.1 C251.7 484.1 251.7 617.2 312.0 617.2" class="nf sp3" stroke-width="2.2" opacity=".9"/><path d="M178.0 926.6 C251.7 926.6 251.7 690.5 312.0 690.5" class="nf sp4" stroke-width="2.2" opacity=".9"/><path d="M178.0 410.3 C251.7 410.3 251.7 712.2 312.0 712.2" class="nf sp3" stroke-width="2.2" opacity=".9"/><path d="M178.0 631.6 C251.7 631.6 251.7 733.9 312.0 733.9" class="nf sp1" stroke-width="2.2" opacity=".9"/><path d="M178.0 926.6 C251.7 926.6 251.7 802.2 312.0 802.2" class="nf sp4" stroke-width="2.2" opacity=".9"/><path d="M178.0 410.3 C251.7 410.3 251.7 823.9 312.0 823.9" class="nf sp3" stroke-width="2.2" opacity=".9"/><path d="M178.0 262.9 C251.7 262.9 251.7 845.7 312.0 845.7" class="nf sp2" stroke-width="2.2" opacity=".9"/><path d="M178.0 926.6 C251.7 926.6 251.7 919.0 312.0 919.0" class="nf sp4" stroke-width="2.2" opacity=".9"/><text x="326.0" y="267.9" font-size="21" font-weight="650" class="mu">Claim 1 · Why · What we are</text><line x1="326.5" y1="304.3" x2="556.6" y2="304.3" class="sp2" stroke-width="2.6" stroke-linecap="butt"/><line x1="326.5" y1="308.7" x2="556.6" y2="308.7" class="sp3" stroke-width="2.6" stroke-linecap="butt"/><line x1="562.9" y1="304.3" x2="735.7" y2="304.3" class="sp2" stroke-width="2.6" stroke-linecap="butt"/><line x1="562.9" y1="308.7" x2="735.7" y2="308.7" class="sp5" stroke-width="2.6" stroke-linecap="butt"/><line x1="747.9" y1="304.3" x2="978.9" y2="304.3" class="sp3" stroke-width="2.6" stroke-linecap="butt"/><line x1="991.1" y1="304.3" x2="1104.3" y2="304.3" class="sp1" stroke-width="2.6" stroke-linecap="butt"/><line x1="991.1" y1="308.7" x2="1104.3" y2="308.7" class="sp4" stroke-width="2.6" stroke-linecap="butt"/><line x1="326.5" y1="337.7" x2="360.4" y2="337.7" class="sp1" stroke-width="2.6" stroke-linecap="butt"/><line x1="326.5" y1="342.1" x2="360.4" y2="342.1" class="sp4" stroke-width="2.6" stroke-linecap="butt"/><line x1="414.6" y1="337.7" x2="628.4" y2="337.7" class="sp5" stroke-width="2.6" stroke-linecap="butt"/><text x="326.0" y="299.9" font-size="22" font-weight="400" class="f">Everything that reasons shares one reason, as limbs share one body, citizens one</text><text x="326.0" y="333.3" font-size="22" font-weight="400" class="f">city, and every lit place one sun.</text><text x="326.0" y="379.6" font-size="21" font-weight="650" class="mu">Claim 2 · Why · What we are for</text><line x1="326.5" y1="416.0" x2="452.7" y2="416.0" class="sp3" stroke-width="2.6" stroke-linecap="butt"/><line x1="326.5" y1="420.4" x2="452.7" y2="420.4" class="sp5" stroke-width="2.6" stroke-linecap="butt"/><line x1="459.0" y1="416.0" x2="608.1" y2="416.0" class="sp2" stroke-width="2.6" stroke-linecap="butt"/><line x1="459.0" y1="420.4" x2="608.1" y2="420.4" class="sp5" stroke-width="2.6" stroke-linecap="butt"/><line x1="656.4" y1="416.0" x2="869.2" y2="416.0" class="sp3" stroke-width="2.6" stroke-linecap="butt"/><line x1="923.5" y1="416.0" x2="1089.6" y2="416.0" class="sp5" stroke-width="2.6" stroke-linecap="butt"/><line x1="326.5" y1="449.4" x2="458.3" y2="449.4" class="sp5" stroke-width="2.6" stroke-linecap="butt"/><line x1="326.5" y1="453.8" x2="458.3" y2="453.8" class="sp3" stroke-width="2.6" stroke-linecap="butt"/><text x="326.0" y="411.6" font-size="22" font-weight="400" class="f">We are made for one another and for one common work, and that shared life is</text><text x="326.0" y="445.0" font-size="22" font-weight="400" class="f">our own good.</text><text x="326.0" y="491.3" font-size="21" font-weight="650" class="mu">Claim 3 · In action · What follows for action</text><line x1="356.0" y1="527.7" x2="570.6" y2="527.7" class="sp1" stroke-width="2.6" stroke-linecap="butt"/><line x1="576.9" y1="527.7" x2="816.8" y2="527.7" class="sp1" stroke-width="2.6" stroke-linecap="butt"/><line x1="576.9" y1="532.1" x2="816.8" y2="532.1" class="sp2" stroke-width="2.6" stroke-linecap="butt"/><line x1="829.0" y1="527.7" x2="1054.2" y2="527.7" class="sp1" stroke-width="2.6" stroke-linecap="butt"/><line x1="326.5" y1="561.2" x2="841.9" y2="561.2" class="sp2" stroke-width="2.6" stroke-linecap="butt"/><text x="326.0" y="523.3" font-size="22" font-weight="400" class="f">So each thing I do should aim at the common good, directly or at a distance, and</text><text x="326.0" y="556.8" font-size="22" font-weight="400" class="f">holding to that one aim is what makes me one person.</text><text x="326.0" y="603.1" font-size="21" font-weight="650" class="mu">Said once · Practice · 7.10</text><text x="326.0" y="635.1" font-size="22" font-weight="400" class="f">I shall often say to myself: I am a member, and not merely a part.</text><text x="326.0" y="681.4" font-size="21" font-weight="650" class="mu">Claim 4 · When it breaks · What breaking it does</text><line x1="326.5" y1="717.8" x2="536.9" y2="717.8" class="sp4" stroke-width="2.6" stroke-linecap="butt"/><line x1="549.1" y1="717.8" x2="665.1" y2="717.8" class="sp3" stroke-width="2.6" stroke-linecap="butt"/><line x1="703.6" y1="717.8" x2="903.4" y2="717.8" class="sp3" stroke-width="2.6" stroke-linecap="butt"/><line x1="915.7" y1="717.8" x2="1059.4" y2="717.8" class="sp1" stroke-width="2.6" stroke-linecap="butt"/><line x1="915.7" y1="722.2" x2="1059.4" y2="722.2" class="sp3" stroke-width="2.6" stroke-linecap="butt"/><line x1="915.7" y1="726.6" x2="1059.4" y2="726.6" class="sp4" stroke-width="2.6" stroke-linecap="butt"/><line x1="643.7" y1="751.2" x2="789.5" y2="751.2" class="sp3" stroke-width="2.6" stroke-linecap="butt"/><line x1="643.7" y1="755.6" x2="789.5" y2="755.6" class="sp4" stroke-width="2.6" stroke-linecap="butt"/><text x="326.0" y="713.4" font-size="22" font-weight="400" class="f">When I hate someone, wrong them, or resent what happens, I cut myself off, and</text><text x="326.0" y="746.8" font-size="22" font-weight="400" class="f">not from that one thing only but from the whole.</text><text x="326.0" y="793.1" font-size="21" font-weight="650" class="mu">Claim 5 · When it breaks · The way back</text><line x1="544.4" y1="829.5" x2="695.5" y2="829.5" class="sp3" stroke-width="2.6" stroke-linecap="butt"/><line x1="544.4" y1="833.9" x2="839.2" y2="833.9" class="sp4" stroke-width="2.6" stroke-linecap="butt"/><line x1="933.5" y1="829.5" x2="1104.9" y2="829.5" class="sp2" stroke-width="2.6" stroke-linecap="butt"/><rect x="847.9" y="807.1" width="82.8" height="24.6" rx="3" class="etf"/><line x1="326.5" y1="863.0" x2="480.4" y2="863.0" class="sp2" stroke-width="2.6" stroke-linecap="butt"/><text x="326.0" y="825.1" font-size="22" font-weight="400" class="f">Having cut myself off, I can grow back into the whole, <tspan class="ef">because</tspan> nature is stronger</text><text x="326.0" y="858.6" font-size="22" font-weight="400" class="f">than my leaving.</text><text x="1128.0" y="793.1" font-size="21" font-weight="650" text-anchor="end" class="ef">the editor’s inference</text><text x="326.0" y="904.9" font-size="21" font-weight="650" class="mu">Said once · When it breaks · 11.7</text><text x="326.0" y="936.9" font-size="22" font-weight="400" class="f">The more often I cut myself off, the harder the return.</text><rect x="72.0" y="244.9" width="104.0" height="36.0" rx="18" class="bg sp2" stroke-width="2.6"/><text x="124.0" y="270.4" font-size="21" font-weight="700" text-anchor="middle">9.7</text><rect x="72.0" y="318.6" width="104.0" height="36.0" rx="18" class="bg sp5" stroke-width="2.6"/><text x="124.0" y="344.2" font-size="21" font-weight="700" text-anchor="middle">5.15</text><rect x="72.0" y="392.3" width="104.0" height="36.0" rx="18" class="bg sp3" stroke-width="2.6"/><text x="124.0" y="417.9" font-size="21" font-weight="700" text-anchor="middle">8.32</text><rect x="72.0" y="466.1" width="104.0" height="36.0" rx="18" class="bg sp3" stroke-width="2.6"/><text x="124.0" y="491.7" font-size="21" font-weight="700" text-anchor="middle">7.10</text><rect x="72.0" y="539.8" width="104.0" height="36.0" rx="18" class="bg sp4" stroke-width="2.6"/><text x="124.0" y="565.4" font-size="21" font-weight="700" text-anchor="middle">4.4</text><rect x="72.0" y="613.6" width="104.0" height="36.0" rx="18" class="bg sp1" stroke-width="2.6"/><text x="124.0" y="639.1" font-size="21" font-weight="700" text-anchor="middle">9.21</text><rect x="72.0" y="687.3" width="104.0" height="36.0" rx="18" class="bg sp5" stroke-width="2.6"/><text x="124.0" y="712.9" font-size="21" font-weight="700" text-anchor="middle">12.23</text><rect x="72.0" y="761.1" width="104.0" height="36.0" rx="18" class="bg sp2" stroke-width="2.6"/><text x="124.0" y="786.6" font-size="21" font-weight="700" text-anchor="middle">11.19</text><rect x="72.0" y="834.8" width="104.0" height="36.0" rx="18" class="nf kf" stroke-width="2"/><text x="124.0" y="860.4" font-size="21" font-weight="700" text-anchor="middle" class="mu">8.52</text><text x="184.0" y="860.4" font-size="21" font-weight="600" class="mu halo">set aside</text><rect x="72.0" y="908.6" width="104.0" height="36.0" rx="18" class="bg sp4" stroke-width="2.6"/><text x="124.0" y="934.1" font-size="21" font-weight="700" text-anchor="middle">11.7</text><line x1="316.0" y1="255.3" x2="316.0" y2="342.1" class="kl" stroke-width="3" stroke-linecap="round"/><line x1="316.0" y1="367.0" x2="316.0" y2="453.8" class="kl" stroke-width="3" stroke-linecap="round"/><line x1="316.0" y1="478.7" x2="316.0" y2="565.6" class="kl" stroke-width="3" stroke-linecap="round"/><line x1="316.0" y1="590.5" x2="316.0" y2="643.9" class="kf" stroke-width="3" stroke-linecap="round"/><line x1="316.0" y1="668.8" x2="316.0" y2="755.6" class="kl" stroke-width="3" stroke-linecap="round"/><line x1="316.0" y1="780.5" x2="316.0" y2="867.4" class="kl" stroke-width="3" stroke-linecap="round"/><line x1="316.0" y1="892.3" x2="316.0" y2="945.7" class="kf" stroke-width="3" stroke-linecap="round"/><rect x="304.0" y="958.2" width="834.0" height="136.0" rx="10" class="nf k" stroke-width="1.4"/><text x="326.0" y="988.2" font-size="21" font-weight="650" class="mu">The statement · gathers claims 1 and 2</text><line x1="389.7" y1="1038.2" x2="513.1" y2="1038.2" class="sp1" stroke-width="3" stroke-linecap="butt"/><line x1="389.7" y1="1043.0" x2="513.1" y2="1043.0" class="sp3" stroke-width="3" stroke-linecap="butt"/><line x1="520.9" y1="1038.2" x2="663.4" y2="1038.2" class="sp3" stroke-width="3" stroke-linecap="butt"/><line x1="520.9" y1="1043.0" x2="663.4" y2="1043.0" class="sp4" stroke-width="3" stroke-linecap="butt"/><line x1="671.1" y1="1038.2" x2="910.0" y2="1038.2" class="sp2" stroke-width="3" stroke-linecap="butt"/><line x1="671.1" y1="1043.0" x2="910.0" y2="1043.0" class="sp3" stroke-width="3" stroke-linecap="butt"/><line x1="925.3" y1="1038.2" x2="1056.0" y2="1038.2" class="sp3" stroke-width="3" stroke-linecap="butt"/><line x1="925.3" y1="1043.0" x2="1056.0" y2="1043.0" class="sp5" stroke-width="3" stroke-linecap="butt"/><line x1="326.5" y1="1080.2" x2="587.2" y2="1080.2" class="sp3" stroke-width="3" stroke-linecap="butt"/><line x1="326.5" y1="1085.0" x2="587.2" y2="1085.0" class="sp5" stroke-width="3" stroke-linecap="butt"/><text x="326.0" y="1032.2" font-size="28" font-weight="400" class="f">I am a member of one body of reasoning beings, made for a</text><text x="326.0" y="1074.2" font-size="28" font-weight="400" class="f">shared life with them.</text><g class="dg-foot"><g transform="translate(72,1140.2) scale(1.211)"><rect width="19" height="19" rx="5.5" class="ink"/><rect x="8.3" y="7.6" width="2.4" height="7" rx=".8" class="bg"/><circle cx="9.5" cy="4.9" r="1.35" class="ac"/></g><text x="105.3" y="1160.0" font-size="23" font-weight="650" class="mu">ilyadays.com · Stoic Constitution</text><text x="1128.0" y="1160.0" font-size="23" font-weight="500" text-anchor="end" class="mu">Figure 4 · How the Constitution was made</text></g></svg>
