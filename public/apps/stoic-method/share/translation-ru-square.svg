<svg xmlns="http://www.w3.org/2000/svg" class="dg-svg share" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-labelledby="translation-ru-square-t translation-ru-square-d"><title id="translation-ru-square-t">Три прочтения для каждого фрагмента</title><desc id="translation-ru-square-d">Три дорожки. С греческого на английский: 418 фрагментов, замечания: 969 принято, 465 частично, 189 отклонено. С латыни: 304 раздела, 716, 349, 86. С английского на русский: 722 фрагмента, 155, 57, 7.</desc><style>svg{--dg-bg:#ffffff;--dg-ink:#171b22;--dg-mu:#626c7a;--dg-line:#dfe4eb;--dg-faint:#d3d9e1;--dg-soft:#f1f3f6;--dg-accent:#c64227;--dg-e:#55468f;--dg-et:#ece9f6;--dg-p1:#4379f9;--dg-p2:#cc689e;--dg-p3:#853f13;--dg-p4:#989401;--dg-p5:#861192;--dg-c1:#2a62b8;--dg-c2:#cf5a2e;--dg-c3:#17998a;--dg-c4:#c99412;--dg-c5:#cc6593;--dg-c6:#5e8c1f;--dg-c7:#7656c9;--dg-fb:#2a62b8;--dg-fa:#17998a;--dg-fl:#c64227;--dg-d1:#1d3f73;--dg-d2:#4f7fc4;--dg-d3:#8fb0e3;--dg-d4:#b7bec8;--dg-sans:Manrope, system-ui, -apple-system, 'Segoe UI', sans-serif;--dg-serif:Georgia, 'Times New Roman', serif}.dg-svg{font-family:var(--dg-sans);overflow:visible}.dg-svg text{fill:var(--dg-ink);font-family:var(--dg-sans)}.dg-svg .f{font-family:var(--dg-serif)}.dg-svg .mu{fill:var(--dg-mu)}.dg-svg .ac{fill:var(--dg-accent)}.dg-svg .halo{paint-order:stroke;stroke:var(--dg-bg);stroke-width:5px;stroke-linejoin:round}.dg-svg .bg{fill:var(--dg-bg)}.dg-svg .soft{fill:var(--dg-soft)}.dg-svg .faint{fill:var(--dg-faint)}.dg-svg .ink{fill:var(--dg-ink)}.dg-svg .k{stroke:var(--dg-ink)}.dg-svg .km{stroke:var(--dg-mu)}.dg-svg .kl{stroke:var(--dg-line)}.dg-svg .kf{stroke:var(--dg-faint)}.dg-svg .kb{stroke:var(--dg-bg)}.dg-svg .nf{fill:none}.dg-svg .sac{stroke:var(--dg-accent)}.dg-svg .ef{fill:var(--dg-e)}.dg-svg .etf{fill:var(--dg-et)}.dg-svg .ek{stroke:var(--dg-e)}.dg-svg .p1{fill:var(--dg-p1)}.dg-svg .sp1{stroke:var(--dg-p1)}.dg-svg .p2{fill:var(--dg-p2)}.dg-svg .sp2{stroke:var(--dg-p2)}.dg-svg .p3{fill:var(--dg-p3)}.dg-svg .sp3{stroke:var(--dg-p3)}.dg-svg .p4{fill:var(--dg-p4)}.dg-svg .sp4{stroke:var(--dg-p4)}.dg-svg .p5{fill:var(--dg-p5)}.dg-svg .sp5{stroke:var(--dg-p5)}.dg-svg .c1{fill:var(--dg-c1)}.dg-svg .sc1{stroke:var(--dg-c1)}.dg-svg .c2{fill:var(--dg-c2)}.dg-svg .sc2{stroke:var(--dg-c2)}.dg-svg .c3{fill:var(--dg-c3)}.dg-svg .sc3{stroke:var(--dg-c3)}.dg-svg .c4{fill:var(--dg-c4)}.dg-svg .sc4{stroke:var(--dg-c4)}.dg-svg .c5{fill:var(--dg-c5)}.dg-svg .sc5{stroke:var(--dg-c5)}.dg-svg .c6{fill:var(--dg-c6)}.dg-svg .sc6{stroke:var(--dg-c6)}.dg-svg .c7{fill:var(--dg-c7)}.dg-svg .sc7{stroke:var(--dg-c7)}.dg-svg .fb{fill:var(--dg-fb)}.dg-svg .sfb{stroke:var(--dg-fb)}.dg-svg .fa{fill:var(--dg-fa)}.dg-svg .sfa{stroke:var(--dg-fa)}.dg-svg .fl{fill:var(--dg-fl)}.dg-svg .sfl{stroke:var(--dg-fl)}.dg-svg .d1{fill:var(--dg-d1)}.dg-svg .sd1{stroke:var(--dg-d1)}.dg-svg .d2{fill:var(--dg-d2)}.dg-svg .sd2{stroke:var(--dg-d2)}.dg-svg .d3{fill:var(--dg-d3)}.dg-svg .sd3{stroke:var(--dg-d3)}.dg-svg .d4{fill:var(--dg-d4)}.dg-svg .sd4{stroke:var(--dg-d4)}</style><rect width="1200" height="1200" class="bg"/><text x="72.0" y="104.0" font-size="50" font-weight="400" class="f">Три прочтения для каждого фрагмента</text><text x="72.0" y="149.5" font-size="26" font-weight="500" class="mu">Греческий и латынь — на современный английский, затем на русский. Каждое</text><text x="72.0" y="184.9" font-size="26" font-weight="500" class="mu">замечание второго читателя решается письменно: третьим читателем в новом</text><text x="72.0" y="220.2" font-size="26" font-weight="500" class="mu">контексте, а для русского — переводчиком.</text><text x="72.0" y="301.2" font-size="27" font-weight="750">Греческий → английский</text><text x="426.8" y="301.2" font-size="22" font-weight="500" class="mu"><tspan data-d="tr-marcus">418</tspan> фрагментов Марка · Claude Fable 5.2</text><rect x="72.0" y="319.2" width="249.2" height="68.2" rx="8" class="soft"/><text x="86.0" y="348.9" font-size="22" font-weight="750">1 · Переводчик</text><text x="86.0" y="375.3" font-size="22" font-weight="500" class="mu">видит греческий</text><path d="M333.2 347.3 L339.2 353.3 L333.2 359.3" class="nf km" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="351.2" y="319.2" width="327.5" height="68.2" rx="8" class="soft"/><text x="365.2" y="348.9" font-size="22" font-weight="750">2 · Проверяющий</text><text x="365.2" y="375.3" font-size="22" font-weight="500" class="mu">греческий и английский</text><path d="M690.6 347.3 L696.6 353.3 L690.6 359.3" class="nf km" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="708.6" y="319.2" width="419.4" height="68.2" rx="8" class="soft"/><text x="722.6" y="348.9" font-size="22" font-weight="750">3 · Решающий</text><text x="722.6" y="375.3" font-size="22" font-weight="500" class="mu">греческий, черновик, замечания</text><rect x="72.0" y="407.4" width="621.6" height="20" rx="2" class="d1"><title>принято: 969</title></rect><rect x="695.6" y="407.4" width="297.2" height="20" rx="2" class="d2"><title>частично: 465</title></rect><rect x="994.8" y="407.4" width="119.6" height="20" rx="2" class="d3"><title>отклонено: 189</title></rect><rect x="1116.4" y="407.4" width="9.6" height="20" rx="2" class="d4"><title>свободно: 18</title></rect><rect x="72.0" y="441.7" width="15.8" height="15.8" rx="2" class="d1"/><text x="94.0" y="458.2" font-size="22" font-weight="600"><tspan data-d="dec-marcus-accepted">969</tspan> принято</text><rect x="250.2" y="441.7" width="15.8" height="15.8" rx="2" class="d2"/><text x="272.2" y="458.2" font-size="22" font-weight="600"><tspan data-d="dec-marcus-partly">465</tspan> частично</text><rect x="438.5" y="441.7" width="15.8" height="15.8" rx="2" class="d3"/><text x="460.5" y="458.2" font-size="22" font-weight="600"><tspan data-d="dec-marcus-declined">189</tspan> отклонено</text><rect x="637.9" y="441.7" width="15.8" height="15.8" rx="2" class="d4"/><text x="659.9" y="458.2" font-size="22" font-weight="600"><tspan data-d="dec-marcus-free">18</tspan> свободно</text><text x="72.0" y="490.1" font-size="22" font-weight="500" class="mu"><tspan data-d="dec-marcus-found">137</tspan> из принятых — ошибки, найденные самим решающим · <tspan data-d="notes-marcus">3201</tspan> заметок о том, что греческий</text><text x="72.0" y="517.6" font-size="22" font-weight="500" class="mu">оставляет открытым</text><line x1="72.0" y1="544.8" x2="1128.0" y2="544.8" class="kl" stroke-width="1"/><text x="72.0" y="581.8" font-size="27" font-weight="750">Латынь → английский</text><text x="387.2" y="581.8" font-size="22" font-weight="500" class="mu"><tspan data-d="tr-seneca">304</tspan> раздела Сенеки, <tspan data-d="tr-letters">94</tspan> письма · Claude Fable 5.2</text><rect x="72.0" y="599.8" width="259.6" height="68.2" rx="8" class="soft"/><text x="86.0" y="629.5" font-size="22" font-weight="750">1 · Переводчик</text><text x="86.0" y="655.9" font-size="22" font-weight="500" class="mu">видит латынь</text><path d="M343.6 627.9 L349.6 633.9 L343.6 639.9" class="nf km" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="361.6" y="599.8" width="322.3" height="68.2" rx="8" class="soft"/><text x="375.6" y="629.5" font-size="22" font-weight="750">2 · Проверяющий</text><text x="375.6" y="655.9" font-size="22" font-weight="500" class="mu">латынь и английский</text><path d="M695.8 627.9 L701.8 633.9 L695.8 639.9" class="nf km" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="713.8" y="599.8" width="414.2" height="68.2" rx="8" class="soft"/><text x="727.8" y="629.5" font-size="22" font-weight="750">3 · Решающий</text><text x="727.8" y="655.9" font-size="22" font-weight="500" class="mu">латынь, черновик, замечания</text><rect x="72.0" y="688.0" width="458.8" height="20" rx="2" class="d1"><title>принято: 716</title></rect><rect x="532.8" y="688.0" width="222.6" height="20" rx="2" class="d2"><title>частично: 349</title></rect><rect x="757.3" y="688.0" width="53.3" height="20" rx="2" class="d3"><title>отклонено: 86</title></rect><rect x="72.0" y="722.3" width="15.8" height="15.8" rx="2" class="d1"/><text x="94.0" y="738.8" font-size="22" font-weight="600"><tspan data-d="dec-seneca-accepted">716</tspan> принято</text><rect x="244.1" y="722.3" width="15.8" height="15.8" rx="2" class="d2"/><text x="266.1" y="738.8" font-size="22" font-weight="600"><tspan data-d="dec-seneca-partly">349</tspan> частично</text><rect x="431.7" y="722.3" width="15.8" height="15.8" rx="2" class="d3"/><text x="453.7" y="738.8" font-size="22" font-weight="600"><tspan data-d="dec-seneca-declined">86</tspan> отклонено</text><text x="72.0" y="770.7" font-size="22" font-weight="500" class="mu"><tspan data-d="dec-seneca-found">61</tspan> из принятых — ошибки, найденные самим решающим · <tspan data-d="notes-seneca">2363</tspan> заметок о том, что латынь оставляет</text><text x="72.0" y="798.2" font-size="22" font-weight="500" class="mu">открытым</text><line x1="72.0" y1="825.4" x2="1128.0" y2="825.4" class="kl" stroke-width="1"/><text x="72.0" y="862.4" font-size="27" font-weight="750">Английский → русский</text><text x="397.0" y="862.4" font-size="22" font-weight="500" class="mu"><tspan data-d="tr-ru">722</tspan> фрагмента, Марк и Сенека · Claude Opus 5.5 · Sonnet 5.5</text><rect x="72.0" y="880.4" width="363.2" height="68.2" rx="8" class="soft"/><text x="86.0" y="910.1" font-size="22" font-weight="750">1 · Переводчик</text><text x="86.0" y="936.5" font-size="22" font-weight="500" class="mu">Opus, видит английский</text><path d="M447.2 908.5 L453.2 914.5 L447.2 920.5" class="nf km" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="465.2" y="880.4" width="322.5" height="68.2" rx="8" class="soft"/><text x="479.2" y="910.1" font-size="22" font-weight="750">2 · Второй читатель</text><text x="479.2" y="936.5" font-size="22" font-weight="500" class="mu">Sonnet, оба текста</text><path d="M799.7 908.5 L805.7 914.5 L799.7 920.5" class="nf km" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="817.7" y="880.4" width="310.3" height="68.2" rx="8" class="soft"/><text x="831.7" y="910.1" font-size="22" font-weight="750">3 · Переводчик</text><text x="831.7" y="936.5" font-size="22" font-weight="500" class="mu">решает письменно</text><rect x="72.0" y="968.6" width="97.7" height="20" rx="2" class="d1"><title>принято: 155</title></rect><rect x="171.7" y="968.6" width="34.7" height="20" rx="2" class="d2"><title>частично: 57</title></rect><rect x="208.4" y="968.6" width="2.5" height="20" rx="2" class="d3"><title>отклонено: 7</title></rect><rect x="72.0" y="1002.9" width="15.8" height="15.8" rx="2" class="d1"/><text x="94.0" y="1019.4" font-size="22" font-weight="600"><tspan data-d="dec-ru-accepted">155</tspan> принято</text><rect x="244.6" y="1002.9" width="15.8" height="15.8" rx="2" class="d2"/><text x="266.6" y="1019.4" font-size="22" font-weight="600"><tspan data-d="dec-ru-partly">57</tspan> частично</text><rect x="417.4" y="1002.9" width="15.8" height="15.8" rx="2" class="d3"/><text x="439.4" y="1019.4" font-size="22" font-weight="600"><tspan data-d="dec-ru-declined">7</tspan> отклонено</text><text x="72.0" y="1051.3" font-size="22" font-weight="500" class="mu">Каждая цитата статей вырезана заново из русского; глоссарий закрепляет термины страницы</text><g class="dg-foot"><g transform="translate(72,1140.2) scale(1.211)"><rect width="19" height="19" rx="5.5" class="ink"/><rect x="8.3" y="7.6" width="2.4" height="7" rx=".8" class="bg"/><circle cx="9.5" cy="4.9" r="1.35" class="ac"/></g><text x="105.3" y="1160.0" font-size="23" font-weight="650" class="mu">ilyadays.com · Стоическая конституция</text><text x="1128.0" y="1160.0" font-size="23" font-weight="500" text-anchor="end" class="mu">Рис. 7 · Как сделана конституция</text></g></svg>
