<svg xmlns="http://www.w3.org/2000/svg" class="dg-svg share" viewBox="0 0 1200 627" width="1200" height="627" role="img" aria-labelledby="fusion-en-landscape-t fusion-en-landscape-d"><title id="fusion-en-landscape-t">Fusing a section into an article</title><desc id="fusion-en-landscape-d">Article 1: 10 passages on the left feed 5 fused claims; coloured lines under the words show which passages back them (5 colours for 9 quoted passages, never the same colour for two passages of one claim; the passage numbers tell them apart); two points said once by a single passage stand apart; the claims are gathered into the statement “I am a member of one body of reasoning beings, made for a shared life with them.” The word “because” in claim 5 is the editor&#x27;s inference, in purple.</desc><style>svg{--dg-bg:#ffffff;--dg-ink:#171b22;--dg-mu:#626c7a;--dg-line:#dfe4eb;--dg-faint:#d3d9e1;--dg-soft:#f1f3f6;--dg-accent:#c64227;--dg-e:#55468f;--dg-et:#ece9f6;--dg-p1:#4379f9;--dg-p2:#cc689e;--dg-p3:#853f13;--dg-p4:#989401;--dg-p5:#861192;--dg-c1:#2a62b8;--dg-c2:#cf5a2e;--dg-c3:#17998a;--dg-c4:#c99412;--dg-c5:#cc6593;--dg-c6:#5e8c1f;--dg-c7:#7656c9;--dg-fb:#2a62b8;--dg-fa:#17998a;--dg-fl:#c64227;--dg-d1:#1d3f73;--dg-d2:#4f7fc4;--dg-d3:#8fb0e3;--dg-d4:#b7bec8;--dg-sans:Manrope, system-ui, -apple-system, 'Segoe UI', sans-serif;--dg-serif:Georgia, 'Times New Roman', serif}.dg-svg{font-family:var(--dg-sans);overflow:visible}.dg-svg text{fill:var(--dg-ink);font-family:var(--dg-sans)}.dg-svg .f{font-family:var(--dg-serif)}.dg-svg .mu{fill:var(--dg-mu)}.dg-svg .ac{fill:var(--dg-accent)}.dg-svg .halo{paint-order:stroke;stroke:var(--dg-bg);stroke-width:5px;stroke-linejoin:round}.dg-svg .bg{fill:var(--dg-bg)}.dg-svg .soft{fill:var(--dg-soft)}.dg-svg .faint{fill:var(--dg-faint)}.dg-svg .ink{fill:var(--dg-ink)}.dg-svg .k{stroke:var(--dg-ink)}.dg-svg .km{stroke:var(--dg-mu)}.dg-svg .kl{stroke:var(--dg-line)}.dg-svg .kf{stroke:var(--dg-faint)}.dg-svg .kb{stroke:var(--dg-bg)}.dg-svg .nf{fill:none}.dg-svg .sac{stroke:var(--dg-accent)}.dg-svg .ef{fill:var(--dg-e)}.dg-svg .etf{fill:var(--dg-et)}.dg-svg .ek{stroke:var(--dg-e)}.dg-svg .p1{fill:var(--dg-p1)}.dg-svg .sp1{stroke:var(--dg-p1)}.dg-svg .p2{fill:var(--dg-p2)}.dg-svg .sp2{stroke:var(--dg-p2)}.dg-svg .p3{fill:var(--dg-p3)}.dg-svg .sp3{stroke:var(--dg-p3)}.dg-svg .p4{fill:var(--dg-p4)}.dg-svg .sp4{stroke:var(--dg-p4)}.dg-svg .p5{fill:var(--dg-p5)}.dg-svg .sp5{stroke:var(--dg-p5)}.dg-svg .c1{fill:var(--dg-c1)}.dg-svg .sc1{stroke:var(--dg-c1)}.dg-svg .c2{fill:var(--dg-c2)}.dg-svg .sc2{stroke:var(--dg-c2)}.dg-svg .c3{fill:var(--dg-c3)}.dg-svg .sc3{stroke:var(--dg-c3)}.dg-svg .c4{fill:var(--dg-c4)}.dg-svg .sc4{stroke:var(--dg-c4)}.dg-svg .c5{fill:var(--dg-c5)}.dg-svg .sc5{stroke:var(--dg-c5)}.dg-svg .c6{fill:var(--dg-c6)}.dg-svg .sc6{stroke:var(--dg-c6)}.dg-svg .c7{fill:var(--dg-c7)}.dg-svg .sc7{stroke:var(--dg-c7)}.dg-svg .fb{fill:var(--dg-fb)}.dg-svg .sfb{stroke:var(--dg-fb)}.dg-svg .fa{fill:var(--dg-fa)}.dg-svg .sfa{stroke:var(--dg-fa)}.dg-svg .fl{fill:var(--dg-fl)}.dg-svg .sfl{stroke:var(--dg-fl)}.dg-svg .d1{fill:var(--dg-d1)}.dg-svg .sd1{stroke:var(--dg-d1)}.dg-svg .d2{fill:var(--dg-d2)}.dg-svg .sd2{stroke:var(--dg-d2)}.dg-svg .d3{fill:var(--dg-d3)}.dg-svg .sd3{stroke:var(--dg-d3)}.dg-svg .d4{fill:var(--dg-d4)}.dg-svg .sd4{stroke:var(--dg-d4)}</style><rect width="1200" height="627" class="bg"/><text x="56.0" y="70.0" font-size="38" font-weight="400" class="f">Fusing a section into an article</text><text x="56.0" y="108.5" font-size="22" font-weight="500" class="mu">Article 1, “A member of one body”. 5 colours for the 9 quoted passages: two passages that back the same</text><text x="56.0" y="138.4" font-size="22" font-weight="500" class="mu">claim never share one, and the numbers tell the rest apart.</text><path d="M138.0 304.8 C190.8 304.8 190.8 194.4 234.0 194.4" class="nf sp3" stroke-width="1.8" opacity=".9"/><path d="M138.0 341.7 C190.8 341.7 190.8 204.5 234.0 204.5" class="nf sp4" stroke-width="1.8" opacity=".9"/><path d="M138.0 378.7 C190.8 378.7 190.8 214.7 234.0 214.7" class="nf sp1" stroke-width="1.8" opacity=".9"/><path d="M138.0 415.6 C190.8 415.6 190.8 224.8 234.0 224.8" class="nf sp5" stroke-width="1.8" opacity=".9"/><path d="M138.0 193.9 C190.8 193.9 190.8 234.9 234.0 234.9" class="nf sp2" stroke-width="1.8" opacity=".9"/><path d="M138.0 304.8 C190.8 304.8 190.8 270.6 234.0 270.6" class="nf sp3" stroke-width="1.8" opacity=".9"/><path d="M138.0 193.9 C190.8 193.9 190.8 280.2 234.0 280.2" class="nf sp2" stroke-width="1.8" opacity=".9"/><path d="M138.0 230.9 C190.8 230.9 190.8 289.8 234.0 289.8" class="nf sp5" stroke-width="1.8" opacity=".9"/><path d="M138.0 378.7 C190.8 378.7 190.8 335.5 234.0 335.5" class="nf sp1" stroke-width="1.8" opacity=".9"/><path d="M138.0 452.6 C190.8 452.6 190.8 355.8 234.0 355.8" class="nf sp2" stroke-width="1.8" opacity=".9"/><path d="M138.0 526.5 C190.8 526.5 190.8 407.2 234.0 407.2" class="nf sp4" stroke-width="1.8" opacity=".9"/><path d="M138.0 267.8 C190.8 267.8 190.8 422.4 234.0 422.4" class="nf sp3" stroke-width="1.8" opacity=".9"/><path d="M138.0 378.7 C190.8 378.7 190.8 437.7 234.0 437.7" class="nf sp1" stroke-width="1.8" opacity=".9"/><path d="M138.0 526.5 C190.8 526.5 190.8 484.0 234.0 484.0" class="nf sp4" stroke-width="1.8" opacity=".9"/><path d="M138.0 267.8 C190.8 267.8 190.8 499.2 234.0 499.2" class="nf sp3" stroke-width="1.8" opacity=".9"/><path d="M138.0 193.9 C190.8 193.9 190.8 514.4 234.0 514.4" class="nf sp2" stroke-width="1.8" opacity=".9"/><text x="248.0" y="192.9" font-size="14.5" font-weight="650" class="mu">Claim 1 · Why · What we are</text><line x1="248.5" y1="219.5" x2="410.3" y2="219.5" class="sp2" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="223.5" x2="410.3" y2="223.5" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="415.1" y1="219.5" x2="536.5" y2="219.5" class="sp2" stroke-width="2.2" stroke-linecap="butt"/><line x1="415.1" y1="223.5" x2="536.5" y2="223.5" class="sp5" stroke-width="2.2" stroke-linecap="butt"/><line x1="545.4" y1="219.5" x2="707.8" y2="219.5" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="716.7" y1="219.5" x2="824.5" y2="219.5" class="sp1" stroke-width="2.2" stroke-linecap="butt"/><line x1="716.7" y1="223.5" x2="824.5" y2="223.5" class="sp4" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="242.0" x2="398.9" y2="242.0" class="sp5" stroke-width="2.2" stroke-linecap="butt"/><text x="248.0" y="216.4" font-size="15.5" font-weight="400" class="f">Everything that reasons shares one reason, as limbs share one body, citizens one city, and</text><text x="248.0" y="238.9" font-size="15.5" font-weight="400" class="f">every lit place one sun.</text><text x="248.0" y="269.7" font-size="14.5" font-weight="650" class="mu">Claim 2 · Why · What we are for</text><line x1="248.5" y1="296.3" x2="337.1" y2="296.3" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="300.3" x2="337.1" y2="300.3" class="sp5" stroke-width="2.2" stroke-linecap="butt"/><line x1="341.8" y1="296.3" x2="446.6" y2="296.3" class="sp2" stroke-width="2.2" stroke-linecap="butt"/><line x1="341.8" y1="300.3" x2="446.6" y2="300.3" class="sp5" stroke-width="2.2" stroke-linecap="butt"/><line x1="481.0" y1="296.3" x2="630.6" y2="296.3" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="669.1" y1="296.3" x2="883.2" y2="296.3" class="sp5" stroke-width="2.2" stroke-linecap="butt"/><line x1="790.6" y1="300.3" x2="883.2" y2="300.3" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><text x="248.0" y="293.2" font-size="15.5" font-weight="400" class="f">We are made for one another and for one common work, and that shared life is our own good.</text><text x="248.0" y="323.9" font-size="14.5" font-weight="650" class="mu">Claim 3 · In action · What follows for action</text><line x1="269.3" y1="350.5" x2="420.2" y2="350.5" class="sp1" stroke-width="2.2" stroke-linecap="butt"/><line x1="424.9" y1="350.5" x2="593.6" y2="350.5" class="sp1" stroke-width="2.2" stroke-linecap="butt"/><line x1="424.9" y1="354.5" x2="593.6" y2="354.5" class="sp2" stroke-width="2.2" stroke-linecap="butt"/><line x1="602.6" y1="350.5" x2="760.9" y2="350.5" class="sp1" stroke-width="2.2" stroke-linecap="butt"/><line x1="799.4" y1="350.5" x2="868.2" y2="350.5" class="sp2" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="373.0" x2="537.8" y2="373.0" class="sp2" stroke-width="2.2" stroke-linecap="butt"/><text x="248.0" y="347.4" font-size="15.5" font-weight="400" class="f">So each thing I do should aim at the common good, directly or at a distance, and holding to</text><text x="248.0" y="369.9" font-size="15.5" font-weight="400" class="f">that one aim is what makes me one person.</text><text x="248.0" y="400.7" font-size="14.5" font-weight="650" class="mu">Claim 4 · When it breaks · What breaking it does</text><line x1="248.5" y1="427.3" x2="396.4" y2="427.3" class="sp4" stroke-width="2.2" stroke-linecap="butt"/><line x1="405.3" y1="427.3" x2="486.8" y2="427.3" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="514.1" y1="427.3" x2="654.7" y2="427.3" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="663.6" y1="427.3" x2="764.5" y2="427.3" class="sp1" stroke-width="2.2" stroke-linecap="butt"/><line x1="663.6" y1="431.3" x2="764.5" y2="431.3" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="663.6" y1="435.3" x2="764.5" y2="435.3" class="sp4" stroke-width="2.2" stroke-linecap="butt"/><line x1="408.2" y1="449.8" x2="510.7" y2="449.8" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="408.2" y1="453.8" x2="510.7" y2="453.8" class="sp4" stroke-width="2.2" stroke-linecap="butt"/><text x="248.0" y="424.2" font-size="15.5" font-weight="400" class="f">When I hate someone, wrong them, or resent what happens, I cut myself off, and not from</text><text x="248.0" y="446.7" font-size="15.5" font-weight="400" class="f">that one thing only but from the whole.</text><text x="248.0" y="477.4" font-size="14.5" font-weight="650" class="mu">Claim 5 · When it breaks · The way back</text><line x1="402.1" y1="504.0" x2="508.2" y2="504.0" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="402.1" y1="508.0" x2="609.4" y2="508.0" class="sp4" stroke-width="2.2" stroke-linecap="butt"/><line x1="676.2" y1="504.0" x2="856.7" y2="504.0" class="sp2" stroke-width="2.2" stroke-linecap="butt"/><rect x="614.8" y="488.2" width="60.1" height="17.4" rx="3" class="etf"/><line x1="248.5" y1="526.5" x2="296.5" y2="526.5" class="sp2" stroke-width="2.2" stroke-linecap="butt"/><text x="248.0" y="500.9" font-size="15.5" font-weight="400" class="f">Having cut myself off, I can grow back into the whole, <tspan class="ef">because</tspan> nature is stronger than my</text><text x="248.0" y="523.4" font-size="15.5" font-weight="400" class="f">leaving.</text><text x="888.0" y="477.4" font-size="14.5" font-weight="650" text-anchor="end" class="ef">the editor’s inference</text><rect x="56.0" y="180.4" width="80.0" height="27.0" rx="13.5" class="bg sp2" stroke-width="2.6"/><text x="96.0" y="199.7" font-size="16" font-weight="700" text-anchor="middle">9.7</text><rect x="56.0" y="217.4" width="80.0" height="27.0" rx="13.5" class="bg sp5" stroke-width="2.6"/><text x="96.0" y="236.6" font-size="16" font-weight="700" text-anchor="middle">5.15</text><rect x="56.0" y="254.3" width="80.0" height="27.0" rx="13.5" class="bg sp3" stroke-width="2.6"/><text x="96.0" y="273.6" font-size="16" font-weight="700" text-anchor="middle">8.32</text><rect x="56.0" y="291.3" width="80.0" height="27.0" rx="13.5" class="bg sp3" stroke-width="2.6"/><text x="96.0" y="310.5" font-size="16" font-weight="700" text-anchor="middle">7.10</text><rect x="56.0" y="328.2" width="80.0" height="27.0" rx="13.5" class="bg sp4" stroke-width="2.6"/><text x="96.0" y="347.5" font-size="16" font-weight="700" text-anchor="middle">4.4</text><rect x="56.0" y="365.2" width="80.0" height="27.0" rx="13.5" class="bg sp1" stroke-width="2.6"/><text x="96.0" y="384.4" font-size="16" font-weight="700" text-anchor="middle">9.21</text><rect x="56.0" y="402.1" width="80.0" height="27.0" rx="13.5" class="bg sp5" stroke-width="2.6"/><text x="96.0" y="421.4" font-size="16" font-weight="700" text-anchor="middle">12.23</text><rect x="56.0" y="439.1" width="80.0" height="27.0" rx="13.5" class="bg sp2" stroke-width="2.6"/><text x="96.0" y="458.4" font-size="16" font-weight="700" text-anchor="middle">11.19</text><rect x="56.0" y="476.0" width="80.0" height="27.0" rx="13.5" class="nf kf" stroke-width="2"/><text x="96.0" y="495.3" font-size="16" font-weight="700" text-anchor="middle" class="mu">8.52</text><text x="144.0" y="495.3" font-size="16" font-weight="600" class="mu halo">set aside</text><rect x="56.0" y="513.0" width="80.0" height="27.0" rx="13.5" class="bg sp4" stroke-width="2.6"/><text x="96.0" y="532.3" font-size="16" font-weight="700" text-anchor="middle">11.7</text><line x1="238.0" y1="184.2" x2="238.0" y2="245.1" class="kl" stroke-width="3" stroke-linecap="round"/><line x1="238.0" y1="261.0" x2="238.0" y2="299.4" class="kl" stroke-width="3" stroke-linecap="round"/><line x1="238.0" y1="315.2" x2="238.0" y2="376.1" class="kl" stroke-width="3" stroke-linecap="round"/><line x1="238.0" y1="392.0" x2="238.0" y2="452.9" class="kl" stroke-width="3" stroke-linecap="round"/><line x1="238.0" y1="468.7" x2="238.0" y2="529.6" class="kl" stroke-width="3" stroke-linecap="round"/><rect x="912.0" y="172.4" width="232.0" height="247.2" rx="10" class="nf k" stroke-width="1.4"/><text x="928.0" y="196.4" font-size="16" font-weight="650" class="mu">The statement</text><line x1="975.9" y1="237.4" x2="1068.2" y2="237.4" class="sp1" stroke-width="2.4" stroke-linecap="butt"/><line x1="975.9" y1="241.6" x2="1068.2" y2="241.6" class="sp3" stroke-width="2.4" stroke-linecap="butt"/><line x1="1074.3" y1="237.4" x2="1091.4" y2="237.4" class="sp3" stroke-width="2.4" stroke-linecap="butt"/><line x1="1074.3" y1="241.6" x2="1091.4" y2="241.6" class="sp4" stroke-width="2.4" stroke-linecap="butt"/><line x1="928.5" y1="270.0" x2="1011.9" y2="270.0" class="sp3" stroke-width="2.4" stroke-linecap="butt"/><line x1="928.5" y1="274.2" x2="1011.9" y2="274.2" class="sp4" stroke-width="2.4" stroke-linecap="butt"/><line x1="1018.0" y1="270.0" x2="1035.1" y2="270.0" class="sp2" stroke-width="2.4" stroke-linecap="butt"/><line x1="1018.0" y1="274.2" x2="1035.1" y2="274.2" class="sp3" stroke-width="2.4" stroke-linecap="butt"/><line x1="928.5" y1="302.5" x2="1084.2" y2="302.5" class="sp2" stroke-width="2.4" stroke-linecap="butt"/><line x1="928.5" y1="306.7" x2="1084.2" y2="306.7" class="sp3" stroke-width="2.4" stroke-linecap="butt"/><line x1="928.5" y1="335.1" x2="1128.2" y2="335.1" class="sp3" stroke-width="2.4" stroke-linecap="butt"/><line x1="928.5" y1="339.3" x2="1128.2" y2="339.3" class="sp5" stroke-width="2.4" stroke-linecap="butt"/><line x1="928.5" y1="367.6" x2="1021.8" y2="367.6" class="sp3" stroke-width="2.4" stroke-linecap="butt"/><line x1="928.5" y1="371.8" x2="1021.8" y2="371.8" class="sp5" stroke-width="2.4" stroke-linecap="butt"/><text x="928.0" y="232.4" font-size="21" font-weight="400" class="f">I am a member of</text><text x="928.0" y="265.0" font-size="21" font-weight="400" class="f">one body of</text><text x="928.0" y="297.5" font-size="21" font-weight="400" class="f">reasoning beings,</text><text x="928.0" y="330.1" font-size="21" font-weight="400" class="f">made for a shared life</text><text x="928.0" y="362.6" font-size="21" font-weight="400" class="f">with them.</text><text x="928.0" y="398.6" font-size="16" font-weight="600" class="mu">gathers claims 1 and 2</text><text x="248.0" y="558.7" font-size="15" font-weight="600" class="mu">Said once, kept apart: 7.10 (a practice); 11.7 (a warning)</text><text x="928.0" y="453.6" font-size="16" font-weight="700">How to read it</text><text x="928.0" y="477.6" font-size="16" font-weight="500" class="mu">A coloured line under words:</text><text x="928.0" y="497.6" font-size="16" font-weight="500" class="mu">a passage that says them;</text><text x="928.0" y="517.6" font-size="16" font-weight="500" class="mu">its curve leads to the</text><text x="928.0" y="537.6" font-size="16" font-weight="500" class="mu">number.</text><g class="dg-foot"><g transform="translate(56,578.9) scale(1.105)"><rect width="19" height="19" rx="5.5" class="ink"/><rect x="8.3" y="7.6" width="2.4" height="7" rx=".8" class="bg"/><circle cx="9.5" cy="4.9" r="1.35" class="ac"/></g><text x="86.5" y="597.0" font-size="21" font-weight="650" class="mu">ilyadays.com · Stoic Constitution</text><text x="1144.0" y="597.0" font-size="21" font-weight="500" text-anchor="end" class="mu">Figure 4 · How the Constitution was made</text></g></svg>
