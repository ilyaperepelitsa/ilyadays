<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="dg-svg share" viewBox="0 0 1200 627" width="1200" height="627" role="img" aria-labelledby="fusion-ru-landscape-t fusion-ru-landscape-d"><title id="fusion-ru-landscape-t">Как раздел сливается в статью</title><desc id="fusion-ru-landscape-d">Статья 1: 10 фрагментов слева питают 5 утверждений; цветные линии под словами показывают, какие фрагменты их подкрепляют (5 цветов на 9 цитируемых фрагментов, у двух фрагментов одного утверждения цвета всегда разные; различают их номера); два пункта сказаны однажды одним фрагментом; утверждения собраны в положение «Я часть единого тела разумных существ, созданная для общей жизни с ними.» Слова «потому что» в утверждении 5 — вывод редактора, фиолетовым.</desc><style>svg{--dg-bg:#ffffff;--dg-ink:#171b22;--dg-mu:#626c7a;--dg-line:#dfe4eb;--dg-faint:#d3d9e1;--dg-soft:#f1f3f6;--dg-accent:#c64227;--dg-e:#55468f;--dg-et:#ece9f6;--dg-p1:#4379f9;--dg-p2:#cc689e;--dg-p3:#853f13;--dg-p4:#989401;--dg-p5:#861192;--dg-c1:#2a62b8;--dg-c2:#cf5a2e;--dg-c3:#17998a;--dg-c4:#c99412;--dg-c5:#cc6593;--dg-c6:#5e8c1f;--dg-c7:#7656c9;--dg-fb:#2a62b8;--dg-fa:#17998a;--dg-fl:#c64227;--dg-d1:#1d3f73;--dg-d2:#4f7fc4;--dg-d3:#8fb0e3;--dg-d4:#b7bec8;--dg-sans:Manrope, system-ui, -apple-system, 'Segoe UI', sans-serif;--dg-serif:Georgia, 'Times New Roman', serif}.dg-svg{font-family:var(--dg-sans);overflow:visible}.dg-svg text{fill:var(--dg-ink);font-family:var(--dg-sans)}.dg-svg .f{font-family:var(--dg-serif)}.dg-svg .mu{fill:var(--dg-mu)}.dg-svg .ac{fill:var(--dg-accent)}.dg-svg .halo{paint-order:stroke;stroke:var(--dg-bg);stroke-width:5px;stroke-linejoin:round}.dg-svg .bg{fill:var(--dg-bg)}.dg-svg .soft{fill:var(--dg-soft)}.dg-svg .faint{fill:var(--dg-faint)}.dg-svg .ink{fill:var(--dg-ink)}.dg-svg .k{stroke:var(--dg-ink)}.dg-svg .km{stroke:var(--dg-mu)}.dg-svg .kl{stroke:var(--dg-line)}.dg-svg .kf{stroke:var(--dg-faint)}.dg-svg .kb{stroke:var(--dg-bg)}.dg-svg .nf{fill:none}.dg-svg .sac{stroke:var(--dg-accent)}.dg-svg .ef{fill:var(--dg-e)}.dg-svg .etf{fill:var(--dg-et)}.dg-svg .ek{stroke:var(--dg-e)}.dg-svg .p1{fill:var(--dg-p1)}.dg-svg .sp1{stroke:var(--dg-p1)}.dg-svg .p2{fill:var(--dg-p2)}.dg-svg .sp2{stroke:var(--dg-p2)}.dg-svg .p3{fill:var(--dg-p3)}.dg-svg .sp3{stroke:var(--dg-p3)}.dg-svg .p4{fill:var(--dg-p4)}.dg-svg .sp4{stroke:var(--dg-p4)}.dg-svg .p5{fill:var(--dg-p5)}.dg-svg .sp5{stroke:var(--dg-p5)}.dg-svg .c1{fill:var(--dg-c1)}.dg-svg .sc1{stroke:var(--dg-c1)}.dg-svg .c2{fill:var(--dg-c2)}.dg-svg .sc2{stroke:var(--dg-c2)}.dg-svg .c3{fill:var(--dg-c3)}.dg-svg .sc3{stroke:var(--dg-c3)}.dg-svg .c4{fill:var(--dg-c4)}.dg-svg .sc4{stroke:var(--dg-c4)}.dg-svg .c5{fill:var(--dg-c5)}.dg-svg .sc5{stroke:var(--dg-c5)}.dg-svg .c6{fill:var(--dg-c6)}.dg-svg .sc6{stroke:var(--dg-c6)}.dg-svg .c7{fill:var(--dg-c7)}.dg-svg .sc7{stroke:var(--dg-c7)}.dg-svg .fb{fill:var(--dg-fb)}.dg-svg .sfb{stroke:var(--dg-fb)}.dg-svg .fa{fill:var(--dg-fa)}.dg-svg .sfa{stroke:var(--dg-fa)}.dg-svg .fl{fill:var(--dg-fl)}.dg-svg .sfl{stroke:var(--dg-fl)}.dg-svg .d1{fill:var(--dg-d1)}.dg-svg .sd1{stroke:var(--dg-d1)}.dg-svg .d2{fill:var(--dg-d2)}.dg-svg .sd2{stroke:var(--dg-d2)}.dg-svg .d3{fill:var(--dg-d3)}.dg-svg .sd3{stroke:var(--dg-d3)}.dg-svg .d4{fill:var(--dg-d4)}.dg-svg .sd4{stroke:var(--dg-d4)}</style><rect width="1200" height="627" class="bg"/><text x="56.0" y="70.0" font-size="38" font-weight="400" class="f">Как раздел сливается в статью</text><text x="56.0" y="108.5" font-size="22" font-weight="500" class="mu">Статья 1 «Часть единого тела». 5 цветов на 9 цитируемых фрагментов: два фрагмента одного</text><text x="56.0" y="138.4" font-size="22" font-weight="500" class="mu">утверждения никогда не делят цвет, остальные различают номера.</text><path d="M138.0 304.8 C190.8 304.8 190.8 193.9 234.0 193.9" class="nf sp3" stroke-width="1.8" opacity=".9"/><path d="M138.0 341.7 C190.8 341.7 190.8 203.7 234.0 203.7" class="nf sp4" stroke-width="1.8" opacity=".9"/><path d="M138.0 378.7 C190.8 378.7 190.8 213.6 234.0 213.6" class="nf sp1" stroke-width="1.8" opacity=".9"/><path d="M138.0 415.6 C190.8 415.6 190.8 223.5 234.0 223.5" class="nf sp5" stroke-width="1.8" opacity=".9"/><path d="M138.0 193.9 C190.8 193.9 190.8 233.3 234.0 233.3" class="nf sp2" stroke-width="1.8" opacity=".9"/><path d="M138.0 304.8 C190.8 304.8 190.8 273.3 234.0 273.3" class="nf sp3" stroke-width="1.8" opacity=".9"/><path d="M138.0 193.9 C190.8 193.9 190.8 288.1 234.0 288.1" class="nf sp2" stroke-width="1.8" opacity=".9"/><path d="M138.0 230.9 C190.8 230.9 190.8 302.9 234.0 302.9" class="nf sp5" stroke-width="1.8" opacity=".9"/><path d="M138.0 378.7 C190.8 378.7 190.8 352.7 234.0 352.7" class="nf sp1" stroke-width="1.8" opacity=".9"/><path d="M138.0 452.6 C190.8 452.6 190.8 372.5 234.0 372.5" class="nf sp2" stroke-width="1.8" opacity=".9"/><path d="M138.0 526.5 C190.8 526.5 190.8 422.3 234.0 422.3" class="nf sp4" stroke-width="1.8" opacity=".9"/><path d="M138.0 267.8 C190.8 267.8 190.8 437.1 234.0 437.1" class="nf sp3" stroke-width="1.8" opacity=".9"/><path d="M138.0 378.7 C190.8 378.7 190.8 451.9 234.0 451.9" class="nf sp1" stroke-width="1.8" opacity=".9"/><path d="M138.0 526.5 C190.8 526.5 190.8 491.4 234.0 491.4" class="nf sp4" stroke-width="1.8" opacity=".9"/><path d="M138.0 267.8 C190.8 267.8 190.8 500.7 234.0 500.7" class="nf sp3" stroke-width="1.8" opacity=".9"/><path d="M138.0 193.9 C190.8 193.9 190.8 510.1 234.0 510.1" class="nf sp2" stroke-width="1.8" opacity=".9"/><text x="248.0" y="192.4" font-size="14" font-weight="650" class="mu">Утверждение 1 · Почему · Что мы такое</text><line x1="248.5" y1="218.4" x2="385.6" y2="218.4" class="sp2" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="222.4" x2="385.6" y2="222.4" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="394.2" y1="218.4" x2="575.0" y2="218.4" class="sp2" stroke-width="2.2" stroke-linecap="butt"/><line x1="394.2" y1="222.4" x2="575.0" y2="222.4" class="sp5" stroke-width="2.2" stroke-linecap="butt"/><line x1="583.7" y1="218.4" x2="755.5" y2="218.4" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="764.2" y1="218.4" x2="846.5" y2="218.4" class="sp1" stroke-width="2.2" stroke-linecap="butt"/><line x1="764.2" y1="222.4" x2="846.5" y2="222.4" class="sp4" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="240.2" x2="350.0" y2="240.2" class="sp1" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="244.2" x2="350.0" y2="244.2" class="sp4" stroke-width="2.2" stroke-linecap="butt"/><line x1="369.9" y1="240.2" x2="670.9" y2="240.2" class="sp5" stroke-width="2.2" stroke-linecap="butt"/><text x="248.0" y="215.4" font-size="15" font-weight="400" class="f">Всё, что рассуждает, причастно одному разуму, как части — одному телу, граждане —</text><text x="248.0" y="237.2" font-size="15" font-weight="400" class="f">одному городу, а всякое освещённое место — одному солнцу.</text><text x="248.0" y="266.9" font-size="14" font-weight="650" class="mu">Утверждение 2 · Почему · Для чего мы</text><line x1="248.5" y1="292.9" x2="334.8" y2="292.9" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="296.9" x2="334.8" y2="296.9" class="sp5" stroke-width="2.2" stroke-linecap="butt"/><line x1="339.5" y1="292.9" x2="440.5" y2="292.9" class="sp2" stroke-width="2.2" stroke-linecap="butt"/><line x1="339.5" y1="296.9" x2="440.5" y2="296.9" class="sp5" stroke-width="2.2" stroke-linecap="butt"/><line x1="457.9" y1="292.9" x2="624.5" y2="292.9" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="645.9" y1="292.9" x2="820.7" y2="292.9" class="sp5" stroke-width="2.2" stroke-linecap="butt"/><line x1="784.8" y1="296.9" x2="820.7" y2="296.9" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="314.7" x2="375.7" y2="314.7" class="sp5" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="318.7" x2="375.7" y2="318.7" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><text x="248.0" y="289.9" font-size="15" font-weight="400" class="f">Мы созданы друг для друга и для одного общего дела, и эта общая жизнь — наше</text><text x="248.0" y="311.7" font-size="15" font-weight="400" class="f">собственное благо.</text><text x="248.0" y="341.4" font-size="14" font-weight="650" class="mu">Утверждение 3 · На деле · Что из этого следует для действия</text><line x1="312.9" y1="367.4" x2="486.2" y2="367.4" class="sp1" stroke-width="2.2" stroke-linecap="butt"/><line x1="528.4" y1="367.4" x2="703.9" y2="367.4" class="sp1" stroke-width="2.2" stroke-linecap="butt"/><line x1="528.4" y1="371.4" x2="703.9" y2="371.4" class="sp2" stroke-width="2.2" stroke-linecap="butt"/><line x1="725.0" y1="367.4" x2="866.9" y2="367.4" class="sp1" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="389.2" x2="577.7" y2="389.2" class="sp2" stroke-width="2.2" stroke-linecap="butt"/><text x="248.0" y="364.4" font-size="15" font-weight="400" class="f">Поэтому всё, что я делаю, должно быть нацелено на общее благо — прямо или издалека, и</text><text x="248.0" y="386.2" font-size="15" font-weight="400" class="f">верность этой одной цели делает меня единым.</text><text x="248.0" y="415.9" font-size="14" font-weight="650" class="mu">Утверждение 4 · Когда не выходит · К чему ведёт разрыв</text><line x1="248.5" y1="441.9" x2="428.6" y2="441.9" class="sp4" stroke-width="2.2" stroke-linecap="butt"/><line x1="437.3" y1="441.9" x2="591.4" y2="441.9" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="626.7" y1="441.9" x2="809.5" y2="441.9" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="818.2" y1="441.9" x2="885.9" y2="441.9" class="sp1" stroke-width="2.2" stroke-linecap="butt"/><line x1="818.2" y1="445.9" x2="885.9" y2="445.9" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="818.2" y1="449.9" x2="885.9" y2="449.9" class="sp4" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="463.7" x2="277.9" y2="463.7" class="sp1" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="467.7" x2="277.9" y2="467.7" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="471.7" x2="277.9" y2="471.7" class="sp4" stroke-width="2.2" stroke-linecap="butt"/><line x1="519.5" y1="463.7" x2="585.0" y2="463.7" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="519.5" y1="467.7" x2="585.0" y2="467.7" class="sp4" stroke-width="2.2" stroke-linecap="butt"/><text x="248.0" y="438.9" font-size="15" font-weight="400" class="f">Когда я ненавижу кого-то, поступаю с ним дурно или досадую на происходящее, я отсекаю</text><text x="248.0" y="460.7" font-size="15" font-weight="400" class="f">себя — и не только от этого одного, но от целого.</text><text x="248.0" y="490.4" font-size="14" font-weight="650" class="mu">Утверждение 5 · Когда не выходит · Путь назад</text><line x1="377.6" y1="516.4" x2="514.8" y2="516.4" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="377.6" y1="520.4" x2="570.1" y2="520.4" class="sp4" stroke-width="2.2" stroke-linecap="butt"/><line x1="660.1" y1="516.4" x2="864.9" y2="516.4" class="sp2" stroke-width="2.2" stroke-linecap="butt"/><rect x="575.3" y="501.1" width="83.7" height="16.8" rx="3" class="etf"/><text x="248.0" y="513.4" font-size="15" font-weight="400" class="f">Если я отсёк себя, я могу снова врасти в целое, <tspan class="ef">потому что</tspan> природа сильнее моего ухода.</text><text x="888.0" y="490.4" font-size="14" font-weight="650" text-anchor="end" class="ef">вывод редактора</text><rect x="56.0" y="180.4" width="80.0" height="27.0" rx="13.5" class="bg sp2" stroke-width="2.6"/><text x="96.0" y="199.7" font-size="16" font-weight="700" text-anchor="middle">9.7</text><rect x="56.0" y="217.4" width="80.0" height="27.0" rx="13.5" class="bg sp5" stroke-width="2.6"/><text x="96.0" y="236.6" font-size="16" font-weight="700" text-anchor="middle">5.15</text><rect x="56.0" y="254.3" width="80.0" height="27.0" rx="13.5" class="bg sp3" stroke-width="2.6"/><text x="96.0" y="2