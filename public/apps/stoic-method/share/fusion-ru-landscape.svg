<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="dg-svg share" viewBox="0 0 1200 627" width="1200" height="627" role="img" aria-labelledby="fusion-ru-landscape-t fusion-ru-landscape-d"><title id="fusion-ru-landscape-t">Как раздел сливается в статью</title><desc id="fusion-ru-landscape-d">Статья 1: 10 фрагментов слева питают 5 утверждений; цветные линии под словами показывают, какие фрагменты их подкрепляют; два пункта сказаны однажды одним фрагментом; утверждения собраны в положение «Я член единого тела разумных существ, созданный для общей жизни с ними.» Слова «потому что» в утверждении 5 — вывод редактора, фиолетовым.</desc><style>svg{--dg-bg:#ffffff;--dg-ink:#171b22;--dg-mu:#626c7a;--dg-line:#dfe4eb;--dg-faint:#d3d9e1;--dg-soft:#f1f3f6;--dg-accent:#c64227;--dg-e:#55468f;--dg-et:#ece9f6;--dg-p1:#4379f9;--dg-p2:#cc689e;--dg-p3:#853f13;--dg-p4:#989401;--dg-p5:#861192;--dg-c1:#2a62b8;--dg-c2:#cf5a2e;--dg-c3:#17998a;--dg-c4:#c99412;--dg-c5:#cc6593;--dg-c6:#5e8c1f;--dg-c7:#7656c9;--dg-fb:#2a62b8;--dg-fa:#17998a;--dg-fl:#c64227;--dg-d1:#1d3f73;--dg-d2:#4f7fc4;--dg-d3:#8fb0e3;--dg-d4:#b7bec8;--dg-sans:Manrope, system-ui, -apple-system, 'Segoe UI', sans-serif;--dg-serif:Georgia, 'Times New Roman', serif}.dg-svg{font-family:var(--dg-sans);overflow:visible}.dg-svg text{fill:var(--dg-ink);font-family:var(--dg-sans)}.dg-svg .f{font-family:var(--dg-serif)}.dg-svg .mu{fill:var(--dg-mu)}.dg-svg .ac{fill:var(--dg-accent)}.dg-svg .halo{paint-order:stroke;stroke:var(--dg-bg);stroke-width:5px;stroke-linejoin:round}.dg-svg .bg{fill:var(--dg-bg)}.dg-svg .soft{fill:var(--dg-soft)}.dg-svg .faint{fill:var(--dg-faint)}.dg-svg .ink{fill:var(--dg-ink)}.dg-svg .k{stroke:var(--dg-ink)}.dg-svg .km{stroke:var(--dg-mu)}.dg-svg .kl{stroke:var(--dg-line)}.dg-svg .kf{stroke:var(--dg-faint)}.dg-svg .kb{stroke:var(--dg-bg)}.dg-svg .nf{fill:none}.dg-svg .sac{stroke:var(--dg-accent)}.dg-svg .ef{fill:var(--dg-e)}.dg-svg .etf{fill:var(--dg-et)}.dg-svg .ek{stroke:var(--dg-e)}.dg-svg .p1{fill:var(--dg-p1)}.dg-svg .sp1{stroke:var(--dg-p1)}.dg-svg .p2{fill:var(--dg-p2)}.dg-svg .sp2{stroke:var(--dg-p2)}.dg-svg .p3{fill:var(--dg-p3)}.dg-svg .sp3{stroke:var(--dg-p3)}.dg-svg .p4{fill:var(--dg-p4)}.dg-svg .sp4{stroke:var(--dg-p4)}.dg-svg .p5{fill:var(--dg-p5)}.dg-svg .sp5{stroke:var(--dg-p5)}.dg-svg .c1{fill:var(--dg-c1)}.dg-svg .sc1{stroke:var(--dg-c1)}.dg-svg .c2{fill:var(--dg-c2)}.dg-svg .sc2{stroke:var(--dg-c2)}.dg-svg .c3{fill:var(--dg-c3)}.dg-svg .sc3{stroke:var(--dg-c3)}.dg-svg .c4{fill:var(--dg-c4)}.dg-svg .sc4{stroke:var(--dg-c4)}.dg-svg .c5{fill:var(--dg-c5)}.dg-svg .sc5{stroke:var(--dg-c5)}.dg-svg .c6{fill:var(--dg-c6)}.dg-svg .sc6{stroke:var(--dg-c6)}.dg-svg .c7{fill:var(--dg-c7)}.dg-svg .sc7{stroke:var(--dg-c7)}.dg-svg .fb{fill:var(--dg-fb)}.dg-svg .sfb{stroke:var(--dg-fb)}.dg-svg .fa{fill:var(--dg-fa)}.dg-svg .sfa{stroke:var(--dg-fa)}.dg-svg .fl{fill:var(--dg-fl)}.dg-svg .sfl{stroke:var(--dg-fl)}.dg-svg .d1{fill:var(--dg-d1)}.dg-svg .sd1{stroke:var(--dg-d1)}.dg-svg .d2{fill:var(--dg-d2)}.dg-svg .sd2{stroke:var(--dg-d2)}.dg-svg .d3{fill:var(--dg-d3)}.dg-svg .sd3{stroke:var(--dg-d3)}.dg-svg .d4{fill:var(--dg-d4)}.dg-svg .sd4{stroke:var(--dg-d4)}</style><rect width="1200" height="627" class="bg"/><text x="56.0" y="70.0" font-size="38" font-weight="400" class="f">Как раздел сливается в статью</text><text x="56.0" y="108.5" font-size="22" font-weight="500" class="mu">Статья 1 «Член единого тела»: у каждого фрагмента свой цвет — от утверждений до слов.</text><path d="M138.0 286.8 C190.8 286.8 190.8 165.1 234.0 165.1" class="nf sp3" stroke-width="1.8" opacity=".9"/><path d="M138.0 327.8 C190.8 327.8 190.8 175.6 234.0 175.6" class="nf sp4" stroke-width="1.8" opacity=".9"/><path d="M138.0 368.7 C190.8 368.7 190.8 186.2 234.0 186.2" class="nf sp1" stroke-width="1.8" opacity=".9"/><path d="M138.0 409.7 C190.8 409.7 190.8 196.8 234.0 196.8" class="nf sp5" stroke-width="1.8" opacity=".9"/><path d="M138.0 164.0 C190.8 164.0 190.8 207.3 234.0 207.3" class="nf sp2" stroke-width="1.8" opacity=".9"/><path d="M138.0 286.8 C190.8 286.8 190.8 250.2 234.0 250.2" class="nf sp3" stroke-width="1.8" opacity=".9"/><path d="M138.0 164.0 C190.8 164.0 190.8 266.0 234.0 266.0" class="nf sp2" stroke-width="1.8" opacity=".9"/><path d="M138.0 204.9 C190.8 204.9 190.8 281.9 234.0 281.9" class="nf sp5" stroke-width="1.8" opacity=".9"/><path d="M138.0 368.7 C190.8 368.7 190.8 335.2 234.0 335.2" class="nf sp1" stroke-width="1.8" opacity=".9"/><path d="M138.0 450.6 C190.8 450.6 190.8 356.4 234.0 356.4" class="nf sp2" stroke-width="1.8" opacity=".9"/><path d="M138.0 532.5 C190.8 532.5 190.8 409.8 234.0 409.8" class="nf sp4" stroke-width="1.8" opacity=".9"/><path d="M138.0 245.9 C190.8 245.9 190.8 425.6 234.0 425.6" class="nf sp3" stroke-width="1.8" opacity=".9"/><path d="M138.0 368.7 C190.8 368.7 190.8 441.5 234.0 441.5" class="nf sp1" stroke-width="1.8" opacity=".9"/><path d="M138.0 532.5 C190.8 532.5 190.8 483.6 234.0 483.6" class="nf sp4" stroke-width="1.8" opacity=".9"/><path d="M138.0 245.9 C190.8 245.9 190.8 493.4 234.0 493.4" class="nf sp3" stroke-width="1.8" opacity=".9"/><path d="M138.0 164.0 C190.8 164.0 190.8 503.2 234.0 503.2" class="nf sp2" stroke-width="1.8" opacity=".9"/><text x="248.0" y="163.5" font-size="15" font-weight="650" class="mu">Утверждение 1 · Почему · Что мы такое</text><line x1="248.5" y1="190.7" x2="394.8" y2="190.7" class="sp2" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="194.7" x2="394.8" y2="194.7" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="404.0" y1="190.7" x2="596.9" y2="190.7" class="sp2" stroke-width="2.2" stroke-linecap="butt"/><line x1="404.0" y1="194.7" x2="596.9" y2="194.7" class="sp5" stroke-width="2.2" stroke-linecap="butt"/><line x1="606.0" y1="190.7" x2="795.6" y2="190.7" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="804.8" y1="190.7" x2="875.1" y2="190.7" class="sp1" stroke-width="2.2" stroke-linecap="butt"/><line x1="804.8" y1="194.7" x2="875.1" y2="194.7" class="sp4" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="214.7" x2="374.5" y2="214.7" class="sp1" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="218.7" x2="374.5" y2="218.7" class="sp4" stroke-width="2.2" stroke-linecap="butt"/><line x1="395.5" y1="214.7" x2="716.7" y2="214.7" class="sp5" stroke-width="2.2" stroke-linecap="butt"/><text x="248.0" y="187.5" font-size="16" font-weight="400" class="f">Всё, что рассуждает, причастно одному разуму, как члены — одному телу, граждане</text><text x="248.0" y="211.5" font-size="16" font-weight="400" class="f">— одному городу, а всякое освещённое место — одному солнцу.</text><text x="248.0" y="243.3" font-size="15" font-weight="650" class="mu">Утверждение 2 · Почему · Для чего мы</text><line x1="248.5" y1="270.5" x2="340.7" y2="270.5" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="274.5" x2="340.7" y2="274.5" class="sp5" stroke-width="2.2" stroke-linecap="butt"/><line x1="345.5" y1="270.5" x2="453.3" y2="270.5" class="sp2" stroke-width="2.2" stroke-linecap="butt"/><line x1="345.5" y1="274.5" x2="453.3" y2="274.5" class="sp5" stroke-width="2.2" stroke-linecap="butt"/><line x1="471.9" y1="270.5" x2="649.6" y2="270.5" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="672.4" y1="270.5" x2="858.9" y2="270.5" class="sp5" stroke-width="2.2" stroke-linecap="butt"/><line x1="820.6" y1="274.5" x2="858.9" y2="274.5" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="294.5" x2="384.2" y2="294.5" class="sp5" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="298.5" x2="384.2" y2="298.5" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><text x="248.0" y="267.3" font-size="16" font-weight="400" class="f">Мы созданы друг для друга и для одного общего дела, и эта общая жизнь — наше</text><text x="248.0" y="291.3" font-size="16" font-weight="400" class="f">собственное благо.</text><text x="248.0" y="323.1" font-size="15" font-weight="650" class="mu">Утверждение 3 · На деле · Что из этого следует для действия</text><line x1="317.2" y1="350.3" x2="502.1" y2="350.3" class="sp1" stroke-width="2.2" stroke-linecap="butt"/><line x1="547.1" y1="350.3" x2="734.3" y2="350.3" class="sp1" stroke-width="2.2" stroke-linecap="butt"/><line x1="547.1" y1="354.3" x2="734.3" y2="354.3" class="sp2" stroke-width="2.2" stroke-linecap="butt"/><line x1="756.7" y1="350.3" x2="836.1" y2="350.3" class="sp1" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="374.3" x2="315.8" y2="374.3" class="sp1" stroke-width="2.2" stroke-linecap="butt"/><line x1="338.6" y1="374.3" x2="689.8" y2="374.3" class="sp2" stroke-width="2.2" stroke-linecap="butt"/><text x="248.0" y="347.1" font-size="16" font-weight="400" class="f">Поэтому всё, что я делаю, должно быть нацелено на общее благо — прямо или</text><text x="248.0" y="371.1" font-size="16" font-weight="400" class="f">издалека, и верность этой одной цели делает меня единым.</text><text x="248.0" y="402.9" font-size="15" font-weight="650" class="mu">Утверждение 4 · Когда не выходит · Что делает разрыв</text><line x1="248.5" y1="430.1" x2="440.7" y2="430.1" class="sp4" stroke-width="2.2" stroke-linecap="butt"/><line x1="449.9" y1="430.1" x2="614.3" y2="430.1" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="651.9" y1="430.1" x2="847.0" y2="430.1" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="856.1" y1="430.1" x2="863.9" y2="430.1" class="sp1" stroke-width="2.2" stroke-linecap="butt"/><line x1="856.1" y1="434.1" x2="863.9" y2="434.1" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="856.1" y1="438.1" x2="863.9" y2="438.1" class="sp4" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="454.1" x2="344.4" y2="454.1" class="sp1" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="458.1" x2="344.4" y2="458.1" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="462.1" x2="344.4" y2="462.1" class="sp4" stroke-width="2.2" stroke-linecap="butt"/><line x1="602.1" y1="454.1" x2="672.0" y2="454.1" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="602.1" y1="458.1" x2="672.0" y2="458.1" class="sp4" stroke-width="2.2" stroke-linecap="butt"/><text x="248.0" y="426.9" font-size="16" font-weight="400" class="f">Когда я ненавижу кого-то, поступаю с ним дурно или досадую на происходящее, я</text><text x="248.0" y="450.9" font-size="16" font-weight="400" class="f">отсекаю себя — и не только от этого одного, но от целого.</text><text x="248.0" y="482.7" font-size="15" font-weight="650" class="mu">Утверждение 5 · Когда не выходит · Путь назад</text><line x1="359.8" y1="509.9" x2="506.2" y2="509.9" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="359.8" y1="513.9" x2="565.2" y2="513.9" class="sp4" stroke-width="2.2" stroke-linecap="butt"/><line x1="661.2" y1="509.9" x2="879.7" y2="509.9" class="sp2" stroke-width="2.2" stroke-linecap="butt"/><rect x="570.9" y="493.6" width="88.9" height="17.9" rx="3" class="etf"/><text x="248.0" y="506.7" font-size="16" font-weight="400" class="f">Отсёкши себя, я могу снова врасти в целое, <tspan class="ef">потому что</tspan> природа сильнее моего ухода.</text><text x="888.0" y="482.7" font-size="15" font-weight="650" text-anchor="end" class="ef">вывод редактора</text><rect x="56.0" y="150.5" width="80.0" height="27.0" rx="13.5" class="bg sp2" stroke-width="2.6"/><text x="96.0" y="169.8" font-size="16" font-weight="700" text-anchor="middle">9.7</text><rect x="56.0" y="191.4" width="80.0" height="27.0" rx="13.5" class="bg sp5" stroke-width="2.6"/><text x="96.0" y="210.7" font-size="16" font-weight="700" text-anchor="middle">5.15</text><rect x="56.0" y="232.4" width="80.0" height="27.0" rx="13.5" class="bg sp3" stroke-width="2.6"/><text x="96.0" y="251.6" font-size="16" font-weight="700" text-anchor="middle">8.32</text><rect x="56.0" y="273.3" width="80.0" height="27.0" rx="13.5" class="bg sp3" stroke-width="2.6"/><text x="96.0" y="292.6" font-size="16" font-weight="700" text-anchor="middle">7.10</text><rect x="56.0" y="314.3" width="80.0" height="27.0" rx="13.5" class="bg sp4" stroke-width="2.6"/><text x="96.0" y="333.5" font-size="16" font-weight="700" text-anchor="middle">4.4</text><rect x="56.0" y="355.2" width="80.0" height="27.0" rx="13.5" class="bg sp1" stroke-width="2.6"/><text x="96.0" y="374.5" font-size="16" font-weight="700" text-anchor="middle">9.21</text><rect x="56.0" y="396.2" width="80.0" height="27.0" rx="13.5" class="bg sp5" stroke-width="2.6"/><text x="96.0" y="415.4" font-size="16" font-weight="700" text-anchor="middle">12.23</text><rect x="56.0" y="437.1" width="80.0" height="27.0" rx="13.5" class="bg sp2" stroke-width="2.6"/><text x="96.0" y="456.4" font-size="16" font-weight="700" text-anchor="middle">11.19</text><rect x="56.0" y="478.1" width="80.0" height="27.0" rx="13.5" class="nf kf" stroke-width="2"/><text x="96.0" y="497.3" font-size="16" font-weight="700" text-anchor="middle" class="mu">8.52</text><text x="144.0" y="497.3" font-size="16" font-weight="600" class="mu halo">отложен</text><rect x="56.0" y="519.0" width="80.0" height="27.0" rx="13.5" class="bg sp4" stroke-width="2.6"/><text x="96.0" y="538.3" font-size="16" font-weight="700" text-anchor="middle">11.7</text><line x1="238.0" y1="154.5" x2="238.0" y2="217.9" class="kl" stroke-width="3" stroke-linecap="round"/><line x1="238.0" y1="234.3" x2="238.0" y2="297.7" class="kl" stroke-width="3" stroke-linecap="round"/><line x1="238.0" y1="314.1" x2="238.0" y2="377.5" class="kl" stroke-width="3" stroke-linecap="round"/><line x1="238.0" y1="393.9" x2="238.0" y2="457.3" class="kl" stroke-width="3" stroke-linecap="round"/><line x1="238.0" y1="473.7" x2="238.0" y2="513.1" class="kl" stroke-width="3" stroke-linecap="round"/><rect x="912.0" y="142.5" width="232.0" height="247.2" rx="10" class="nf k" stroke-width="1.4"/><text x="928.0" y="166.5" font-size="16" font-weight="650" class="mu">Положение</text><line x1="948.2" y1="207.5" x2="994.4" y2="207.5" class="sp1" stroke-width="2.4" stroke-linecap="butt"/><line x1="948.2" y1="211.7" x2="994.4" y2="211.7" class="sp3" stroke-width="2.4" stroke-linecap="butt"/><line x1="1000.4" y1="207.5" x2="1126.7" y2="207.5" class="sp3" stroke-width="2.4" stroke-linecap="butt"/><line x1="1000.4" y1="211.7" x2="1126.7" y2="211.7" class="sp4" stroke-width="2.4" stroke-linecap="butt"/><line x1="928.5" y1="240.1" x2="1108.2" y2="240.1" class="sp2" stroke-width="2.4" stroke-linecap="butt"/><line x1="928.5" y1="244.2" x2="1108.2" y2="244.2" class="sp3" stroke-width="2.4" stroke-linecap="butt"/><line x1="928.5" y1="272.6" x2="1075.5" y2="272.6" class="sp3" stroke-width="2.4" stroke-linecap="butt"/><line x1="928.5" y1="276.8" x2="1075.5" y2="276.8" class="sp5" stroke-width="2.4" stroke-linecap="butt"/><line x1="928.5" y1="305.1" x2="1076.0" y2="305.1" class="sp3" stroke-width="2.4" stroke-linecap="butt"/><line x1="928.5" y1="309.3" x2="1076.0" y2="309.3" class="sp5" stroke-width="2.4" stroke-linecap="butt"/><line x1="928.5" y1="337.7" x2="981.0" y2="337.7" class="sp3" stroke-width="2.4" stroke-linecap="butt"/><line x1="928.5" y1="341.9" x2="981.0" y2="341.9" class="sp5" stroke-width="2.4" stroke-linecap="butt"/><text x="928.0" y="202.5" font-size="21" font-weight="400" class="f">Я член единого тела</text><text x="928.0" y="235.1" font-size="21" font-weight="400" class="f">разумных существ,</text><text x="928.0" y="267.6" font-size="21" font-weight="400" class="f">созданный для</text><text x="928.0" y="300.1" font-size="21" font-weight="400" class="f">общей жизни с</text><text x="928.0" y="332.7" font-size="21" font-weight="400" class="f">ними.</text><text x="928.0" y="368.7" font-size="16" font-weight="600" class="mu">собирает утв. 1 и 2</text><text x="248.0" y="577.0" font-size="15" font-weight="600" class="mu">Сказано однажды, отдельно: 7.10 (упражнение); 11.7 (предупреждение)</text><text x="928.0" y="423.7" font-size="16" font-weight="700">Как читать</text><text x="928.0" y="447.7" font-size="16" font-weight="500" class="mu">Цветная линия под</text><text x="928.0" y="467.7" font-size="16" font-weight="500" class="mu">словами — фрагмент,</text><text x="928.0" y="487.7" font-size="16" font-weight="500" class="mu">который их говорит. Две</text><text x="928.0" y="507.7" font-size="16" font-weight="500" class="mu">линии — говорят два</text><text x="928.0" y="527.7" font-size="16" font-weight="500" class="mu">фрагмента.</text><g transform="translate(56,578.9) scale(1.105)"><rect width="19" height="19" rx="5.5" class="ink"/><rect x="8.3" y="7.6" width="2.4" height="7" rx=".8" class="bg"/><circle cx="9.5" cy="4.9" r="1.35" class="ac"/></g><text x="86.5" y="597.0" font-size="21" font-weight="650" class="mu">ilyadays.com · Стоическая конституция</text><text x="1144.0" y="597.0" font-size="21" font-weight="500" text-anchor="end" class="mu">Рис. 4 · Как сделана конституция</text></svg>
