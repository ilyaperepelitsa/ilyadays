<svg xmlns="http://www.w3.org/2000/svg" class="dg-svg share" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-labelledby="translation-en-square-dark-t translation-en-square-dark-d"><title id="translation-en-square-dark-t">Three readings for every passage</title><desc id="translation-en-square-dark-d">Three lanes. Greek to English: 418 passages, points settled 969 accepted, 465 partly, 189 declined. Latin to English: 304 sections, 716, 349, 86. English to Russian: 722 passages, 150, 57, 7.</desc><style>svg{--dg-bg:#191e26;--dg-ink:#edf1f7;--dg-mu:#a5afbf;--dg-line:#303947;--dg-faint:#3a4453;--dg-soft:#222932;--dg-accent:#ffa080;--dg-e:#b9adf0;--dg-et:#2e2948;--dg-p1:#2f63e1;--dg-p2:#a95e86;--dg-p3:#d63a00;--dg-p4:#437f43;--dg-p5:#2a97bf;--dg-c1:#4a86e0;--dg-c2:#e06a3a;--dg-c3:#1a9f8f;--dg-c4:#b98914;--dg-c5:#d06898;--dg-c6:#73a62c;--dg-c7:#8c74e4;--dg-fb:#4a86e0;--dg-fa:#1a9f8f;--dg-fl:#e0583a;--dg-d1:#cfe0fa;--dg-d2:#7fa7e6;--dg-d3:#3f6fbf;--dg-d4:#59616d;--dg-sans:Manrope, system-ui, -apple-system, 'Segoe UI', sans-serif;--dg-serif:Georgia, 'Times New Roman', serif}.dg-svg{font-family:var(--dg-sans);overflow:visible}.dg-svg text{fill:var(--dg-ink);font-family:var(--dg-sans)}.dg-svg .f{font-family:var(--dg-serif)}.dg-svg .mu{fill:var(--dg-mu)}.dg-svg .ac{fill:var(--dg-accent)}.dg-svg .halo{paint-order:stroke;stroke:var(--dg-bg);stroke-width:5px;stroke-linejoin:round}.dg-svg .bg{fill:var(--dg-bg)}.dg-svg .soft{fill:var(--dg-soft)}.dg-svg .faint{fill:var(--dg-faint)}.dg-svg .ink{fill:var(--dg-ink)}.dg-svg .k{stroke:var(--dg-ink)}.dg-svg .km{stroke:var(--dg-mu)}.dg-svg .kl{stroke:var(--dg-line)}.dg-svg .kf{stroke:var(--dg-faint)}.dg-svg .kb{stroke:var(--dg-bg)}.dg-svg .nf{fill:none}.dg-svg .sac{stroke:var(--dg-accent)}.dg-svg .ef{fill:var(--dg-e)}.dg-svg .etf{fill:var(--dg-et)}.dg-svg .ek{stroke:var(--dg-e)}.dg-svg .p1{fill:var(--dg-p1)}.dg-svg .sp1{stroke:var(--dg-p1)}.dg-svg .p2{fill:var(--dg-p2)}.dg-svg .sp2{stroke:var(--dg-p2)}.dg-svg .p3{fill:var(--dg-p3)}.dg-svg .sp3{stroke:var(--dg-p3)}.dg-svg .p4{fill:var(--dg-p4)}.dg-svg .sp4{stroke:var(--dg-p4)}.dg-svg .p5{fill:var(--dg-p5)}.dg-svg .sp5{stroke:var(--dg-p5)}.dg-svg .c1{fill:var(--dg-c1)}.dg-svg .sc1{stroke:var(--dg-c1)}.dg-svg .c2{fill:var(--dg-c2)}.dg-svg .sc2{stroke:var(--dg-c2)}.dg-svg .c3{fill:var(--dg-c3)}.dg-svg .sc3{stroke:var(--dg-c3)}.dg-svg .c4{fill:var(--dg-c4)}.dg-svg .sc4{stroke:var(--dg-c4)}.dg-svg .c5{fill:var(--dg-c5)}.dg-svg .sc5{stroke:var(--dg-c5)}.dg-svg .c6{fill:var(--dg-c6)}.dg-svg .sc6{stroke:var(--dg-c6)}.dg-svg .c7{fill:var(--dg-c7)}.dg-svg .sc7{stroke:var(--dg-c7)}.dg-svg .fb{fill:var(--dg-fb)}.dg-svg .sfb{stroke:var(--dg-fb)}.dg-svg .fa{fill:var(--dg-fa)}.dg-svg .sfa{stroke:var(--dg-fa)}.dg-svg .fl{fill:var(--dg-fl)}.dg-svg .sfl{stroke:var(--dg-fl)}.dg-svg .d1{fill:var(--dg-d1)}.dg-svg .sd1{stroke:var(--dg-d1)}.dg-svg .d2{fill:var(--dg-d2)}.dg-svg .sd2{stroke:var(--dg-d2)}.dg-svg .d3{fill:var(--dg-d3)}.dg-svg .sd3{stroke:var(--dg-d3)}.dg-svg .d4{fill:var(--dg-d4)}.dg-svg .sd4{stroke:var(--dg-d4)}</style><rect width="1200" height="1200" class="bg"/><text x="72.0" y="104.0" font-size="50" font-weight="400" class="f">Three readings for every passage</text><text x="72.0" y="149.5" font-size="26" font-weight="500" class="mu">Greek and Latin into today’s English, then into Russian. Every point of the second</text><text x="72.0" y="184.9" font-size="26" font-weight="500" class="mu">reader is settled in writing: by a third reader in a fresh context, or, for the Russian, by</text><text x="72.0" y="220.2" font-size="26" font-weight="500" class="mu">the translator.</text><text x="72.0" y="301.2" font-size="27" font-weight="750">Greek → English</text><text x="301.0" y="301.2" font-size="22" font-weight="500" class="mu"><tspan data-d="tr-marcus">418</tspan> passages of Marcus · Claude Fable 5.2</text><rect x="72.0" y="319.2" width="268.8" height="68.2" rx="8" class="soft"/><text x="86.0" y="348.9" font-size="22" font-weight="750">1 · Translator</text><text x="86.0" y="375.3" font-size="22" font-weight="500" class="mu">sees the Greek</text><path d="M352.8 347.3 L358.8 353.3 L352.8 359.3" class="nf km" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="370.8" y="319.2" width="377.5" height="68.2" rx="8" class="soft"/><text x="384.8" y="348.9" font-size="22" font-weight="750">2 · Checker</text><text x="384.8" y="375.3" font-size="22" font-weight="500" class="mu">the Greek and the English</text><path d="M760.2 347.3 L766.2 353.3 L760.2 359.3" class="nf km" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="778.2" y="319.2" width="349.8" height="68.2" rx="8" class="soft"/><text x="792.2" y="348.9" font-size="22" font-weight="750">3 · Settler</text><text x="792.2" y="375.3" font-size="22" font-weight="500" class="mu">Greek, draft and points</text><rect x="72.0" y="407.4" width="621.6" height="20" rx="2" class="d1"><title>accepted: 969</title></rect><rect x="695.6" y="407.4" width="297.2" height="20" rx="2" class="d2"><title>partly: 465</title></rect><rect x="994.8" y="407.4" width="119.6" height="20" rx="2" class="d3"><title>declined: 189</title></rect><rect x="1116.4" y="407.4" width="9.6" height="20" rx="2" class="d4"><title>free form: 18</title></rect><rect x="72.0" y="441.7" width="15.8" height="15.8" rx="2" class="d1"/><text x="94.0" y="458.2" font-size="22" font-weight="600"><tspan data-d="dec-marcus-accepted">969</tspan> accepted</text><rect x="258.2" y="441.7" width="15.8" height="15.8" rx="2" class="d2"/><text x="280.2" y="458.2" font-size="22" font-weight="600"><tspan data-d="dec-marcus-partly">465</tspan> partly</text><rect x="406.8" y="441.7" width="15.8" height="15.8" rx="2" class="d3"/><text x="428.8" y="458.2" font-size="22" font-weight="600"><tspan data-d="dec-marcus-declined">189</tspan> declined</text><rect x="580.5" y="441.7" width="15.8" height="15.8" rx="2" class="d4"/><text x="602.5" y="458.2" font-size="22" font-weight="600"><tspan data-d="dec-marcus-free">18</tspan> free form</text><text x="72.0" y="490.1" font-size="22" font-weight="500" class="mu"><tspan data-d="dec-marcus-found">137</tspan> of the accepted are faults the settler found itself · <tspan data-d="notes-marcus">3,201</tspan> notes on what the Greek leaves open</text><line x1="72.0" y1="544.8" x2="1128.0" y2="544.8" class="kl" stroke-width="1"/><text x="72.0" y="581.8" font-size="27" font-weight="750">Latin → English</text><text x="289.9" y="581.8" font-size="22" font-weight="500" class="mu"><tspan data-d="tr-seneca">304</tspan> sections of Seneca, <tspan data-d="tr-letters">94</tspan> letters · Claude Fable 5.2</text><rect x="72.0" y="599.8" width="268.8" height="68.2" rx="8" class="soft"/><text x="86.0" y="629.5" font-size="22" font-weight="750">1 · Translator</text><text x="86.0" y="655.9" font-size="22" font-weight="500" class="mu">sees the Latin</text><path d="M352.8 627.9 L358.8 633.9 L352.8 639.9" class="nf km" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="370.8" y="599.8" width="377.5" height="68.2" rx="8" class="soft"/><text x="384.8" y="629.5" font-size="22" font-weight="750">2 · Checker</text><text x="384.8" y="655.9" font-size="22" font-weight="500" class="mu">the Latin and the English</text><path d="M760.2 627.9 L766.2 633.9 L760.2 639.9" class="nf km" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="778.2" y="599.8" width="349.8" height="68.2" rx="8" class="soft"/><text x="792.2" y="629.5" font-size="22" font-weight="750">3 · Settler</text><text x="792.2" y="655.9" font-size="22" font-weight="500" class="mu">Latin, draft and points</text><rect x="72.0" y="688.0" width="458.8" height="20" rx="2" class="d1"><title>accepted: 716</title></rect><rect x="532.8" y="688.0" width="222.6" height="20" rx="2" class="d2"><title>partly: 349</title></rect><rect x="757.3" y="688.0" width="53.3" height="20" rx="2" class="d3"><title>declined: 86</title></rect><rect x="72.0" y="722.3" width="15.8" height="15.8" rx="2" class="d1"/><text x="94.0" y="738.8" font-size="22" font-weight="600"><tspan data-d="dec-seneca-accepted">716</tspan> accepted</text><rect x="252.0" y="722.3" width="15.8" height="15.8" rx="2" class="d2"/><text x="274.0" y="738.8" font-size="22" font-weight="600"><tspan data-d="dec-seneca-partly">349</tspan> partly</text><rect x="400.0" y="722.3" width="15.8" height="15.8" rx="2" class="d3"/><text x="422.0" y="738.8" font-size="22" font-weight="600"><tspan data-d="dec-seneca-declined">86</tspan> declined</text><text x="72.0" y="770.7" font-size="22" font-weight="500" class="mu"><tspan data-d="dec-seneca-found">61</tspan> of the accepted are faults the settler found itself · <tspan data-d="notes-seneca">2,363</tspan> notes on what the Latin leaves open</text><line x1="72.0" y1="825.4" x2="1128.0" y2="825.4" class="kl" stroke-width="1"/><text x="72.0" y="862.4" font-size="27" font-weight="750">English → Russian</text><text x="327.9" y="862.4" font-size="22" font-weight="500" class="mu"><tspan data-d="tr-ru">722</tspan> passages, Marcus and Seneca · Claude Opus 5.5 · Sonnet 5.5</text><rect x="72.0" y="880.4" width="318.2" height="68.2" rx="8" class="soft"/><text x="86.0" y="910.1" font-size="22" font-weight="750">1 · Translator</text><text x="86.0" y="936.5" font-size="22" font-weight="500" class="mu">Opus, sees the English</text><path d="M402.2 908.5 L408.2 914.5 L402.2 920.5" class="nf km" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="420.2" y="880.4" width="375.6" height="68.2" rx="8" class="soft"/><text x="434.2" y="910.1" font-size="22" font-weight="750">2 · Second reader</text><text x="434.2" y="936.5" font-size="22" font-weight="500" class="mu">Sonnet, English and Russian</text><path d="M807.8 908.5 L813.8 914.5 L807.8 920.5" class="nf km" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="825.8" y="880.4" width="302.2" height="68.2" rx="8" class="soft"/><text x="839.8" y="910.1" font-size="22" font-weight="750">3 · Translator settles</text><text x="839.8" y="936.5" font-size="22" font-weight="500" class="mu">each point in writing</text><rect x="72.0" y="968.6" width="94.5" height="20" rx="2" class="d1"><title>accepted: 150</title></rect><rect x="168.5" y="968.6" width="34.7" height="20" rx="2" class="d2"><title>partly: 57</title></rect><rect x="205.2" y="968.6" width="2.5" height="20" rx="2" class="d3"><title>declined: 7</title></rect><rect x="72.0" y="1002.9" width="15.8" height="15.8" rx="2" class="d1"/><text x="94.0" y="1019.4" font-size="22" font-weight="600"><tspan data-d="dec-ru-accepted">150</tspan> accepted</text><rect x="253.8" y="1002.9" width="15.8" height="15.8" rx="2" class="d2"/><text x="275.8" y="1019.4" font-size="22" font-weight="600"><tspan data-d="dec-ru-partly">57</tspan> partly</text><rect x="387.1" y="1002.9" width="15.8" height="15.8" rx="2" class="d3"/><text x="409.1" y="1019.4" font-size="22" font-weight="600"><tspan data-d="dec-ru-declined">7</tspan> declined</text><text x="72.0" y="1051.3" font-size="22" font-weight="500" class="mu">Every quote of the articles cut again from the Russian; a glossary fixes the page’s terms</text><g class="dg-foot"><g transform="translate(72,1140.2) scale(1.211)"><rect width="19" height="19" rx="5.5" class="ink"/><rect x="8.3" y="7.6" width="2.4" height="7" rx=".8" class="bg"/><circle cx="9.5" cy="4.9" r="1.35" class="ac"/></g><text x="105.3" y="1160.0" font-size="23" font-weight="650" class="mu">ilyadays.com · Stoic Constitution</text><text x="1128.0" y="1160.0" font-size="23" font-weight="500" text-anchor="end" class="mu">Figure 7 · How the Constitution was made</text></g></svg>
