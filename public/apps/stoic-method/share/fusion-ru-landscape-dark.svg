<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="dg-svg share" viewBox="0 0 1200 627" width="1200" height="627" role="img" aria-labelledby="fusion-ru-landscape-dark-t fusion-ru-landscape-dark-d"><title id="fusion-ru-landscape-dark-t">Как раздел сливается в статью</title><desc id="fusion-ru-landscape-dark-d">Статья 1: 10 фрагментов слева питают 5 утверждений; цветные линии под словами показывают, какие фрагменты их подкрепляют (5 цветов на 9 цитируемых фрагментов, у двух фрагментов одного утверждения цвета всегда разные; различают их номера); два пункта сказаны однажды одним фрагментом; утверждения собраны в положение «Я часть единого тела разумных существ, созданная для общей жизни с ними.» Слова «потому что» в утверждении 5 — вывод редактора, фиолетовым.</desc><style>svg{--dg-bg:#191e26;--dg-ink:#edf1f7;--dg-mu:#a5afbf;--dg-line:#303947;--dg-faint:#3a4453;--dg-soft:#222932;--dg-accent:#ffa080;--dg-e:#b9adf0;--dg-et:#2e2948;--dg-p1:#2f63e1;--dg-p2:#a95e86;--dg-p3:#d63a00;--dg-p4:#437f43;--dg-p5:#2a97bf;--dg-c1:#4a86e0;--dg-c2:#e06a3a;--dg-c3:#1a9f8f;--dg-c4:#b98914;--dg-c5:#d06898;--dg-c6:#73a62c;--dg-c7:#8c74e4;--dg-fb:#4a86e0;--dg-fa:#1a9f8f;--dg-fl:#e0583a;--dg-d1:#cfe0fa;--dg-d2:#7fa7e6;--dg-d3:#3f6fbf;--dg-d4:#59616d;--dg-sans:Manrope, system-ui, -apple-system, 'Segoe UI', sans-serif;--dg-serif:Georgia, 'Times New Roman', serif}.dg-svg{font-family:var(--dg-sans);overflow:visible}.dg-svg text{fill:var(--dg-ink);font-family:var(--dg-sans)}.dg-svg .f{font-family:var(--dg-serif)}.dg-svg .mu{fill:var(--dg-mu)}.dg-svg .ac{fill:var(--dg-accent)}.dg-svg .halo{paint-order:stroke;stroke:var(--dg-bg);stroke-width:5px;stroke-linejoin:round}.dg-svg .bg{fill:var(--dg-bg)}.dg-svg .soft{fill:var(--dg-soft)}.dg-svg .faint{fill:var(--dg-faint)}.dg-svg .ink{fill:var(--dg-ink)}.dg-svg .k{stroke:var(--dg-ink)}.dg-svg .km{stroke:var(--dg-mu)}.dg-svg .kl{stroke:var(--dg-line)}.dg-svg .kf{stroke:var(--dg-faint)}.dg-svg .kb{stroke:var(--dg-bg)}.dg-svg .nf{fill:none}.dg-svg .sac{stroke:var(--dg-accent)}.dg-svg .ef{fill:var(--dg-e)}.dg-svg .etf{fill:var(--dg-et)}.dg-svg .ek{stroke:var(--dg-e)}.dg-svg .p1{fill:var(--dg-p1)}.dg-svg .sp1{stroke:var(--dg-p1)}.dg-svg .p2{fill:var(--dg-p2)}.dg-svg .sp2{stroke:var(--dg-p2)}.dg-svg .p3{fill:var(--dg-p3)}.dg-svg .sp3{stroke:var(--dg-p3)}.dg-svg .p4{fill:var(--dg-p4)}.dg-svg .sp4{stroke:var(--dg-p4)}.dg-svg .p5{fill:var(--dg-p5)}.dg-svg .sp5{stroke:var(--dg-p5)}.dg-svg .c1{fill:var(--dg-c1)}.dg-svg .sc1{stroke:var(--dg-c1)}.dg-svg .c2{fill:var(--dg-c2)}.dg-svg .sc2{stroke:var(--dg-c2)}.dg-svg .c3{fill:var(--dg-c3)}.dg-svg .sc3{stroke:var(--dg-c3)}.dg-svg .c4{fill:var(--dg-c4)}.dg-svg .sc4{stroke:var(--dg-c4)}.dg-svg .c5{fill:var(--dg-c5)}.dg-svg .sc5{stroke:var(--dg-c5)}.dg-svg .c6{fill:var(--dg-c6)}.dg-svg .sc6{stroke:var(--dg-c6)}.dg-svg .c7{fill:var(--dg-c7)}.dg-svg .sc7{stroke:var(--dg-c7)}.dg-svg .fb{fill:var(--dg-fb)}.dg-svg .sfb{stroke:var(--dg-fb)}.dg-svg .fa{fill:var(--dg-fa)}.dg-svg .sfa{stroke:var(--dg-fa)}.dg-svg .fl{fill:var(--dg-fl)}.dg-svg .sfl{stroke:var(--dg-fl)}.dg-svg .d1{fill:var(--dg-d1)}.dg-svg .sd1{stroke:var(--dg-d1)}.dg-svg .d2{fill:var(--dg-d2)}.dg-svg .sd2{stroke:var(--dg-d2)}.dg-svg .d3{fill:var(--dg-d3)}.dg-svg .sd3{stroke:var(--dg-d3)}.dg-svg .d4{fill:var(--dg-d4)}.dg-svg .sd4{stroke:var(--dg-d4)}</style><rect width="1200" height="627" class="bg"/><text x="56.0" y="70.0" font-size="38" font-weight="400" class="f">Как раздел сливается в статью</text><text x="56.0" y="108.5" font-size="22" font-weight="500" class="mu">Статья 1 «Часть единого тела». 5 цветов на 9 цитируемых фрагментов: два фрагмента одного</text><text x="56.0" y="138.4" font-size="22" font-weight="500" class="mu">утверждения никогда не делят цвет, остальные различают номера.</text><path d="M138.0 304.8 C190.8 304.8 190.8 194.4 234.0 194.4" class="nf sp3" stroke-width="1.8" opacity=".9"/><path d="M138.0 341.7 C190.8 341.7 190.8 204.5 234.0 204.5" class="nf sp4" stroke-width="1.8" opacity=".9"/><path d="M138.0 378.7 C190.8 378.7 190.8 214.7 234.0 214.7" class="nf sp1" stroke-width="1.8" opacity=".9"/><path d="M138.0 415.6 C190.8 415.6 190.8 224.8 234.0 224.8" class="nf sp5" stroke-width="1.8" opacity=".9"/><path d="M138.0 193.9 C190.8 193.9 190.8 234.9 234.0 234.9" class="nf sp2" stroke-width="1.8" opacity=".9"/><path d="M138.0 304.8 C190.8 304.8 190.8 276.2 234.0 276.2" class="nf sp3" stroke-width="1.8" opacity=".9"/><path d="M138.0 193.9 C190.8 193.9 190.8 291.4 234.0 291.4" class="nf sp2" stroke-width="1.8" opacity=".9"/><path d="M138.0 230.9 C190.8 230.9 190.8 306.6 234.0 306.6" class="nf sp5" stroke-width="1.8" opacity=".9"/><path d="M138.0 378.7 C190.8 378.7 190.8 358.0 234.0 358.0" class="nf sp1" stroke-width="1.8" opacity=".9"/><path d="M138.0 452.6 C190.8 452.6 190.8 378.3 234.0 378.3" class="nf sp2" stroke-width="1.8" opacity=".9"/><path d="M138.0 526.5 C190.8 526.5 190.8 429.7 234.0 429.7" class="nf sp4" stroke-width="1.8" opacity=".9"/><path d="M138.0 267.8 C190.8 267.8 190.8 444.9 234.0 444.9" class="nf sp3" stroke-width="1.8" opacity=".9"/><path d="M138.0 378.7 C190.8 378.7 190.8 460.1 234.0 460.1" class="nf sp1" stroke-width="1.8" opacity=".9"/><path d="M138.0 526.5 C190.8 526.5 190.8 500.8 234.0 500.8" class="nf sp4" stroke-width="1.8" opacity=".9"/><path d="M138.0 267.8 C190.8 267.8 190.8 510.4 234.0 510.4" class="nf sp3" stroke-width="1.8" opacity=".9"/><path d="M138.0 193.9 C190.8 193.9 190.8 520.0 234.0 520.0" class="nf sp2" stroke-width="1.8" opacity=".9"/><text x="248.0" y="192.9" font-size="14.5" font-weight="650" class="mu">Утверждение 1 · Почему · Что мы такое</text><line x1="248.5" y1="219.5" x2="390.2" y2="219.5" class="sp2" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="223.5" x2="390.2" y2="223.5" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="399.1" y1="219.5" x2="585.9" y2="219.5" class="sp2" stroke-width="2.2" stroke-linecap="butt"/><line x1="399.1" y1="223.5" x2="585.9" y2="223.5" class="sp5" stroke-width="2.2" stroke-linecap="butt"/><line x1="594.9" y1="219.5" x2="772.5" y2="219.5" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="781.4" y1="219.5" x2="866.5" y2="219.5" class="sp1" stroke-width="2.2" stroke-linecap="butt"/><line x1="781.4" y1="223.5" x2="866.5" y2="223.5" class="sp4" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="242.0" x2="353.5" y2="242.0" class="sp1" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="246.0" x2="353.5" y2="246.0" class="sp4" stroke-width="2.2" stroke-linecap="butt"/><line x1="373.9" y1="242.0" x2="685.0" y2="242.0" class="sp5" stroke-width="2.2" stroke-linecap="butt"/><text x="248.0" y="216.4" font-size="15.5" font-weight="400" class="f">Всё, что рассуждает, причастно одному разуму, как части — одному телу, граждане —</text><text x="248.0" y="238.9" font-size="15.5" font-weight="400" class="f">одному городу, а всякое освещённое место — одному солнцу.</text><text x="248.0" y="269.7" font-size="14.5" font-weight="650" class="mu">Утверждение 2 · Почему · Для чего мы</text><line x1="248.5" y1="296.3" x2="337.8" y2="296.3" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="300.3" x2="337.8" y2="300.3" class="sp5" stroke-width="2.2" stroke-linecap="butt"/><line x1="342.5" y1="296.3" x2="446.9" y2="296.3" class="sp2" stroke-width="2.2" stroke-linecap="butt"/><line x1="342.5" y1="300.3" x2="446.9" y2="300.3" class="sp5" stroke-width="2.2" stroke-linecap="butt"/><line x1="464.9" y1="296.3" x2="637.0" y2="296.3" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="659.2" y1="296.3" x2="839.8" y2="296.3" class="sp5" stroke-width="2.2" stroke-linecap="butt"/><line x1="802.7" y1="300.3" x2="839.8" y2="300.3" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="318.7" x2="380.0" y2="318.7" class="sp5" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="322.7" x2="380.0" y2="322.7" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><text x="248.0" y="293.2" font-size="15.5" font-weight="400" class="f">Мы созданы друг для друга и для одного общего дела, и эта общая жизнь — наше</text><text x="248.0" y="315.6" font-size="15.5" font-weight="400" class="f">собственное благо.</text><text x="248.0" y="346.4" font-size="14.5" font-weight="650" class="mu">Утверждение 3 · На деле · Что из этого следует для действия</text><line x1="315.0" y1="373.0" x2="494.2" y2="373.0" class="sp1" stroke-width="2.2" stroke-linecap="butt"/><line x1="537.8" y1="373.0" x2="719.1" y2="373.0" class="sp1" stroke-width="2.2" stroke-linecap="butt"/><line x1="537.8" y1="377.0" x2="719.1" y2="377.0" class="sp2" stroke-width="2.2" stroke-linecap="butt"/><line x1="740.8" y1="373.0" x2="817.7" y2="373.0" class="sp1" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="395.5" x2="313.7" y2="395.5" class="sp1" stroke-width="2.2" stroke-linecap="butt"/><line x1="335.8" y1="395.5" x2="676.0" y2="395.5" class="sp2" stroke-width="2.2" stroke-linecap="butt"/><text x="248.0" y="369.9" font-size="15.5" font-weight="400" class="f">Поэтому всё, что я делаю, должно быть нацелено на общее благо — прямо или</text><text x="248.0" y="392.4" font-size="15.5" font-weight="400" class="f">издалека, и верность этой одной цели делает меня единым.</text><text x="248.0" y="423.2" font-size="14.5" font-weight="650" class="mu">Утверждение 4 · Когда не выходит · Что делает разрыв</text><line x1="248.5" y1="449.8" x2="434.7" y2="449.8" class="sp4" stroke-width="2.2" stroke-linecap="butt"/><line x1="443.6" y1="449.8" x2="602.8" y2="449.8" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="639.3" y1="449.8" x2="828.2" y2="449.8" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="837.2" y1="449.8" x2="844.7" y2="449.8" class="sp1" stroke-width="2.2" stroke-linecap="butt"/><line x1="837.2" y1="453.8" x2="844.7" y2="453.8" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="837.2" y1="457.8" x2="844.7" y2="457.8" class="sp4" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="472.2" x2="341.4" y2="472.2" class="sp1" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="476.2" x2="341.4" y2="476.2" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="248.5" y1="480.2" x2="341.4" y2="480.2" class="sp4" stroke-width="2.2" stroke-linecap="butt"/><line x1="591.0" y1="472.2" x2="658.8" y2="472.2" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="591.0" y1="476.2" x2="658.8" y2="476.2" class="sp4" stroke-width="2.2" stroke-linecap="butt"/><text x="248.0" y="446.7" font-size="15.5" font-weight="400" class="f">Когда я ненавижу кого-то, поступаю с ним дурно или досадую на происходящее, я</text><text x="248.0" y="469.1" font-size="15.5" font-weight="400" class="f">отсекаю себя — и не только от этого одного, но от целого.</text><text x="248.0" y="499.9" font-size="14.5" font-weight="650" class="mu">Утверждение 5 · Когда не выходит · Путь назад</text><line x1="356.3" y1="526.5" x2="498.1" y2="526.5" class="sp3" stroke-width="2.2" stroke-linecap="butt"/><line x1="356.3" y1="530.5" x2="555.3" y2="530.5" class="sp4" stroke-width="2.2" stroke-linecap="butt"/><line x1="648.3" y1="526.5" x2="859.9" y2="526.5" class="sp2" stroke-width="2.2" stroke-linecap="butt"/><rect x="560.7" y="510.7" width="86.3" height="17.4" rx="3" class="etf"/><text x="248.0" y="523.4" font-size="15.5" font-weight="400" class="f">Отсёкши себя, я могу снова врасти в целое, <tspan class="ef">потому что</tspan> природа сильнее моего ухода.</text><text x="888.0" y="499.9" font-size="14.5" font-weight="650" text-anchor="end" class="ef">вывод редактора</text><rect x="56.0" y="180.4" width="80.0" height="27.0" rx="13.5" class="bg sp2" stroke-width="2.6"/><text x="96.0" y="199.7" font-size="16" font-weight="700" text-anchor="middle">9.7</text><rect x="56.0" y="217.4" width="80.0" height="27.0" rx="13.5" class="bg sp5" stroke-width="2.6"/><text x="96.0" y="236.6" font-size="16" font-weight="700" t