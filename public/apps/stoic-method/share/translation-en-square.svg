<svg xmlns="http://www.w3.org/2000/svg" class="dg-svg share" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-labelledby="translation-en-square-t translation-en-square-d"><title id="translation-en-square-t">Three readings for every passage</title><desc id="translation-en-square-d">Three lanes. Greek to English: 418 passages, points settled 969 accepted, 465 partly, 189 declined. Latin to English: 304 sections, 716, 349, 86. English to Russian: 722 passages, 150, 57, 7.</desc><style>svg{--dg-bg:#ffffff;--dg-ink:#171b22;--dg-mu:#626c7a;--dg-line:#dfe4eb;--dg-faint:#d3d9e1;--dg-soft:#f1f3f6;--dg-accent:#c64227;--dg-e:#55468f;--dg-et:#ece9f6;--dg-p1:#4379f9;--dg-p2:#cc689e;--dg-p3:#853f13;--dg-p4:#989401;--dg-p5:#861192;--dg-c1:#2a62b8;--dg-c2:#cf5a2e;--dg-c3:#17998a;--dg-c4:#c99412;--dg-c5:#cc6593;--dg-c6:#5e8c1f;--dg-c7:#7656c9;--dg-fb:#2a62b8;--dg-fa:#17998a;--dg-fl:#c64227;--dg-d1:#1d3f73;--dg-d2:#4f7fc4;--dg-d3:#8fb0e3;--dg-d4:#b7bec8;--dg-sans:Manrope, system-ui, -apple-system, 'Segoe UI', sans-serif;--dg-serif:Georgia, 'Times New Roman', serif}.dg-svg{font-family:var(--dg-sans);overflow:visible}.dg-svg text{fill:var(--dg-ink);font-family:var(--dg-sans)}.dg-svg .f{font-family:var(--dg-serif)}.dg-svg .mu{fill:var(--dg-mu)}.dg-svg .ac{fill:var(--dg-accent)}.dg-svg .halo{paint-order:stroke;stroke:var(--dg-bg);stroke-width:5px;stroke-linejoin:round}.dg-svg .bg{fill:var(--dg-bg)}.dg-svg .soft{fill:var(--dg-soft)}.dg-svg .faint{fill:var(--dg-faint)}.dg-svg .ink{fill:var(--dg-ink)}.dg-svg .k{stroke:var(--dg-ink)}.dg-svg .km{stroke:var(--dg-mu)}.dg-svg .kl{stroke:var(--dg-line)}.dg-svg .kf{stroke:var(--dg-faint)}.dg-svg .kb{stroke:var(--dg-bg)}.dg-svg .nf{fill:none}.dg-svg .sac{stroke:var(--dg-accent)}.dg-svg .ef{fill:var(--dg-e)}.dg-svg .etf{fill:var(--dg-et)}.dg-svg .ek{stroke:var(--dg-e)}.dg-svg .p1{fill:var(--dg-p1)}.dg-svg .sp1{stroke:var(--dg-p1)}.dg-svg .p2{fill:var(--dg-p2)}.dg-svg .sp2{stroke:var(--dg-p2)}.dg-svg .p3{fill:var(--dg-p3)}.dg-svg .s