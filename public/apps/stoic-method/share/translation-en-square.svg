 L422.0 318.0 L416.0 324.0" class="nf km" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="434.0" y="283.9" width="332.0" height="68.2" rx="8" class="soft"/><text x="448.0" y="313.6" font-size="22" font-weight="750">2 · Checker</text><text x="448.0" y="340.0" font-size="22" font-weight="500" class="mu">the Greek and the English</text><path d="M778.0 312.0 L784.0 318.0 L778.0 324.0" class="nf km" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="796.0" y="283.9" width="332.0" height="68.2" rx="8" class="soft"/><text x="810.0" y="313.6" font-size="22" font-weight="750">3 · Settler</text><text x="810.0" y="340.0" font-size="22" font-weight="500" class="mu">Greek, draft and points</text><rect x="72.0" y="372.1" width="621.6" height="20" rx="2" class="d1"><title>accepted: 969</title></rect><rect x="695.6" y="372.1" width="297.2" height="20" rx="2" class="d2"><title>partly: 465</title></rect><rect x="994.8" y="372.1" width="119.6" height="20" rx="2" class="d3"><title>declined: 189</title></rect><rect x="1116.4" y="372.1" width="9.6" height="20" rx="2" class="d4"><title>free form: 18</title></rect><rect x="72.0" y="406.4" width="15.8" height="15.8" rx="2" class="d1"/><text x="94.0" y="422.9" font-size="22" font-weight="600"><tspan data-d="dec-marcus-accepted">969</tspan> accepted</text><rect x="258.2" y="406.4" width="15.8" height="15.8" rx="2" class="d2"/><text x="280.2" y="422.9" font-size="22" font-weight="600"><tspan data-d="dec-marcus-partly">465</tspan> partly</text><rect x="406.8" y="406.4" width="15.8" height="15.8" rx="2" class="d3"/><text x="428.8" y="422.9" font-size="22" font-weight="600"><tspan data-d="dec-marcus-declined">189</tspan> declined</text><rect x="580.5" y="406.4" width="15.8" height="15.8" rx="2" class="d4"/><text x="602.5" y="422.9" font-size="22" font-weight="600"><tspan data-d="dec-marcus-free">18</tspan> free form</text><text x="72.0" y="454.8" font-size="22" font-weight="500" class="mu"><tspan data-d="dec-marcus-found">137</tspan> more faults found while settling · <tspan data-d="notes-marcus">3,201</tspan> notes on what the Greek leaves open</text><line x1="72.0" y1="523.9" x2="1128.0" y2="523.9" class="kl" stroke-width="1"/><text x="72.0" y="560.9" font-size="27" font-weight="750">Latin → English</text><text x="289.9" y="560.9" font-size="22" font-weight="500" class="mu"><tspan data-d="tr-seneca">304</tspan> sections of Seneca, <tspan data-d="tr-letters">94</tspan> letters · Claude Fable 5.2</text><rect x="72.0" y="578.9" width="332.0" height="68.2" rx="8" class="soft"/><text x="86.0" y="608.6" font-size="22" font-weight="750">1 · Translator</text><text x="86.0" y="635.0" font-size="22" font-weight="500" class="mu">sees the Latin</text><path d="M416.0 607.0 L422.0 613.0 L416.0 619.0" class="nf km" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="434.0" y="578.9" width="332.0" height="68.2" rx="8" class="soft"/><text x="448.0" y="608.6" font-size="22" font-weight="750">2 · Checker</text><text x="448.0" y="635.0" font-size="22" font-weight="500" class="mu">the Latin and the English</text><path d="M778.0 607.0 L784.0 613.0 L778.0 619.0" class="nf km" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="796.0" y="578.9" width="332.0" height="68.2" rx="8" class="soft"/><text x="810.0" y="608.6" font-size="22" font-weight="750">3 · Settler</text><text x="810.0" y="635.0" font-size="22" font-weight="500" class="mu">Latin, draft and points</text><rect x="72.0" y="667.1" width="458.8" height="20" rx="2" class="d1"><title>accepted: 716</title></rect><rect x="532.8" y="667.1" width="222.6" height="20" rx="2" class="d2"><title>partly: 349</title></rect><rect x="757.3" y="667.1" width="53.3" height="20" rx="2" class="d3"><title>declined: 86</title></rect><rect x="72.0" y="701.4" width="15.8" height="15.8" rx="2" class="d1"/><text x="94.0" y="717.9" font-size="22" font-weight="600"><tspan data-d="dec-seneca-accepted">716</tspan> accepted</text><rect x="252.0" y="701.4" width="15.8" height="15.8" rx="2" class="d2"/><text x="274.0" y="717.9" font-size="22" font-weight="600"><tspan data-d="dec-seneca-partly">349</tspan> partly</text><rect x="400.0" y="701.4" width="15.8" height="15.8" rx="2" class="d3"/><text x="422.0" y="717.9" font-size="22" font-weight="600"><tspan data-d="dec-seneca-declined">86</tspan> declined</text><text x="72.0" y="749.8" font-size="22" font-weight="500" class="mu"><tspan data-d="dec-seneca-found">61</tspan> more faults found while settling · <tspan data-d="notes-seneca">2,363</tspan> notes on what the Latin leaves open</text><line x1="72.0" y1="819.0" x2="1128.0" y2="819.0" class="kl" stroke-width="1"/><text x="72.0" y="856.0" font-size="27" font-weight="750">English → Russian</text><text x="327.9" y="856.0" font-size="22" font-weight="500" class="mu"><tspan data-d="tr-ru">722</tspan> passages, Marcus and Seneca · Claude Opus 5.5 · Sonnet 5.5</text><rect x="72.0" y="874.0" width="332.0" height="68.2" rx="8" class="soft"/><text x="86.0" y="903.7" font-size="22" font-weight="750">1 · Translator</text><text x="86.0" y="930.1" font-size="22" font-weight="500" class="mu">Opus, sees the English</text><path d="M416.0 902.1 L422.0 908.1 L416.0 914.1" class="nf km" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="434.0" y="874.0" width="332.0" height="68.2" rx="8" class="soft"/><text x="448.0" y="903.7" font-size="22" font-weight="750">2 · Second reader</text><text x="448.0" y="930.1" font-size="22" font-weight="500" class="mu">Sonnet, English and Russian</text><path d="M778.0 902.1 L784.0 908.1 L778.0 914.1" class="nf km" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="796.0" y="874.0" width="332.0" height="68.2" rx="8" class="soft"/><text x="810.0" y="903.7" font-size="22" font-weight="750">3 · Translator settles</text><text x="810.0" y="930.1" font-size="22" font-weight="500" class="mu">each point in writing</text><rect x="72.0" y="962.2" width="94.5" height="20" rx="2" class="d1"><title>accepted: 150</title></rect><rect x="168.5" y="962.2" width="34.7" height="20" rx="2" class="d2"><title>partly: 57</title></rect><rect x="205.2" y="962.2" width="2.5" height="20" rx="2" class="d3"><title>declined: 7</title></rect><rect x="72.0" y="996.5" width="15.8" height="15.8" rx="2" class="d1"/><text x="94.0" y="1013.0" font-size="22" font-weight="600"><tspan data-d="dec-ru-accepted">150</tspan> accepted</text><rect x="253.8" y="996.5" width="15.8" height="15.8" rx="2" class="d2"/><text x="275.8" y="1013.0" font-size="22" font-weight="600"><tspan data-d="dec-ru-partly">57</tspan> partly</text><rect x="387.1" y="996.5" width="15.8" height="15.8" rx="2" class="d3"/><text x="409.1" y="1013.0" font-size="22" font-weight="600"><tspan data-d="dec-ru-declined">7</tspan> declined</text><text x="72.0" y="1044.9" font-size="22" font-weight="500" class="mu">Every quote of the articles cut again from the Russian; a glossary fixes the page’s terms</text><g transform="translate(72,1140.2) scale(1.211)"><rect width="19" height="19" rx="5.5" class="ink"/><rect x="8.3" y="7.6" width="2.4" height="7" rx=".8" class="bg"/><circle cx="9.5" cy="4.9" r="1.35" class="ac"/></g><text x="105.3" y="1160.0" font-size="23" font-weight="650" class="mu">ilyadays.com · Stoic Constitution</text><text x="1128.0" y="1160.0" font-size="23" font-weight="500" text-anchor="end" class="mu">Figure 7 · How the Constitution was made</text></svg>
