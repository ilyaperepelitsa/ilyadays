ar(--dg-accent)}.dg-svg .halo{paint-order:stroke;stroke:var(--dg-bg);stroke-width:5px;stroke-linejoin:round}.dg-svg .bg{fill:var(--dg-bg)}.dg-svg .soft{fill:var(--dg-soft)}.dg-svg .faint{fill:var(--dg-faint)}.dg-svg .ink{fill:var(--dg-ink)}.dg-svg .k{stroke:var(--dg-ink)}.dg-svg .km{stroke:var(--dg-mu)}.dg-svg .kl{stroke:var(--dg-line)}.dg-svg .kf{stroke:var(--dg-faint)}.dg-svg .kb{stroke:var(--dg-bg)}.dg-svg .nf{fill:none}.dg-svg .sac{stroke:var(--dg-accent)}.dg-svg .ef{fill:var(--dg-e)}.dg-svg .etf{fill:var(--dg-et)}.dg-svg .ek{stroke:var(--dg-e)}.dg-svg .p1{fill:var(--dg-p1)}.dg-svg .sp1{stroke:var(--dg-p1)}.dg-svg .p2{fill:var(--dg-p2)}.dg-svg .sp2{stroke:var(--dg-p2)}.dg-svg .p3{fill:var(--dg-p3)}.dg-svg .sp3{stroke:var(--dg-p3)}.dg-svg .p4{fill:var(--dg-p4)}.dg-svg .sp4{stroke:var(--dg-p4)}.dg-svg .p5{fill:var(--dg-p5)}.dg-svg .sp5{stroke:var(--dg-p5)}.dg-svg .c1{fill:var(--dg-c1)}.dg-svg .sc1{stroke:var(--dg-c1)}.dg-svg .c2{fill:var(--dg-c2)}.dg-svg .sc2{stroke:var(--dg-c2)}.dg-svg .c3{fill:var(--dg-c3)}.dg-svg .sc3{stroke:var(--dg-c3)}.dg-svg .c4{fill:var(--dg-c4)}.dg-svg .sc4{stroke:var(--dg-c4)}.dg-svg .c5{fill:var(--dg-c5)}.dg-svg .sc5{stroke:var(--dg-c5)}.dg-svg .c6{fill:var(--dg-c6)}.dg-svg .sc6{stroke:var(--dg-c6)}.dg-svg .c7{fill:var(--dg-c7)}.dg-svg .sc7{stroke:var(--dg-c7)}.dg-svg .fb{fill:var(--dg-fb)}.dg-svg .sfb{stroke:var(--dg-fb)}.dg-svg .fa{fill:var(--dg-fa)}.dg-svg .sfa{stroke:var(--dg-fa)}.dg-svg .fl{fill:var(--dg-fl)}.dg-svg .sfl{stroke:var(--dg-fl)}.dg-svg .d1{fill:var(--dg-d1)}.dg-svg .sd1{stroke:var(--dg-d1)}.dg-svg .d2{fill:var(--dg-d2)}.dg-svg .sd2{stroke:var(--dg-d2)}.dg-svg .d3{fill:var(--dg-d3)}.dg-svg .sd3{stroke:var(--dg-d3)}.dg-svg .d4{fill:var(--dg-d4)}.dg-svg .sd4{stroke:var(--dg-d4)}</style><rect width="340" height="1190" class="bg"/><text x="14.0" y="30.0" font-size="21" font-weight="400" class="f">Три прочтения для каждого</text><text x="14.0" y="54.8" font-size="21" font-weight="400" class="f">фрагмента</text><text x="14.0" y="76.8" font-size="13.5" font-weight="500" class="mu">Греческий и латынь — на современный</text><text x="14.0" y="95.4" font-size="13.5" font-weight="500" class="mu">английский, затем на русский. Каждое</text><text x="14.0" y="114.0" font-size="13.5" font-weight="500" class="mu">замечание второго читателя решается</text><text x="14.0" y="132.7" font-size="13.5" font-weight="500" class="mu">письменно: третьим читателем в новом</text><text x="14.0" y="151.3" font-size="13.5" font-weight="500" class="mu">контексте, а для русского — переводчиком.</text><text x="14.0" y="193.3" font-size="16" font-weight="750">Греческий → английский</text><text x="14.0" y="213.3" font-size="13" font-weight="500" class="mu"><tspan data-d="tr-marcus">418</tspan> фрагментов Марка · Claude Fable 5.2</text><rect x="14.0" y="227.3" width="312.0" height="40.0" rx="7" class="soft"/><text x="24.0" y="244.3" font-size="13" font-weight="750">1 · Переводчик</text><text x="24.0" y="260.3" font-size="13" font-weight="500" class="mu">видит греческий</text><rect x="14.0" y="273.3" width="312.0" height="40.0" rx="7" class="soft"/><text x="24.0" y="290.3" font-size="13" font-weight="750">2 · Проверяющий</text><text x="24.0" y="306.3" font-size="13" font-weight="500" class="mu">греческий и английский</text><rect x="14.0" y="319.3" width="312.0" height="40.0" rx="7" class="soft"/><text x="24.0" y="336.3" font-size="13" font-weight="750">3 · Решающий</text><text x="24.0" y="352.3" font-size="13" font-weight="500" class="mu">греческий, черновик, замечания</text><rect x="14.0" y="369.3" width="182.2" height="13" rx="2" class="d1"><title>принято: 969</title></rect><rect x="198.2" y="369.3" width="86.4" height="13" rx="2" class="d2"><title>частично: 465</title></rect><rect x="286.6" y="369.3" width="33.9" height="13" rx="2" class="d3"><title>отклонено: 189</title></rect><rect x="322.6" y="369.3" width="1.4" height="13" rx="2" class="d4"><title>свободно: 18</title></rect><rect x="14.0" y="392.6" width="9.4" height="9.4" rx="2" class="d1"/><text x="27.0" y="402.3" font-size="13" font-weight="600"><tspan data-d="dec-marcus-accepted">969</tspan> принято</text><rect x="119.3" y="392.6" width="9.4" height="9.4" rx="2" class="d2"/><text x="132.3" y="402.3" font-size="13" font-weight="600"><tspan data-d="dec-marcus-partly">465</tspan> частично</text><rect x="14.0" y="410.8" width="9.4" height="9.4" rx="2" class="d3"/><text x="27.0" y="420.5" font-size="13" font-weight="600"><tspan data-d="dec-marcus-declined">189</tspan> отклонено</text><rect x="131.8" y="410.8" width="9.4" height="9.4" rx="2" class="d4"/><text x="144.8" y="420.5" font-size="13" font-weight="600"><tspan data-d="dec-marcus-free">18</tspan> свободно</text><text x="14.0" y="440.5" font-size="13" font-weight="500" class="mu"><tspan data-d="dec-marcus-found">137</tspan> из принятых — ошибки, найденные самим</text><text x="14.0" y="457.5" font-size="13" font-weight="500" class="mu">решающим · <tspan data-d="notes-marcus">3201</tspan> заметок о том, что греческий</text><text x="14.0" y="474.5" font-size="13" font-weight="500" class="mu">оставляет открытым</text><line x1="14.0" y1="496.5" x2="326.0" y2="496.5" class="kl" stroke-width="1"/><text x="14.0" y="524.5" font-size="16" font-weight="750">Латынь → английский</text><text x="14.0" y="544.5" font-size="13" font-weight="500" class="mu"><tspan data-d="tr-seneca">304</tspan> раздела Сенеки, <tspan data-d="tr-letters">94</tspan> письма · Claude Fable 5.2</text><rect x="14.0" y="558.5" width="312.0" height="40.0" rx="7" class="soft"/><text x="24.0" y="575.5" font-size="13" font-weight="750">1 · Переводчик</text><text x="24.0" y="591.5" font-size="13" font-weight="500" class="mu">видит латынь</text><rect x="14.0" y="604.5" width="312.0" height="40.0" rx="7" class="soft"/><text x="24.0" y="621.5" font-size="13" font-weight="750">2 · Проверяющий</text><text x="24.0" y="637.5" font-size="13" font-weight="500" class="mu">латынь и английский</text><rect x="14.0" y="650.5" width="312.0" height="40.0" rx="7" class="soft"/><text x="24.0" y="667.5" font-size="13" font-weight="750">3 · Решающий</text><text x="24.0" y="683.5" font-size="13" font-weight="500" class="mu">латынь, черновик, замечания</text><rect x="14.0" y="700.5" width="134.1" height="13" rx="2" class="d1"><title>принято: 716</title></rect><rect x="150.1" y="700.5" width="64.4" height="13" rx="2" class="d2"><title>частично: 349</title></rect><rect x="216.5" y="700.5" width="14.4" height="13" rx="2" class="d3"><title>отклонено: 86</title></rect><rect x="14.0" y="723.8" width="9.4" height="9.4" rx="2" class="d1"/><text x="27.0" y="733.5" font-size="13" font-weight="600"><tspan data-d="dec-seneca-accepted">716</tspan> принято</text><rect x="115.7" y="723.8" width="9.4" height="9.4" rx="2" class="d2"/><text x="128.7" y="733.5" font-size="13" font-weight="600"><tspan data-d="dec-seneca-partly">349</tspan> частично</text><rect x="14.0" y="742.0" width="9.4" height="9.4" rx="2" class="d3"/><text x="27.0" y="751.7" font-size="13" font-weight="600"><tspan data-d="dec-seneca-declined">86</tspan> отклонено</text><text x="14.0" y="771.7" font-size="13" font-weight="500" class="mu"><tspan data-d="dec-seneca-found">61</tspan> из принятых — ошибки, найденные самим</text><text x="14.0" y="788.7" font-size="13" font-weight="500" class="mu">решающим · <tspan data-d="notes-seneca">2363</tspan> заметок о том, что латынь</text><text x="14.0" y="805.7" font-size="13" font-weight="500" class="mu">оставляет открытым</text><line x1="14.0" y1="827.7" x2="326.0" y2="827.7" class="kl" stroke-width="1"/><text x="14.0" y="855.7" font-size="16" font-weight="750">Английский → русский</text><text x="14.0" y="875.7" font-size="13" font-weight="500" class="mu"><tspan data-d="tr-ru">722</tspan> фрагмента, Марк и Сенека · Claude Opus 5.5 ·</text><text x="14.0" y="892.7" font-size="13" font-weight="500" class="mu">Sonnet 5.5</text><rect x="14.0" y="906.7" width="312.0" height="40.0" rx="7" class="soft"/><text x="24.0" y="923.7" font-size="13" font-weight="750">1 · Переводчик</text><text x="24.0" y="939.7" font-size="13" font-weight="500" class="mu">Opus, видит английский</text><rect x="14.0" y="952.7" width="312.0" height="40.0" rx="7" class="soft"/><text x="24.0" y="969.7" font-size="13" font-weight="750">2 · Второй читатель</text><text x="24.0" y="985.7" font-size="13" font-weight="500" class="mu">Sonnet, оба текста</text><rect x="14.0" y="998.7" width="312.0" height="40.0" rx="7" class="soft"/><text x="24.0" y="1015.7" font-size="13" font-weight="750">3 · Переводчик</text><text x="24.0" y="1031.7" font-size="13" font-weight="500" class="mu">решает письменно</text><rect x="14.0" y="1048.7" width="27.5" height="13" rx="2" class="d1"><title>принято: 155</title></rect><rect x="43.5" y="1048.7" width="8.8" height="13" rx="2" class="d2"><title>частично: 57</title></rect><rect x="54.3" y="1048.7" width="1.0" height="13" rx="2" class="d3"><title>отклонено: 7</title></rect><rect x="14.0" y="1072.0" width="9.4" height="9.4" rx="2" class="d1"/><text x="27.0" y="1081.7" font-size="13" font-weight="600"><tspan data-d="dec-ru-accepted">155</tspan> принято</text><rect x="116.0" y="1072.0" width="9.4" height="9.4" rx="2" class="d2"/><text x="129.0" y="1081.7" font-size="13" font-weight="600"><tspan data-d="dec-ru-partly">57</tspan> частично</text><rect x="218.1" y="1072.0" width="9.4" height="9.4" rx="2" class="d3"/><text x="231.1" y="1081.7" font-size="13" font-weight="600"><tspan data-d="dec-ru-declined">7</tspan> отклонено</text><text x="14.0" y="1101.7" font-size="13" font-weight="500" class="mu">Каждая цитата статей вырезана заново из</text><text x="14.0" y="1118.7" font-size="13" font-weight="500" class="mu">русского; глоссарий закрепляет термины</text><text x="14.0" y="1135.7" font-size="13" font-weight="500" class="mu">страницы</text><g class="dg-foot"><g transform="translate(14,1156.8) scale(0.684)"><rect width="19" height="19" rx="5.5" class="ink"/><rect x="8.3" y="7.6" width="2.4