<svg xmlns="http://www.w3.org/2000/svg" class="dg-svg dg-tall" viewBox="0 0 340 1441" role="img" aria-labelledby="dg-fusion-p-t dg-fusion-p-d"><title id="dg-fusion-p-t">Fusing a section into an article</title><desc id="dg-fusion-p-d">Article 1: 10 passages on the left feed 5 fused claims; coloured lines under the words show which passages back them (5 colours for 9 quoted passages, never the same colour for two passages of one claim; the passage numbers tell them apart); two points said once by a single passage stand apart; the claims are gathered into the statement “I am a member of one body of reasoning beings, made for a shared life with them.” The word “because” in claim 5 is the editor&#x27;s inference, in purple.</desc><style>.dg-svg{--dg-bg:var(--card,#ffffff);--dg-ink:var(--ink,#171b22);--dg-mu:var(--muted,#626c7a);--dg-line:var(--line,#dfe4eb);--dg-faint:#d3d9e1;--dg-soft:#f1f3f6;--dg-accent:var(--accent,#c64227);--dg-e:var(--e,#55468f);--dg-et:var(--et,#ece9f6);--dg-p1:var(--p1,#4379f9);--dg-p2:var(--p2,#cc689e);--dg-p3:var(--p3,#853f13);--dg-p4:var(--p4,#989401);--dg-p5:var(--p5,#861192);--dg-c1:#2a62b8;--dg-c2:#cf5a2e;--dg-c3:#17998a;--dg-c4:#c99412;--dg-c5:#cc6593;--dg-c6:#5e8c1f;--dg-c7:#7656c9;--dg-fb:#2a62b8;--dg-fa:#17998a;--dg-fl:#c64227;--dg-d1:#1d3f73;--dg-d2:#4f7fc4;--dg-d3:#8fb0e3;--dg-d4:#b7bec8;--dg-sans:var(--sans,Manrope,system-ui,sans-serif);--dg-serif:var(--serif,Georgia,serif)}@media(prefers-color-scheme:dark){.dg-svg{--dg-bg:var(--card,#191e26);--dg-ink:var(--ink,#edf1f7);--dg-mu:var(--muted,#a5afbf);--dg-line:var(--line,#303947);--dg-faint:#3a4453;--dg-soft:#222932;--dg-accent:var(--accent,#ffa080);--dg-e:var(--e,#b9adf0);--dg-et:var(--et,#2e2948);--dg-p1:var(--p1,#2f63e1);--dg-p2:var(--p2,#a95e86);--dg-p3:var(--p3,#d63a00);--dg-p4:var(--p4,#437f43);--dg-p5:var(--p5,#2a97bf);--dg-c1:#4a86e0;--dg-c2:#e06a3a;--dg-c3:#1a9f8f;--dg-c4:#b98914;--dg-c5:#d06898;--dg-c6:#73a62c;--dg-c7:#8c74e4;--dg-fb:#4a86e0;--dg-fa:#1a9f8f;--dg-fl:#e0583a;--dg-d1:#cfe0fa;--dg-d2:#7fa7e6;--dg-d3:#3f6fbf;--dg-d4:#59616d}}.dg-svg{font-family:var(--dg-sans);overflow:visible}.dg-svg text{fill:var(--dg-ink);font-family:var(--dg-sans)}.dg-svg .f{font-family:var(--dg-serif)}.dg-svg .mu{fill:var(--dg-mu)}.dg-svg .ac{fill:var(--dg-accent)}.dg-svg .halo{paint-order:stroke;stroke:var(--dg-bg);stroke-width:5px;stroke-linejoin:round}.dg-svg .bg{fill:var(--dg-bg)}.dg-svg .soft{fill:var(--dg-soft)}.dg-svg .faint{fill:var(--dg-faint)}.dg-svg .ink{fill:var(--dg-ink)}.dg-svg .k{stroke:var(--dg-ink)}.dg-svg .km{stroke:var(--dg-mu)}.dg-svg .kl{stroke:var(--dg-line)}.dg-svg .kf{stroke:var(--dg-faint)}.dg-svg .kb{stroke:var(--dg-bg)}.dg-svg .nf{fill:none}.dg-svg .sac{stroke:var(--dg-accent)}.dg-svg .ef{fill:var(--dg-e)}.dg-svg .etf{fill:var(--dg-et)}.dg-svg .ek{stroke:var(--dg-e)}.dg-svg .p1{fill:var(--dg-p1)}.dg-svg .sp1{stroke:var(--dg-p1)}.dg-svg .p2{fill:var(--dg-p2)}.dg-svg .sp2{stroke:var(--dg-p2)}.dg-svg .p3{fill:var(--dg-p3)}.dg-svg .sp3{stroke:var(--dg-p3)}.dg-svg .p4{fill:var(--dg-p4)}.dg-svg .sp4{stroke:var(--dg-p4)}.dg-svg .p5{fill:var(--dg-p5)}.dg-svg .sp5{stroke:var(--dg-p5)}.dg-svg .c1{fill:var(--dg-c1)}.dg-svg .sc1{stroke:var(--dg-c1)}.dg-svg .c2{fill:var(--dg-c2)}.dg-svg .sc2{stroke:var(--dg-c2)}.dg-svg .c3{fill:var(--dg-c3)}.dg-svg .sc3{stroke:var(--dg-c3)}.dg-svg .c4{fill:var(--dg-c4)}.dg-svg .sc4{stroke:var(--dg-c4)}.dg-svg .c5{fill:var(--dg-c5)}.dg-svg .sc5{stroke:var(--dg-c5)}.dg-svg .c6{fill:var(--dg-c6)}.dg-svg .sc6{stroke:var(--dg-c6)}.dg-svg .c7{fill:var(--dg-c7)}.dg-svg .sc7{stroke:var(--dg-c7)}.dg-svg .fb{fill:var(--dg-fb)}.dg-svg .sfb{stroke:var(--dg-fb)}.dg-svg .fa{fill:var(--dg-fa)}.dg-svg .sfa{stroke:var(--dg-fa)}.dg-svg .fl{fill:var(--dg-fl)}.dg-svg .sfl{stroke:var(--dg-fl)}.dg-svg .d1{fill:var(--dg-d1)}.dg-svg .sd1{stroke:var(--dg-d1)}.dg-svg .d2{fill:var(--dg-d2)}.dg-svg .sd2{stroke:var(--dg-d2)}.dg-svg .d3{fill:var(--dg-d3)}.dg-svg .sd3{stroke:var(--dg-d3)}.dg-svg .d4{fill:var(--dg-d4)}.dg-svg .sd4{stroke:var(--dg-d4)}</style><rect width="340" height="1441" class="bg"/><text x="14.0" y="30.0" font-size="21" font-weight="400" class="f">Fusing a section into an article</text><text x="14.0" y="52.0" font-size="13.5" font-weight="500" class="mu">Article 1, “A member of one body”: <tspan data-d="a1-members">10</tspan> passages, <tspan data-d="a1-claims">5</tspan></text><text x="14.0" y="70.6" font-size="13.5" font-weight="500" class="mu">fused claims, <tspan data-d="a1-single">2</tspan> said once, one statement. 5</text><text x="14.0" y="89.3" font-size="13.5" font-weight="500" class="mu">colours for the 9 quoted passages: two passages</text><text x="14.0" y="107.9" font-size="13.5" font-weight="500" class="mu">that back the same claim never share one, and</text><text x="14.0" y="126.5" font-size="13.5" font-weight="500" class="mu">the numbers tell the rest apart.</text><rect x="14.0" y="152.5" width="58.0" height="24.0" rx="12" class="bg sp2" stroke-width="2.6"/><text x="43.0" y="169.2" font-size="13" font-weight="700" text-anchor="middle">9.7</text><rect x="77.5" y="152.5" width="58.0" height="24.0" rx="12" class="bg sp5" stroke-width="2.6"/><text x="106.5" y="169.2" font-size="13" font-weight="700" text-anchor="middle">5.15</text><rect x="141.0" y="152.5" width="58.0" height="24.0" rx="12" class="bg sp3" stroke-width="2.6"/><text x="170.0" y="169.2" font-size="13" font-weight="700" text-anchor="middle">8.32</text><rect x="204.5" y="152.5" width="58.0" height="24.0" rx="12" class="bg sp3" stroke-width="2.6"/><text x="233.5" y="169.2" font-size="13" font-weight="700" text-anchor="middle">7.10</text><rect x="268.0" y="152.5" width="58.0" height="24.0" rx="12" class="bg sp4" stroke-width="2.6"/><text x="297.0" y="169.2" font-size="13" font-weight="700" text-anchor="middle">4.4</text><rect x="14.0" y="184.5" width="58.0" height="24.0" rx="12" class="bg sp1" stroke-width="2.6"/><text x="43.0" y="201.2" font-size="13" font-weight="700" text-anchor="middle">9.21</text><rect x="77.5" y="184.5" width="58.0" height="24.0" rx="12" class="bg sp5" stroke-width="2.6"/><text x="106.5" y="201.2" font-size="13" font-weight="700" text-anchor="middle">12.23</text><rect x="141.0" y="184.5" width="58.0" height="24.0" rx="12" class="bg sp2" stroke-width="2.6"/><text x="170.0" y="201.2" font-size="13" font-weight="700" text-anchor="middle">11.19</text><rect x="204.5" y="184.5" width="58.0" height="24.0" rx="12" class="nf kf" stroke-width="2"/><text x="233.5" y="201.2" font-size="13" font-weight="700" text-anchor="middle" class="mu">8.52</text><rect x="268.0" y="184.5" width="58.0" height="24.0" rx="12" class="bg sp4" stroke-width="2.6"/><text x="297.0" y="201.2" font-size="13" font-weight="700" text-anchor="middle">11.7</text><text x="14.0" y="235.5" font-size="13" font-weight="500" class="mu">Grey: set aside (8.52). Under each claim: the</text><text x="14.0" y="252.5" font-size="13" font-weight="500" class="mu">passages it is fused from.</text><text x="14.0" y="287.5" font-size="13" font-weight="650" class="mu">Claim 1 · Why · What we are</text><rect x="14.0" y="297.5" width="39.4" height="20.0" rx="10" class="bg sp3" stroke-width="2"/><text x="33.7" y="312.0" font-size="13" font-weight="700" text-anchor="middle">7.10</text><rect x="58.4" y="297.5" width="35.5" height="20.0" rx="10" class="bg sp4" stroke-width="2"/><text x="76.1" y="312.0" font-size="13" font-weight="700" text-anchor="middle">4.4</text><rect x="98.9" y="297.5" width="41.4" height="20.0" rx="10" class="bg sp1" stroke-width="2"/><text x="119.6" y="312.0" font-size="13" font-weight="700" text-anchor="middle">9.21</text><rect x="145.3" y="297.5" width="48.7" height="20.0" rx="10" class="bg sp5" stroke-width="2"/><text x="169.6" y="312.0" font-size="13" font-weight="700" text-anchor="middle">12.23</text><rect x="198.9" y="297.5" width="34.9" height="20.0" rx="10" class="bg sp2" stroke-width="2"/><text x="216.4" y="312.0" font-size="13" font-weight="700" text-anchor="middle">9.7</text><line x1="14.5" y1="345.9" x2="171.1" y2="345.9" class="sp2" stroke-width="2" stroke-linecap="butt"/><line x1="14.5" y1="349.7" x2="171.1" y2="349.7" class="sp3" stroke-width="2" stroke-linecap="butt"/><line x1="175.7" y1="345.9" x2="293.2" y2="345.9" class="sp2" stroke-width="2" stroke-linecap="butt"/><line x1="175.7" y1="349.7" x2="293.2" y2="349.7" class="sp5" stroke-width="2" stroke-linecap="butt"/><line x1="301.8" y1="345.9" x2="314.9" y2="345.9" class="sp3" stroke-width="2" stroke-linecap="butt"/><line x1="14.5" y1="370.9" x2="154.0" y2="370.9" class="sp3" stroke-width="2" stroke-linecap="butt"/><line x1="162.6" y1="370.9" x2="266.9" y2="370.9" class="sp1" stroke-width="2" stroke-linecap="butt"/><line x1="162.6" y1="374.7" x2="266.9" y2="374.7" class="sp4" stroke-width="2" stroke-linecap="butt"/><line x1="14.5" y1="395.9" x2="160.0" y2="395.9" class="sp5" stroke-width="2" stroke-linecap="butt"/><text x="14.0" y="342.5" font-size="15" font-weight="400" class="f">Everything that reasons shares one reason, as</text><text x="14.0" y="367.5" font-size="15" font-weight="400" class="f">limbs share one body, citizens one city, and</text><text x="14.0" y="392.5" font-size="15" font-weight="400" class="f">every lit place one sun.</text><text x="14.0" y="429.5" font-size="13" font-weight="650" class="mu">Claim 2 · Why · What we are for</text><rect x="14.0" y="439.5" width="39.4" height="20.0" rx="10" class="bg sp3" stroke-width="2"/><text x="33.7" y="454.0" font-size="13" font-weight="700" text-anchor="middle">7.10</text><rect x="58.4" y="439.5" width="34.9" height="20.0" rx="10" class="bg sp2" stroke-width="2"/><text x="75.8" y="454.0" font-size="13" font-weight="700" text-anchor="middle">9.7</text><rect x="98.2" y="439.5" width="39.3" height="20.0" rx="10" class="bg sp5" stroke-width="2"/><text x="117.9" y="454.0" font-size="13" font-weight="700" text-anchor="middle">5.15</text><line x1="14.5" y1="487.9" x2="100.2" y2="487.9" class="sp3" stroke-width="2" stroke-linecap="butt"/><line x1="14.5" y1="491.7" x2="100.2" y2="491.7" class="sp5" stroke-width="2" stroke-linecap="butt"/><line x1="104.8" y1="487.9" x2="206.2" y2="487.9" class="sp2" stroke-width="2" stroke-linecap="butt"/><line x1="104.8" y1="491.7" x2="206.2" y2="491.7" class="sp5" stroke-width="2" stroke-linecap="butt"/><line x1="239.5" y1="487.9" x2="285.4" y2="487.9" class="sp3" stroke-width="2" stroke-linecap="butt"/><line x1="14.5" y1="512.9" x2="108.7" y2="512.9" class="sp3" stroke-width="2" stroke-linecap="butt"/><line x1="146.0" y1="512.9" x2="317.1" y2="512.9" class="sp5" stroke-width="2" stroke-linecap="butt"/><line x1="263.6" y1="516.7" x2="317.1" y2="516.7" class="sp3" stroke-width="2" stroke-linecap="butt"/><line x1="14.5" y1="537.9" x2="45.9" y2="537.9" class="sp5" stroke-width="2" stroke-linecap="butt"/><line x1="14.5" y1="541.7" x2="45.9" y2="541.7" class="sp3" stroke-width="2" stroke-linecap="butt"/><text x="14.0" y="484.5" font-size="15" font-weight="400" class="f">We are made for one another and for one</text><text x="14.0" y="509.5" font-size="15" font-weight="400" class="f">common work, and that shared life is our own</text><text x="14.0" y="534.5" font-size="15" font-weight="400" class="f">good.</text><text x="14.0" y="571.5" font-size="13" font-weight="650" class="mu">Claim 3 · In action · What follows for action</text><rect x="14.0" y="581.5" width="41.4" height="20.0" rx="10" class="bg sp1" stroke-width="2"/><text x="34.7" y="596.0" font-size="13" font-weight="700" text-anchor="middle">9.21</text><rect x="60.4" y="581.5" width="43.0" height="20.0" rx="10" class="bg sp2" stroke-width="2"/><text x="81.9" y="596.0" font-size="13" font-weight="700" text-anchor="middle">11.19</text><line x1="34.6" y1="629.9" x2="180.6" y2="629.9" class="sp1" stroke-width="2" stroke-linecap="butt"/><line x1="185.2" y1="629.9" x2="312.4" y2="629.9" class="sp1" stroke-width="2" stroke-linecap="butt"/><line x1="185.2" y1="633.7" x2="312.4" y2="633.7" class="sp2" stroke-width="2" stroke-linecap="butt"/><line x1="14.5" y1="654.9" x2="45.9" y2="654.9" class="sp1" stroke-width="2" stroke-linecap="butt"/><line x1="14.5" y1="658.7" x2="45.9" y2="658.7" class="sp2" stroke-width="2" stroke-linecap="butt"/><line x1="54.6" y1="654.9" x2="207.8" y2="654.9" class="sp1" stroke-width="2" stroke-linecap="butt"/><line x1="245.1" y1="654.9" x2="311.6" y2="654.9" class="sp2" stroke-width="2" stroke-linecap="butt"/><line x1="14.5" y1="679.9" x2="294.5" y2="679.9" class="sp2" stroke-width="2" stroke-linecap="butt"/><text x="14.0" y="626.5" font-size="15" font-weight="400" class="f">So each thing I do should aim at the common</text><text x="14.0" y="651.5" font-size="15" font-weight="400" class="f">good, directly or at a distance, and holding to</text><text x="14.0" y="676.5" font-size="15" font-weight="400" class="f">that one aim is what makes me one person.</text><text x="14.0" y="713.5" font-size="13" font-weight="650" class="mu">Said once · Practice · 7.10</text><rect x="14.0" y="723.5" width="39.4" height="20.0" rx="10" class="bg sp3" stroke-width="2"/><text x="33.7" y="738.0" font-size="13" font-weight="700" text-anchor="middle">7.10</text><text x="14.0" y="768.5" font-size="15" font-weight="400" class="f">I shall often say to myself: I am a member, and</text><text x="14.0" y="793.5" font-size="15" font-weight="400" class="f">not merely a part.</text><text x="14.0" y="830.5" font-size="13" font-weight="650" class="mu">Claim 4 · When it breaks · What breaking it does</text><rect x="14.0" y="840.5" width="37.7" height="20.0" rx="10" class="bg sp4" stroke-width="2"/><text x="32.9" y="855.0" font-size="13" font-weight="700" text-anchor="middle">11.7</text><rect x="56.7" y="840.5" width="43.2" height="20.0" rx="10" class="bg sp3" stroke-width="2"/><text x="78.3" y="855.0" font-size="13" font-weight="700" text-anchor="middle">8.32</text><rect x="105.0" y="840.5" width="41.4" height="20.0" rx="10" class="bg sp1" stroke-width="2"/><text x="125.6" y="855.0" font-size="13" font-weight="700" text-anchor="middle">9.21</text><line x1="14.5" y1="888.9" x2="157.6" y2="888.9" class="sp4" stroke-width="2" stroke-linecap="butt"/><line x1="166.3" y1="888.9" x2="245.1" y2="888.9" class="sp3" stroke-width="2" stroke-linecap="butt"/><line x1="271.6" y1="888.9" x2="311.7" y2="888.9" class="sp3" stroke-width="2" stroke-linecap="butt"/><line x1="14.5" y1="913.9" x2="105.7" y2="913.9" class="sp3" stroke-width="2" stroke-linecap="butt"/><line x1="114.3" y1="913.9" x2="212.0" y2="913.9" class="sp1" stroke-width="2" stroke-linecap="butt"/><line x1="114.3" y1="917.7" x2="212.0" y2="917.7" class="sp3" stroke-width="2" stroke-linecap="butt"/><line x1="114.3" y1="921.5" x2="212.0" y2="921.5" class="sp4" stroke-width="2" stroke-linecap="butt"/><line x1="169.1" y1="938.9" x2="268.2" y2="938.9" class="sp3" stroke-width="2" stroke-linecap="butt"/><line x1="169.1" y1="942.7" x2="268.2" y2="942.7" class="sp4" stroke-width="2" stroke-linecap="butt"/><text x="14.0" y="885.5" font-size="15" font-weight="400" class="f">When I hate someone, wrong them, or resent</text><text x="14.0" y="910.5" font-size="15" font-weight="400" class="f">what happens, I cut myself off, and not from</text><text x="14.0" y="935.5" font-size="15" font-weight="400" class="f">that one thing only but from the whole.</text><text x="14.0" y="972.5" font-size="13" font-weight="650" class="mu">Claim 5 · When it breaks · The way back</text><rect x="14.0" y="982.5" width="37.7" height="20.0" rx="10" class="bg sp4" stroke-width="2"/><text x="32.9" y="997.0" font-size="13" font-weight="700" text-anchor="middle">11.7</text><rect x="56.7" y="982.5" width="43.2" height="20.0" rx="10" class="bg sp3" stroke-width="2"/><text x="78.3" y="997.0" font-size="13" font-weight="700" text-anchor="middle">8.32</text><rect x="105.0" y="982.5" width="34.9" height="20.0" rx="10" class="bg sp2" stroke-width="2"/><text x="122.4" y="997.0" font-size="13" font-weight="700" text-anchor="middle">9.7</text><line x1="163.1" y1="1030.9" x2="265.8" y2="1030.9" class="sp3" stroke-width="2" stroke-linecap="butt"/><line x1="163.1" y1="1034.7" x2="320.7" y2="1034.7" class="sp4" stroke-width="2" stroke-linecap="butt"/><line x1="14.5" y1="1059.7" x2="52.9" y2="1059.7" class="sp4" stroke-width="2" stroke-linecap="butt"/><line x1="117.6" y1="1055.9" x2="292.3" y2="1055.9" class="sp2" stroke-width="2" stroke-linecap="butt"/><rect x="58.1" y="1040.2" width="58.4" height="16.8" rx="3" class="etf"/><line x1="14.5" y1="1080.9" x2="60.9" y2="1080.9" class="sp2" stroke-width="2" stroke-linecap="butt"/><text x="14.0" y="1027.5" font-size="15" font-weight="400" class="f">Having cut myself off, I can grow back into the</text><text x="14.0" y="1052.5" font-size="15" font-weight="400" class="f">whole, <tspan class="ef">because</tspan> nature is stronger than my</text><text x="14.0" y="1077.5" font-size="15" font-weight="400" class="f">leaving.</text><text x="14.0" y="1101.5" font-size="13" font-weight="650" class="ef">Purple: the editor’s inference</text><text x="14.0" y="1138.5" font-size="13" font-weight="650" class="mu">Said once · When it breaks · 11.7</text><rect x="14.0" y="1148.5" width="37.7" height="20.0" rx="10" class="bg sp4" stroke-width="2"/><text x="32.9" y="1163.0" font-size="13" font-weight="700" text-anchor="middle">11.7</text><text x="14.0" y="1193.5" font-size="15" font-weight="400" class="f">The more often I cut myself off, the harder the</text><text x="14.0" y="1218.5" font-size="15" font-weight="400" class="f">return.</text><path d="M164.0 1239.5 L170.0 1245.5 L176.0 1239.5" class="nf km" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="14.0" y="1256.5" width="312.0" height="138.4" rx="10" class="nf k" stroke-width="1.3"/><text x="26.0" y="1280.5" font-size="13" font-weight="650" class="mu">The statement · gathers claims 1 and 2</text><line x1="69.4" y1="1315.5" x2="152.8" y2="1315.5" class="sp1" stroke-width="2.4" stroke-linecap="butt"/><line x1="69.4" y1="1319.7" x2="152.8" y2="1319.7" class="sp3" stroke-width="2.4" stroke-linecap="butt"/><line x1="158.4" y1="1315.5" x2="254.8" y2="1315.5" class="sp3" stroke-width="2.4" stroke-linecap="butt"/><line x1="158.4" y1="1319.7" x2="254.8" y2="1319.7" class="sp4" stroke-width="2.4" stroke-linecap="butt"/><line x1="260.4" y1="1315.5" x2="275.8" y2="1315.5" class="sp2" stroke-width="2.4" stroke-linecap="butt"/><line x1="260.4" y1="1319.7" x2="275.8" y2="1319.7" class="sp3" stroke-width="2.4" stroke-linecap="butt"/><line x1="26.5" y1="1345.0" x2="167.3" y2="1345.0" class="sp2" stroke-width="2.4" stroke-linecap="butt"/><line x1="26.5" y1="1349.2" x2="167.3" y2="1349.2" class="sp3" stroke-width="2.4" stroke-linecap="butt"/><line x1="178.0" y1="1345.0" x2="266.3" y2="1345.0" class="sp3" stroke-width="2.4" stroke-linecap="butt"/><line x1="178.0" y1="1349.2" x2="266.3" y2="1349.2" class="sp5" stroke-width="2.4" stroke-linecap="butt"/><line x1="26.5" y1="1374.4" x2="203.1" y2="1374.4" class="sp3" stroke-width="2.4" stroke-linecap="butt"/><line x1="26.5" y1="1378.6" x2="203.1" y2="1378.6" class="sp5" stroke-width="2.4" stroke-linecap="butt"/><text x="26.0" y="1311.5" font-size="19" font-weight="400" class="f">I am a member of one body of</text><text x="26.0" y="1341.0" font-size="19" font-weight="400" class="f">reasoning beings, made for a</text><text x="26.0" y="1370.4" font-size="19" font-weight="400" class="f">shared life with them.</text><g class="dg-foot"><g transform="translate(14,1407.8) scale(0.684)"><rect width="19" height="19" rx="5.5" class="ink"/><rect x="8.3" y="7.6" width="2.4" height="7" rx=".8" class="bg"/><circle cx="9.5" cy="4.9" r="1.35" class="ac"/></g><text x="32.8" y="1419.0" font-size="13" font-weight="650" class="mu">ilyadays.com · Stoic Constitution</text></g></svg>
