<svg xmlns="http://www.w3.org/2000/svg" class="dg-svg dg-tall" viewBox="0 0 340 1095" role="img" aria-labelledby="dg-translation-p-t dg-translation-p-d"><title id="dg-translation-p-t">Three readings for every passage</title><desc id="dg-translation-p-d">Three lanes. Greek to English: 418 passages, points settled 969 accepted, 465 partly, 189 declined. Latin to English: 304 sections, 716, 349, 86. English to Russian: 722 passages, 150, 57, 7.</desc><style>.dg-svg{--dg-bg:var(--card,#ffffff);--dg-ink:var(--ink,#171b22);--dg-mu:var(--muted,#626c7a);--dg-line:var(--line,#dfe4eb);--dg-faint:#d3d9e1;--dg-soft:#f1f3f6;--dg-accent:var(--accent,#c64227);--dg-e:var(--e,#55468f);--dg-et:var(--et,#ece9f6);--dg-p1:var(--p1,#4379f9);--dg-p2:var(--p2,#cc689e);--dg-p3:var(--p3,#853f13);--dg-p4:var(--p4,#989401);--dg-p5:var(--p5,#861192);--dg-c1:#2a62b8;--dg-c2:#cf5a2e;--dg-c3:#17998a;--dg-c4:#c99412;--dg-c5:#cc6593;--dg-c6:#5e8c1f;--dg-c7:#7656c9;--dg-fb:#2a62b8;--dg-fa:#17998a;--dg-fl:#c64227;--dg-d1:#1d3f73;--dg-d2:#4f7fc4;--dg-d3:#8fb0e3;--dg-d4:#b7bec8;--dg-sans:var(--sans,Manrope,system-ui,sans-serif);--dg-serif:var(--serif,Georgia,serif)}@media(prefers-color-scheme:dark){.dg-svg{--dg-bg:var(--card,#191e26);--dg-ink:var(--ink,#edf1f7);--dg-mu:var(--muted,#a5afbf);--dg-line:var(--line,#303947);--dg-faint:#3a4453;--dg-soft:#222932;--dg-accent:var(--accent,#ffa080);--dg-e:var(--e,#b9adf0);--dg-et:var(--et,#2e2948);--dg-p1:var(--p1,#2f63e1);--dg-p2:var(--p2,#a95e86);--dg-p3:var(--p3,#d63a00);--dg-p4:var(--p4,#437f43);--dg-p5:var(--p5,#2a97bf);--dg-c1:#4a86e0;--dg-c2:#e06a3a;--dg-c3:#1a9f8f;--dg-c4:#b98914;--dg-c5:#d06898;--dg-c6:#73a62c;--dg-c7:#8c74e4;--dg-fb:#4a86e0;--dg-fa:#1a9f8f;--dg-fl:#e0583a;--dg-d1:#cfe0fa;--dg-d2:#7fa7e6;--dg-d3:#3f6fbf;--dg-d4:#59616d}}.dg-svg{font-family:var(--dg-sans);overflow:visible}.dg-svg text{fill:var(--dg-ink);font-family:var(--dg-sans)}.dg-svg .f{font-family:var(--dg-serif)}.dg-svg .mu{fill:var(--dg-mu)}.dg-svg .ac{fill:var(--dg-accent)}.dg-svg .halo{paint-order:stroke;stroke:var(--dg-bg);stroke-width:5px;stroke-linejoin:round}.dg-svg .bg{fill:var(--dg-bg)}.dg-svg .soft{fill:var(--dg-soft)}.dg-svg .faint{fill:var(--dg-faint)}.dg-svg .ink{fill:var(--dg-ink)}.dg-svg .k{stroke:var(--dg-ink)}.dg-svg .km{stroke:var(--dg-mu)}.dg-svg .kl{stroke:var(--dg-line)}.dg-svg .kf{stroke:var(--dg-faint)}.dg-svg .kb{stroke:var(--dg-bg)}.dg-svg .nf{fill:none}.dg-svg .sac{stroke:var(--dg-accent)}.dg-svg .ef{fill:var(--dg-e)}.dg-svg .etf{fill:var(--dg-et)}.dg-svg .ek{stroke:var(--dg-e)}.dg-svg .p1{fill:var(--dg-p1)}.dg-svg .sp1{stroke:var(--dg-p1)}.dg-svg .p2{fill:var(--dg-p2)}.dg-svg .sp2{stroke:var(--dg-p2)}.dg-svg .p3{fill:var(--dg-p3)}.dg-svg .sp3{stroke:var(--dg-p3)}.dg-svg .p4{fill:var(--dg-p4)}.dg-svg .sp4{stroke:var(--dg-p4)}.dg-svg .p5{fill:var(--dg-p5)}.dg-svg .sp5{stroke:var(--dg-p5)}.dg-svg .c1{fill:var(--dg-c1)}.dg-svg .sc1{stroke:var(--dg-c1)}.dg-svg .c2{fill:var(--dg-c2)}.dg-svg .sc2{stroke:var(--dg-c2)}.dg-svg .c3{fill:var(--dg-c3)}.dg-svg .sc3{stroke:var(--dg-c3)}.dg-svg .c4{fill:var(--dg-c4)}.dg-svg .sc4{stroke:var(--dg-c4)}.dg-svg .c5{fill:var(--dg-c5)}.dg-svg .sc5{stroke:var(--dg-c5)}.dg-svg .c6{fill:var(--dg-c6)}.dg-svg .sc6{stroke:var(--dg-c6)}.dg-svg .c7{fill:var(--dg-c7)}.dg-svg .sc7{stroke:var(--dg-c7)}.dg-svg .fb{fill:var(--dg-fb)}.dg-svg .sfb{stroke:var(--dg-fb)}.dg-svg .fa{fill:var(--dg-fa)}.dg-svg .sfa{stroke:var(--dg-fa)}.dg-svg .fl{fill:var(--dg-fl)}.dg-svg .sfl{stroke:var(--dg-fl)}.dg-svg .d1{fill:var(--dg-d1)}.dg-svg .sd1{stroke:var(--dg-d1)}.dg-svg .d2{fill:var(--dg-d2)}.dg-svg .sd2{stroke:var(--dg-d2)}.dg-svg .d3{fill:var(--dg-d3)}.dg-svg .sd3{stroke:var(--dg-d3)}.dg-svg .d4{fill:var(--dg-d4)}.dg-svg .sd4{stroke:var(--dg-d4)}</style><rect width="340" height="1095" class="bg"/><text x="14.0" y="30.0" font-size="21" font-weight="400" class="f">Three readings for every passage</text><text x="14.0" y="52.0" font-size="13.5" font-weight="500" class="mu">Greek and Latin into today’s English, then into</text><text x="14.0" y="70.6" font-size="13.5" font-weight="500" class="mu">Russian. Every point of the second reader is</text><text x="14.0" y="89.3" font-size="13.5" font-weight="500" class="mu">settled in writing: by a third reader in a fresh</text><text x="14.0" y="107.9" font-size="13.5" font-weight="500" class="mu">context, or, for the Russian, by the translator.</text><text x="14.0" y="149.9" font-size="16" font-weight="750">Greek → English</text><text x="14.0" y="169.9" font-size="13" font-weight="500" class="mu"><tspan data-d="tr-marcus">418</tspan> passages of Marcus · Claude Fable 5.2</text><rect x="14.0" y="183.9" width="312.0" height="40.0" rx="7" class="soft"/><text x="24.0" y="200.9" font-size="13" font-weight="750">1 · Translator</text><text x="24.0" y="216.9" font-size="13" font-weight="500" class="mu">sees the Greek</text><rect x="14.0" y="229.9" width="312.0" height="40.0" rx="7" class="soft"/><text x="24.0" y="246.9" font-size="13" font-weight="750">2 · Checker</text><text x="24.0" y="262.9" font-size="13" font-weight="500" class="mu">the Greek and the English</text><rect x="14.0" y="275.9" width="312.0" height="40.0" rx="7" class="soft"/><text x="24.0" y="292.9" font-size="13" font-weight="750">3 · Settler</text><text x="24.0" y="308.9" font-size="13" font-weight="500" class="mu">Greek, draft and points</text><rect x="14.0" y="325.9" width="182.2" height="13" rx="2" class="d1"><title>accepted: 969</title></rect><rect x="198.2" y="325.9" width="86.4" height="13" rx="2" class="d2"><title>partly: 465</title></rect><rect x="286.6" y="325.9" width="33.9" height="13" rx="2" class="d3"><title>declined: 189</title></rect><rect x="322.6" y="325.9" width="1.4" height="13" rx="2" class="d4"><title>free form: 18</title></rect><rect x="14.0" y="349.1" width="9.4" height="9.4" rx="2" class="d1"/><text x="27.0" y="358.9" font-size="13" font-weight="600"><tspan data-d="dec-marcus-accepted">969</tspan> accepted</text><rect x="124.0" y="349.1" width="9.4" height="9.4" rx="2" class="d2"/><text x="137.0" y="358.9" font-size="13" font-weight="600"><tspan data-d="dec-marcus-partly">465</tspan> partly</text><rect x="211.8" y="349.1" width="9.4" height="9.4" rx="2" class="d3"/><text x="224.8" y="358.9" font-size="13" font-weight="600"><tspan data-d="dec-marcus-declined">189</tspan> declined</text><rect x="14.0" y="367.3" width="9.4" height="9.4" rx="2" class="d4"/><text x="27.0" y="377.1" font-size="13" font-weight="600"><tspan data-d="dec-marcus-free">18</tspan> free form</text><text x="14.0" y="397.1" font-size="13" font-weight="500" class="mu"><tspan data-d="dec-marcus-found">137</tspan> of the accepted are faults the settler found</text><text x="14.0" y="414.1" font-size="13" font-weight="500" class="mu">itself · <tspan data-d="notes-marcus">3,201</tspan> notes on what the Greek leaves open</text><line x1="14.0" y1="436.1" x2="326.0" y2="436.1" class="kl" stroke-width="1"/><text x="14.0" y="464.1" font-size="16" font-weight="750">Latin → English</text><text x="14.0" y="484.1" font-size="13" font-weight="500" class="mu"><tspan data-d="tr-seneca">304</tspan> sections of Seneca, <tspan data-d="tr-letters">94</tspan> letters · Claude Fable</text><text x="14.0" y="501.1" font-size="13" font-weight="500" class="mu">5.2</text><rect x="14.0" y="515.1" width="312.0" height="40.0" rx="7" class="soft"/><text x="24.0" y="532.1" font-size="13" font-weight="750">1 · Translator</text><text x="24.0" y="548.1" font-size="13" font-weight="500" class="mu">sees the Latin</text><rect x="14.0" y="561.1" width="312.0" height="40.0" rx="7" class="soft"/><text x="24.0" y="578.1" font-size="13" font-weight="750">2 · Checker</text><text x="24.0" y="594.1" font-size="13" font-weight="500" class="mu">the Latin and the English</text><rect x="14.0" y="607.1" width="312.0" height="40.0" rx="7" class="soft"/><text x="24.0" y="624.1" font-size="13" font-weight="750">3 · Settler</text><text x="24.0" y="640.1" font-size="13" font-weight="500" class="mu">La