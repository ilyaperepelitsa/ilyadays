 font-weight="750">2 · Second reader</text><text x="24.0" y="907.1" font-size="13" font-weight="500" class="mu">Sonnet, English and Russian</text><rect x="14.0" y="920.1" width="312.0" height="40.0" rx="7" class="soft"/><text x="24.0" y="937.1" font-size="13" font-weight="750">3 · Translator settles</text><text x="24.0" y="953.1" font-size="13" font-weight="500" class="mu">each point in writing</text><rect x="14.0" y="970.1" width="26.5" height="13" rx="2" class="d1"><title>accepted: 150</title></rect><rect x="42.5" y="970.1" width="8.8" height="13" rx="2" class="d2"><title>partly: 57</title></rect><rect x="53.4" y="970.1" width="1.0" height="13" rx="2" class="d3"><title>declined: 7</title></rect><rect x="14.0" y="993.3" width="9.4" height="9.4" rx="2" class="d1"/><text x="27.0" y="1003.1" font-size="13" font-weight="600"><tspan data-d="dec-ru-accepted">150</tspan> accepted</text><rect x="121.4" y="993.3" width="9.4" height="9.4" rx="2" class="d2"/><text x="134.4" y="1003.1" font-size="13" font-weight="600"><tspan data-d="dec-ru-partly">57</tspan> partly</text><rect x="200.2" y="993.3" width="9.4" height="9.4" rx="2" class="d3"/><text x="213.2" y="1003.1" font-size="13" font-weight="600"><tspan data-d="dec-ru-declined">7</tspan> declined</text><text x="14.0" y="1023.1" font-size="13" font-weight="500" class="mu">Every quote of the articles cut again from the</text><text x="14.0" y="1040.1" font-size="13" font-weight="500" class="mu">Russian; a glossary fixes the page’s terms</text><g class="dg-foot"><g transform="translate(14,1061.8) scale(0.684)"><rect width="19" height="19" rx="5.5" class="ink"/><rect x="8.3" y="7.6" width="2.4" height="7" rx=".8" class="bg"/><circle cx="9.5" cy="4.9" r="1.35" class="ac"/></g><text x="32.8" y="1073.0" font-size="13" font-weight="650" class="mu">ilyadays.com · Stoic Constitution</text></g></svg>
