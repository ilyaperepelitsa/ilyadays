<svg xmlns="http://www.w3.org/2000/svg" class="dg-svg dg-wide" viewBox="0 0 1200 1200" role="img" aria-labelledby="ru-dg-fusion-w-t ru-dg-fusion-w-d"><title id="ru-dg-fusion-w-t">Как раздел сливается в статью</title><desc id="ru-dg-fusion-w-d">Статья 1: 10 фрагментов слева питают 5 утверждений; цветные линии под словами показывают, какие фрагменты их подкрепляют (5 цветов на 9 цитируемых фрагментов, у двух фрагментов одного утверждения цвета всегда разные; различают их номера); два пункта сказаны однажды одним фрагментом; утверждения собраны в положение «Я часть единого тела разумных существ, созданная для общей жизни с ними.» Слова «потому что» в утверждении 5 — вывод редактора, фиолетовым.</desc><style>.dg-svg{--dg-bg:var(--card,#ffffff);--dg-ink:var(--ink,#171b22);--dg-mu:var(--muted,#626c7a);--dg-line:var(--line,#dfe4eb);--dg-faint:#d3d9e1;--dg-soft:#f1f3f6;--dg-accent:var(--accent,#c64227);--dg-e:var(--e,#55468f);--dg-et:var(--et,#ece9f6);--dg-p1:var(--p1,#4379f9);--dg-p2:var(--p2,#cc689e);--dg-p3:var(--p3,#853f13);--dg-p4:var(--p4,#989401);--dg-p5:var(--p5,#861192);--dg-c1:#2a62b8;--dg-c2:#cf5a2e;--dg-c3:#17998a;--dg-c4:#c99412;--dg-c5:#cc6593;--dg-c6:#5e8c1f;--dg-c7:#7656c9;--dg-fb:#2a62b8;--dg-fa:#17998a;--dg-fl:#c64227;--dg-d1:#1d3f73;--dg-d2:#4f7fc4;--dg-d3:#8fb0e3;--dg-d4:#b7bec8;--dg-sans:var(--sans,Manrope,system-ui,sans-serif);--dg-serif:var(--serif,Georgia,serif)}@media(prefers-color-scheme:dark){.dg-svg{--dg-bg:var(--card,#191e26);--dg-ink:var(--ink,#edf1f7);--dg-mu:var(--muted,#a5afbf);--dg-line:var(--line,#303947);--dg-faint:#3a4453;--dg-soft:#222932;--dg-accent:var(--accent,#ffa080);--dg-e:var(--e,#b9adf0);--dg-et:var(--et,#2e2948);--dg-p1:var(--p1,#2f63e1);--dg-p2:var(--p2,#a95e86);--dg-p3:var(--p3,#d63a00);--dg-p4:var(--p4,#437f43);--dg-p5:var(--p5,#2a97bf);--dg-c1:#4a86e0;--dg-c2:#e06a3a;--dg-c3:#1a9f8f;--dg-c4:#b98914;--dg-c5:#d06898;--dg-c6:#73a62c;--dg-c7:#8c74e4;--dg-fb:#4a86e0;--dg-fa:#1a9f8f;--dg-fl:#e0583a;--dg-d1:#cfe0fa;--dg-d2:#7fa7e6;--dg-d3:#3f6fbf;--dg-d4:#59616d}}.dg-svg{font-family:var(--dg-sans);overflow:visible}.dg-svg text{fill:var(--dg-ink);font-family:var(--dg-sans)}.dg-svg .f{font-family:var(--dg-serif)}.dg-svg .mu{fill:var(--dg-mu)}.dg-svg .ac{fill:var(--dg-accent)}.dg-svg .halo{paint-order:stroke;stroke:var(--dg-bg);stroke-width:5px;stroke-linejoin:round}.dg-svg .bg{fill:var(--dg-bg)}.dg-svg .soft{fill:var(--dg-soft)}.dg-svg .faint{fill:var(--dg-faint)}.dg-svg .ink{fill:var(--dg-ink)}.dg-svg .k{stroke:var(--dg-ink)}.dg-svg .km{stroke:var(--dg-mu)}.dg-svg .kl{stroke:var(--dg-line)}.dg-svg .kf{stroke:var(--dg-faint)}.dg-svg .kb{stroke:var(--dg-bg)}.dg-svg .nf{fill:none}.dg-svg .sac{stroke:var(--dg-accent)}.dg-svg .ef{fill:var(--dg-e)}.dg-svg .etf{fill:var(--dg-et)}.dg-svg .ek{stroke:var(--dg-e)}.dg-svg .p1{fill:var(--dg-p1)}.dg-svg .sp1{stroke:var(--dg-p1)}.dg-svg .p2{fill:var(--dg-p2)}.dg-svg .sp2{stroke:var(--dg-p2)}.dg-svg .p3{fill:var(--dg-p3)}.dg-svg .sp3{stroke:var(--dg-p3)}.dg-svg .p4{fill:var(--dg-p4)}.dg-svg .sp4{stroke:var(--dg-p4)}.dg-svg .p5{fill:var(--dg-p5)}.dg-svg .sp5{stroke:var(--dg-p5)}.dg-svg .c1{fill:var(--dg-c1)}.dg-svg .sc1{stroke:var(--dg-c1)}.dg-svg .c2{fill:var(--dg-c2)}.dg-svg .sc2{stroke:var(--dg-c2)}.dg-svg .c3{fill:var(--dg-c3)}.dg-svg .sc3{stroke:var(--dg-c3)}.dg-svg .c4{fill:var(--dg-c4)}.dg-svg .sc4{stroke:var(--dg-c4)}.dg-svg .c5{fill:var(--dg-c5)}.dg-svg .sc5{stroke:var(--dg-c5)}.dg-svg .c6{fill:var(--dg-c6)}.dg-svg .sc6{stroke:var(--dg-c6)}.dg-svg .c7{fill:var(--dg-c7)}.dg-svg .sc7{stroke:var(--dg-c7)}.dg-svg .fb{fill:var(--dg-fb)}.dg-svg .sfb{stroke:var(--dg-fb)}.dg-svg .fa{fill:var(--dg-fa)}.dg-svg .sfa{stroke:var(--dg-fa)}.dg-svg .fl{fill:var(--dg-fl)}.dg-svg .sfl{stroke:var(--dg-fl)}.dg-svg .d1{fill:var(--dg-d1)}.dg-svg .sd1{stroke:var(--dg-d1)}.dg-svg .d2{fill:var(--dg-d2)}.dg-svg .sd2{stroke:var(--dg-d2)}.dg-svg .d3{fill:var(--dg-d3)}.dg-svg .sd3{stroke:var(--dg-d3)}.dg-svg .d4{fill:var(--dg-d4)}.dg-svg .sd4{stroke:var(--dg-d4)}</style><rect width="1200" height="1200" class="bg"/><text x="72.0" y="104.0" font-size="50" font-weight="400" class="f">Как раздел сливается в статью</text><text x="72.0" y="149.5" font-size="26" font-weight="500" class="mu">Статья 1 «Часть единого тела»: <tspan data-d="a1-members">10</tspan> фрагментов, <tspan data-d="a1-claims">5</tspan> утверждений, <tspan data-d="a1-single">2</tspan> — сказано</text><text x="72.0" y="184.9" font-size="26" font-weight="500" class="mu">однажды. 5 цветов на 9 фрагментов; у двух фрагментов одного утверждения цвета</text><text x="72.0" y="220.2" font-size="26" font-weight="500" class="mu">разные.</text><path d="M178.0 512.9 C251.7 512.9 251.7 304.9 312.0 304.9" class="nf sp3" stroke-width="2.2" opacity=".9"/><path d="M178.0 584.4 C251.7 584.4 251.7 319.3 312.0 319.3" class="nf sp4" stroke-width="2.2" opacity=".9"/><path d="M178.0 655.9 C251.7 655.9 251.7 333.6 312.0 333.6" class="nf sp1" stroke-width="2.2" opacity=".9"/><path d="M178.0 727.5 C251.7 727.5 251.7 347.9 312.0 347.9" class="nf sp5" stroke-width="2.2" opacity=".9"/><path d="M178.0 298.2 C251.7 298.2 251.7 362.3 312.0 362.3" class="nf sp2" stroke-width="2.2" opacity=".9"/><path d="M178.0 512.9 C251.7 512.9 251.7 420.8 312.0 420.8" class="nf sp3" stroke-width="2.2" opacity=".9"/><path d="M178.0 298.2 C251.7 298.2 251.7 442.3 312.0 442.3" class="nf sp2" stroke-width="2.2" opacity=".9"/><path d="M178.0 369.8 C251.7 369.8 251.7 463.8 312.0 463.8" class="nf sp5" stroke-width="2.2" opacity=".9"/><path d="M178.0 655.9 C251.7 655.9 251.7 536.6 312.0 536.6" class="nf sp1" stroke-width="2.2" opacity=".9"/><path d="M178.0 799.0 C251.7 799.0 251.7 565.2 312.0 565.2" class="nf sp2" stroke-width="2.2" opacity=".9"/><path d="M178.0 512.9 C251.7 512.9 251.7 643.3 312.0 643.3" class="nf sp3" stroke-width="2.2" opacity=".9"/><path d="M178.0 942.1 C251.7 942.1 251.7 714.2 312.0 714.2" class="nf sp4" stroke-width="2.2" opacity=".9"/><path d="M178.0 441.3 C251.7 441.3 251.7 735.7 312.0 735.7" class="nf sp3" stroke-width="2.2" opacity=".9"/><path d="M178.0 655.9 C251.7 655.9 251.7 757.2 312.0 757.2" class="nf sp1" stroke-width="2.2" opacity=".9"/><path d="M178.0 942.1 C251.7 942.1 251.7 822.9 312.0 822.9" class="nf sp4" stroke-width="2.2" opacity=".9"/><path d="M178.0 441.3 C251.7 441.3 251.7 844.3 312.0 844.3" class="nf sp3" stroke-width="2.2" opacity=".9"/><path d="M178.0 298.2 C251.7 298.2 251.7 865.8 312.0 865.8" class="nf sp2" stroke-width="2.2" opacity=".9"/><path d="M178.0 942.1 C251.7 942.1 251.7 936.7 312.0 936.7" class="nf sp4" stroke-width="2.2" opacity=".9"/><text x="326.0" y="303.2" font-size="21" font-weight="650" class="mu">Утверждение 1 · Почему · Что мы такое</text><line x1="326.5" y1="339.6" x2="528.0" y2="339.6" class="sp2" stroke-width="2.6" stroke-linecap="butt"/><line x1="326.5" y1="344.0" x2="528.0" y2="344.0" class="sp3" stroke-width="2.6" stroke-linecap="butt"/><line x1="540.3" y1="339.6" x2="805.9" y2="339.6" class="sp2" stroke-width="2.6" stroke-linecap="butt"/><line x1="540.3" y1="344.0" x2="805.9" y2="344.0" class="sp5" stroke-width="2.6" stroke-linecap="butt"/><line x1="818.1" y1="339.6" x2="1070.6" y2="339.6" class="sp3" stroke-width="2.6" stroke-linecap="butt"/><line x1="326.5" y1="372.2" x2="603.4" y2="372.2" class="sp1" stroke-width="2.6" stroke-linecap="butt"/><line x1="326.5" y1="376.6" x2="603.4" y2="376.6" class="sp4" stroke-width="2.6" stroke-linecap="butt"/><line x1="632.1" y1="372.2" x2="1074.0" y2="372.2" class="sp5" stroke-width="2.6" stroke-linecap="butt"/><text x="326.0" y="335.2" font-size="22" font-weight="400" class="f">Всё, что рассуждает, причастно одному разуму, как части — одному телу,</text><text x="326.0" y="367.8" font-size="22" font-weight="400" class="f">граждане — одному городу, а всякое освещённое место — одному солнцу.</text><text x="326.0" y="411.9" font-size="21" font-weight="650" class="mu">Утверждение 2 · Почему · Для чего мы</text><line x1="326.5" y1="448.3" x2="453.6" y2="448.3" class="sp3" stroke-width="2.6" stroke-linecap="butt"/><line x1="326.5" y1="452.7" x2="453.6" y2="452.7" class="sp5" stroke-width="2.6" stroke-linecap="butt"/><line x1="459.9" y1="448.3" x2="608.5" y2="448.3" class="sp2" stroke-width="2.6" stroke-linecap="butt"/><line x1="459.9" y1="452.7" x2="608.5" y2="452.7" class="sp5" stroke-width="2.6" stroke-linecap="butt"/><line x1="633.6" y1="448.3" x2="878.4" y2="448.3" class="sp3" stroke-width="2.6" stroke-linecap="butt"/><line x1="909.4" y1="448.3" x2="1106.8" y2="448.3" class="sp5" stroke-width="2.6" stroke-linecap="butt"/><line x1="326.5" y1="480.8" x2="572.9" y2="480.8" class="sp5" stroke-width="2.6" stroke-linecap="butt"/><line x1="326.5" y1="485.2" x2="572.9" y2="485.2" class="sp3" stroke-width="2.6" stroke-linecap="butt"/><text x="326.0" y="443.9" font-size="22" font-weight="400" class="f">Мы созданы друг для друга и для одного общего дела, и эта общая жизнь —</text><text x="326.0" y="476.4" font-size="22" font-weight="400" class="f">наше собственное благо.</text><text x="326.0" y="520.5" font-size="21" font-weight="650" class="mu">Утверждение 3 · На деле · Что из этого следует для действия</text><line x1="420.9" y1="556.9" x2="675.6" y2="556.9" class="sp1" stroke-width="2.6" stroke-linecap="butt"/><line x1="737.1" y1="556.9" x2="994.8" y2="556.9" class="sp1" stroke-width="2.6" stroke-linecap="butt"/><line x1="737.1" y1="561.3" x2="994.8" y2="561.3" class="sp2" stroke-width="2.6" stroke-linecap="butt"/><line x1="1025.3" y1="556.9" x2="1089.8" y2="556.9" class="sp1" stroke-width="2.6" stroke-linecap="butt"/><line x1="326.5" y1="589.5" x2="464.5" y2="589.5" class="sp1" stroke-width="2.6" stroke-linecap="butt"/><line x1="495.5" y1="589.5" x2="978.7" y2="589.5" class="sp2" stroke-width="2.6" stroke-linecap="butt"/><text x="326.0" y="552.5" font-size="22" font-weight="400" class="f">Поэтому всё, что я делаю, должно быть нацелено на общее благо — прямо</text><text x="326.0" y="585.1" font-size="22" font-weight="400" class="f">или издалека, и верность этой одной цели делает меня единым.</text><text x="326.0" y="629.2" font-size="21" font-weight="650" class="mu">Сказано однажды · Упражнение · 7.10</text><text x="326.0" y="661.2" font-size="22" font-weight="400" class="f">Я буду часто говорить себе: я часть тела, а не просто часть.</text><text x="326.0" y="705.3" font-size="21" font-weight="650" class="mu">Утверждение 4 · Когда не выходит · К чему ведёт разрыв</text><line x1="326.5" y1="741.7" x2="591.2" y2="741.7" class="sp4" stroke-width="2.6" stroke-linecap="butt"/><line x1="603.4" y1="741.7" x2="829.9" y2="741.7" class="sp3" stroke-width="2.6" stroke-linecap="butt"/><line x1="881.2" y1="741.7" x2="995.7" y2="741.7" class="sp3" stroke-width="2.6" stroke-linecap="butt"/><line x1="326.5" y1="774.3" x2="474.2" y2="774.3" class="sp3" stroke-width="2.6" stroke-linecap="butt"/><line x1="486.5" y1="774.3" x2="636.1" y2="774.3" class="sp1" stroke-width="2.6" stroke-linecap="butt"/><line x1="486.5" y1="778.7" x2="636.1" y2="778.7" class="sp3" stroke-width="2.6" stroke-linecap="butt"/><line x1="486.5" y1="783.1" x2="636.1" y2="783.1" class="sp4" stroke-width="2.6" stroke-linecap="butt"/><line x1="990.0" y1="774.3" x2="1086.6" y2="774.3" class="sp3" stroke-width="2.6" stroke-linecap="butt"/><line x1="990.0" y1="778.7" x2="1086.6" y2="778.7" class="sp4" stroke-width="2.6" stroke-linecap="butt"/><text x="326.0" y="737.3" font-size="22" font-weight="400" class="f">Когда я ненавижу кого-то, поступаю с ним дурно или досадую на</text><text x="326.0" y="769.9" font-size="22" font-weight="400" class="f">происходящее, я отсекаю себя — и не только от этого одного, но от целого.</text><text x="326.0" y="814.0" font-size="21" font-weight="650" class="mu">Утверждение 5 · Когда не выходит · Путь назад</text><line x1="515.9" y1="850.4" x2="717.5" y2="850.4" class="sp3" stroke-width="2.6" stroke-linecap="butt"/><line x1="515.9" y1="854.8" x2="798.7" y2="854.8" class="sp4" stroke-width="2.6" stroke-linecap="butt"/><line x1="930.2" y1="850.4" x2="1103.5" y2="850.4" class="sp2" stroke-width="2.6" stroke-linecap="butt"/><rect x="807.5" y="827.9" width="120.0" height="24.6" rx="3" class="etf"/><line x1="326.5" y1="882.9" x2="447.8" y2="882.9" class="sp2" stroke-width="2.6" stroke-linecap="butt"/><text x="326.0" y="846.0" font-size="22" font-weight="400" class="f">Если я отсёк себя, я могу снова врасти в целое, <tspan class="ef">потому что</tspan> природа сильнее</text><text x="326.0" y="878.5" font-size="22" font-weight="400" class="f">моего ухода.</text><text x="1128.0" y="814.0" font-size="21" font-weight="650" text-anchor="end" class="ef">вывод редактора</text><text x="326.0" y="922.6" font-size="21" font-weight="650" class="mu">Сказано однажды · Когда не выходит · 11.7</text><text x="326.0" y="954.6" font-size="22" font-weight="400" class="f">Чем чаще я отсекаю себя, тем труднее возвращение.</text><rect x="72.0" y="280.2" width="104.0" height="36.0" rx="18" class="bg sp2" stroke-width="2.6"/><text x="124.0" y="305.8" font-size="21" font-weight="700" text-anchor="middle">9.7</text><rect x="72.0" y="351.8" width="104.0" height="36.0" rx="18" class="bg sp5" stroke-width="2.6"/><text x="124.0" y="377.3" font-size="21" font-weight="700" text-anchor="middle">5.15</text><rect x="72.0" y="423.3" width="104.0" height="36.0" rx="18" class="bg sp3" stroke-width="2.6"/><text x="124.0" y="448.9" font-size="21" font-weight="700" text-anchor="middle">8.32</text><rect x="72.0" y="494.9" width="104.0" height="36.0" rx="18" class="bg sp3" stroke-width="2.6"/><text x="124.0" y="520.4" font-size="21" font-weight="700" text-anchor="middle">7.10</text><rect x="72.0" y="566.4" width="104.0" height="36.0" rx="18" class="bg sp4" stroke-width="2.6"/><text x="124.0" y="592.0" font-size="21" font-weight="700" text-anchor="middle">4.4</text><rect x="72.0" y="637.9" width="104.0" height="36.0" rx="18" class="bg sp1" stroke-width="2.6"/><text x="124.0" y="663.5" font-size="21" font-weight="700" text-anchor="middle">9.21</text><