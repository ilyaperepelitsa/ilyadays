 y="70.6" font-size="13.5" font-weight="500" class="mu">вклада в <tspan data-d="articles">38</tspan> статьях, каждый подкрепляет,</text><text x="14.0" y="89.3" font-size="13.5" font-weight="500" class="mu">добавляет или ограничивает Марка.</text><circle cx="24.1" cy="124.5" r="10.1" class="ink"/><text x="24.1" y="129.0" font-size="13.44" font-weight="800" text-anchor="middle" class="bg">1</text><text x="41.2" y="129.3" font-size="14" font-weight="750">Корпус для поиска</text><text x="41.2" y="146.8" font-size="13" font-weight="500" class="mu"><tspan data-d="seneca-corpus">2140</tspan> фрагментов из всех <tspan data-d="seneca-letters-all">124</tspan> писем, в</text><text x="41.2" y="163.4" font-size="13" font-weight="500" class="mu">английском Гаммера, только для поиска</text><line x1="24.1" y1="136.3" x2="24.1" y2="168.6" class="kl" stroke-width="2"/><circle cx="24.1" cy="180.7" r="10.1" class="ink"/><text x="24.1" y="185.2" font-size="13.44" font-weight="800" text-anchor="middle" class="bg">2</text><text x="41.2" y="185.4" font-size="14" font-weight="750">Векторы и слова</text><text x="41.2" y="203.0" font-size="13" font-weight="500" class="mu">Ранжированы по близости к каждому</text><text x="41.2" y="219.6" font-size="13" font-weight="500" class="mu">разделу; не меньше трёх записанных</text><text x="41.2" y="236.3" font-size="13" font-weight="500" class="mu">поисков по его ключевым словам</text><line x1="24.1" y1="192.4" x2="24.1" y2="241.5" class="kl" stroke-width="2"/><circle cx="24.1" cy="253.5" r="10.1" class="ink"/><text x="24.1" y="258.0" font-size="13.44" font-weight="800" text-anchor="middle" class="bg">3</text><text x="41.2" y="258.3" font-size="14" font-weight="750">Чтение в контексте</text><text x="41.2" y="275.8" font-size="13" font-weight="500" class="mu">Письмо вокруг каждой цитаты прочитано;</text><text x="41.2" y="292.5" font-size="13" font-weight="500" class="mu">одно предложение говорит, о чём оно</text><line x1="24.1" y1="265.3" x2="24.1" y2="297.7" class="kl" stroke-width="2"/><circle cx="24.1" cy="309.7" r="10.1" class="ink"/><text x="24.1" y="314.2" font-size="13.44" font-weight="800" text-anchor="middle" class="bg">4</text><text x="41.2" y="314.5" font-size="14" font-weight="750">Размещение</text><text x="41.2" y="332.0" font-size="13" font-weight="500" class="mu"><tspan data-d="seneca-items">332</tspan> вклада: каждый подкрепляет, добавляет</text><text x="41.2" y="348.7" font-size="13" font-weight="500" class="mu">или ограничивает; <tspan data-d="seneca-pieces">421</tspan> цитата из <tspan data-d="letters">94</tspan> писем</text><line x1="24.1" y1="321.5" x2="24.1" y2="353.9" class="kl" stroke-width="2"/><circle cx="24.1" cy="365.9" r="10.1" class="ink"/><text x="24.1" y="370.4" font-size="13.44" font-weight="800" text-anchor="middle" class="bg">5</text><text x="41.2" y="370.7" font-size="14" font-weight="750">Приписки в тексте</text><text x="41.2" y="388.2" font-size="13" font-weight="500" class="mu"><tspan data-d="clauses">83</tspan>: <tspan data-d="clauses-adds">36</tspan> добавляют, <tspan data-d="clauses-limits">36</tspan> ограничивают, <tspan data-d="clauses-challenges">11</tspan></text><text x="41.2" y="404.8" font-size="13" font-weight="500" class="mu">возражают; слова Марка не</text><text x="41.2" y="421.5" font-size="13" font-weight="500" class="mu">переписываются</text><text x="14.0" y="449.5" font-size="14" font-weight="750">Вклады по статьям</text><rect x="14.0" y="467.4" width="10.4" height="10.4" rx="2" class="fb"/><text x="28.9" y="477.5" font-size="13" font-weight="650">Подкрепляет <tspan data-d="seneca-backs">149</tspan></text><rect x="152.8" y="467.4" width="10.4" height="10.4" rx="2" class="fa"/><text x="167.8" y="477.5" font-size="13" font-weight="650">Добавляет <tspan data-d="seneca-adds">136</tspan></text><rect x="14.0" y="485.6" width="10.4" height="10.4" rx="2" class="fl"/><text x="28.9" y="495.7" font-size="13" font-weight="650">Ограничивает <tspan data-d="seneca-limits">47</