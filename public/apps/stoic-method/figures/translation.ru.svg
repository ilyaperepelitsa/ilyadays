nt-size="22" font-weight="500" class="mu">Opus, видит английский</text><path d="M416.0 913.8 L422.0 919.8 L416.0 925.8" class="nf km" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="434.0" y="885.7" width="332.0" height="68.2" rx="8" class="soft"/><text x="448.0" y="915.4" font-size="22" font-weight="750">2 · Второй читатель</text><text x="448.0" y="941.8" font-size="22" font-weight="500" class="mu">Sonnet, английский и русский</text><path d="M778.0 913.8 L784.0 919.8 L778.0 925.8" class="nf km" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="796.0" y="885.7" width="332.0" height="68.2" rx="8" class="soft"/><text x="810.0" y="915.4" font-size="22" font-weight="750">3 · Переводчик решает</text><text x="810.0" y="941.8" font-size="22" font-weight="500" class="mu">каждое замечание письменно</text><rect x="72.0" y="973.9" width="94.5" height="20" rx="2" class="d1"><title>принято: 150</title></rect><rect x="168.5" y="973.9" width="34.7" height="20" rx="2" class="d2"><title>частично: 57</title></rect><rect x="205.2" y="973.9" width="2.5" height="20" rx="2" class="d3"><title>отклонено: 7</title></rect><rect x="72.0" y="1008.2" width="15.8" height="15.8" rx="2" class="d1"/><text x="94.0" y="1024.7" font-size="22" font-weight="600"><tspan data-d="dec-ru-accepted">150</tspan> принято</text><rect x="245.9" y="1008.2" width="15.8" height="15.8" rx="2" class="d2"/><text x="267.9" y="1024.7" font-size="22" font-weight="600"><tspan data-d="dec-ru-partly">57</tspan> частично</text><rect x="418.7" y="1008.2" width="15.8" height="15.8" rx="2" class="d3"/><text x="440.7" y="1024.7" font-size="22" font-weight="600"><tspan data-d="dec-ru-declined">7</tspan> отклонено</text><text x="72.0" y="1056.6" font-size="22" font-weight="500" class="mu">Каждая цитата статей вырезана заново из русского; глоссарий закрепляет термины страницы</text><g transform="translate(72,1140.2) scale(1.211)"><rect width="19" height="19" rx="5.5" class="ink"/