:var(--dg-accent)}.dg-svg .halo{paint-order:stroke;stroke:var(--dg-bg);stroke-width:5px;stroke-linejoin:round}.dg-svg .bg{fill:var(--dg-bg)}.dg-svg .soft{fill:var(--dg-soft)}.dg-svg .faint{fill:var(--dg-faint)}.dg-svg .ink{fill:var(--dg-ink)}.dg-svg .k{stroke:var(--dg-ink)}.dg-svg .km{stroke:var(--dg-mu)}.dg-svg .kl{stroke:var(--dg-line)}.dg-svg .kf{stroke:var(--dg-faint)}.dg-svg .kb{stroke:var(--dg-bg)}.dg-svg .nf{fill:none}.dg-svg .sac{stroke:var(--dg-accent)}.dg-svg .ef{fill:var(--dg-e)}.dg-svg .etf{fill:var(--dg-et)}.dg-svg .ek{stroke:var(--dg-e)}.dg-svg .p1{fill:var(--dg-p1)}.dg-svg .sp1{stroke:var(--dg-p1)}.dg-svg .p2{fill:var(--dg-p2)}.dg-svg .sp2{stroke:var(--dg-p2)}.dg-svg .p3{fill:var(--dg-p3)}.dg-svg .sp3{stroke:var(--dg-p3)}.dg-svg .p4{fill:var(--dg-p4)}.dg-svg .sp4{stroke:var(--dg-p4)}.dg-svg .p5{fill:var(--dg-p5)}.dg-svg .sp5{stroke:var(--dg-p5)}.dg-svg .c1{fill:var(--dg-c1)}.dg-svg .sc1{stroke:var(--dg-c1)}.dg-svg .c2{fill:var(--dg-c2)}.dg-svg .sc2{stroke:var(--dg-c2)}.dg-svg .c3{fill:var(--dg-c3)}.dg-svg .sc3{stroke:var(--dg-c3)}.dg-svg .c4{fill:var(--dg-c4)}.dg-svg .sc4{stroke:var(--dg-c4)}.dg-svg .c5{fill:var(--dg-c5)}.dg-svg .sc5{stroke:var(--dg-c5)}.dg-svg .c6{fill:var(--dg-c6)}.dg-svg .sc6{stroke:var(--dg-c6)}.dg-svg .c7{fill:var(--dg-c7)}.dg-svg .sc7{stroke:var(--dg-c7)}.dg-svg .fb{fill:var(--dg-fb)}.dg-svg .sfb{stroke:var(--dg-fb)}.dg-svg .fa{fill:var(--dg-fa)}.dg-svg .sfa{stroke:var(--dg-fa)}.dg-svg .fl{fill:var(--dg-fl)}.dg-svg .sfl{stroke:var(--dg-fl)}.dg-svg .d1{fill:var(--dg-d1)}.dg-svg .sd1{stroke:var(--dg-d1)}.dg-svg .d2{fill:var(--dg-d2)}.dg-svg .sd2{stroke:var(--dg-d2)}.dg-svg .d3{fill:var(--dg-d3)}.dg-svg .sd3{stroke:var(--dg-d3)}.dg-svg .d4{fill:var(--dg-d4)}.dg-svg .sd4{stroke:var(--dg-d4)}</style><rect width="1200" height="1200" class="bg"/><text x="72.0" y="104.0" font-size="50" font-weight="400" class="f">Три прочтения для каждого фрагмента</text><text x="72.0" y="149.5" font-size="26" font-weight="500" class="mu">Греческий и латынь — на современный английский, затем английский — на русский.</text><text x="72.0" y="184.9" font-size="26" font-weight="500" class="mu">Каждый читатель работает в новом контексте; каждое замечание второго читателя</text><text x="72.0" y="220.2" font-size="26" font-weight="500" class="mu">решается письменно.</text><text x="72.0" y="301.2" font-size="27" font-weight="750">Греческий → английский</text><text x="426.8" y="301.2" font-size="22" font-weight="500" class="mu"><tspan data-d="tr-marcus">418</tspan> фрагментов Марка · Claude Fable 5.2</text><rect x="72.0" y="319.2" width="332.0" height="68.2" rx="8" class="soft"/><text x="86.0" y="348.9" font-size="22" font-weight="750">1 · Переводчик</text><text x="86.0" y="375.3" font-size="22" font-weight="500" class="mu">видит греческий</text><path d="M416.0 347.3 L422.0 353.3 L416.0 359.3" class="nf km" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="434.0" y="319.2" width="332.0" height="68.2" rx="8" class="soft"/><text x="448.0" y="348.9" font-size="22" font-weight="750">2 · Проверяющий</text><text x="448.0" y="375.3" font-size="22" font-weight="500" class="mu">греческий и английский</text><path d="M778.0 347.3 L784.0 353.3 L778.0 359.3" class="nf km" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="796.0" y="319.2" width="332.0" height="68.2" rx="8" class="soft"/><text x="810.0" y="348.9" font-size="22" font-weight="750">3 · Решающий</text><text x="810.0" y="375.3" font-size="22" font-weight="500" class="mu">греческий, черновик, замечания</text><rect x="72.0" y="407.4" width="621.6" height="20" rx="2" class="d1"><title>принято: 969</title></rect><rect x="695.6" y="407.4" width="297.2" height="20" rx="2" class="d2"><title>частично: 465</title></rect><rect x="994.8" y="407.4" width="119.6" height="20" rx="2" class="d3"><title>отклонено: 189</title></rect><rect x="1116.4" y="407.4" width="9.6" height="20" rx="2" class="d4"><title>свободно: 18</title></rect><rect x=