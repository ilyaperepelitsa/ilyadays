font-size="13.5" font-weight="500" class="mu">items in <tspan data-d="articles">38</tspan> articles, each one Backs, Adds or</text><text x="14.0" y="89.3" font-size="13.5" font-weight="500" class="mu">Limits Marcus.</text><circle cx="24.1" cy="124.5" r="10.1" class="ink"/><text x="24.1" y="129.0" font-size="13.44" font-weight="800" text-anchor="middle" class="bg">1</text><text x="41.2" y="129.3" font-size="14" font-weight="750">A corpus to search</text><text x="41.2" y="146.8" font-size="13" font-weight="500" class="mu"><tspan data-d="seneca-corpus">2,140</tspan> passages of all <tspan data-d="seneca-letters-all">124</tspan> letters, in Gummere’s</text><text x="41.2" y="163.4" font-size="13" font-weight="500" class="mu">English, used only for finding</text><line x1="24.1" y1="136.3" x2="24.1" y2="168.6" class="kl" stroke-width="2"/><circle cx="24.1" cy="180.7" r="10.1" class="ink"/><text x="24.1" y="185.2" font-size="13.44" font-weight="800" text-anchor="middle" class="bg">2</text><text x="41.2" y="185.4" font-size="14" font-weight="750">Vectors and words</text><text x="41.2" y="203.0" font-size="13" font-weight="500" class="mu">Ranked by closeness to each section; at least</text><text x="41.2" y="219.6" font-size="13" font-weight="500" class="mu">three logged searches by its key words</text><line x1="24.1" y1="192.4" x2="24.1" y2="224.8" class="kl" stroke-width="2"/><circle cx="24.1" cy="236.9" r="10.1" class="ink"/><text x="24.1" y="241.4" font-size="13.44" font-weight="800" text-anchor="middle" class="bg">3</text><text x="41.2" y="241.6" font-size="14" font-weight="750">Read in context</text><text x="41.2" y="259.2" font-size="13" font-weight="500" class="mu">The letter around each quote is read; one</text><text x="41.2" y="275.8" font-size="13" font-weight="500" class="mu">sentence says what it is about</text><line x1="24.1" y1="248.6" x2="24.1" y2="281.0" class="kl" stroke-width="2"/><circle cx="24.1" cy="293.1" r="10.1" class="ink"/><text x="24.1" y="297.6" font-size="13.44" font-weight="800" text-anchor="middle" class="bg">4</text><text x="41.2" y="297.8" font-size="14" font-weight="750">Placed</text><text x="41.2" y="315.4" font-size="13" font-weight="500" class="mu"><tspan data-d="seneca-items">332</tspan> items: each Backs, Adds or Limits; <tspan data-d="seneca-pieces">421</tspan></text><text x="41.2" y="332.0" font-size="13" font-weight="500" class="mu">quotes from <tspan data-d="letters">94</tspan> letters</text><line x1="24.1" y1="304.8" x2="24.1" y2="337.2" class="kl" stroke-width="2"/><circle cx="24.1" cy="349.3" r="10.1" class="ink"/><text x="24.1" y="353.7" font-size="13.44" font-weight="800" text-anchor="middle" class="bg">5</text><text x="41.2" y="354.0" font-size="14" font-weight="750">Clauses in the body</text><text x="41.2" y="371.6" font-size="13" font-weight="500" class="mu"><tspan data-d="clauses">83</tspan>: <tspan data-d="clauses-adds">36</tspan> add, <tspan data-d="clauses-limits">36</tspan> limit, <tspan data-d="clauses-challenges">11</tspan> challenge; Marcus’s</text><text x="41.2" y="388.2" font-size="13" font-weight="500" class="mu">words are never rewritten</text><text x="14.0" y="416.2" font-size="14" font-weight="750">Items per article</text><rect x="14.0" y="434.1" width="10.4" height="10.4" rx="2" class="fb"/><text x="28.9" y="444.2" font-size="13" font-weight="650">Backs <tspan data-d="seneca-backs">149</tspan></text><rect x="103.9" y="434.1" width="10.4" height="10.4" rx="2" class="fa"/><text x="118.9" y="444.2" font-size="13" font-weight="650">Adds <tspan data-d="seneca-adds">136</tspan></text><rect x="188.5" y="434.1" width="10.4" height="10.4" rx="2" class="fl"/><text x="203.5" y="444.2" font-size="13" font-weight="650">Limits <tspan data-d="seneca-limits">47</tspan></text><line x1="36.1" y1="632.1" x2="326.0" y2="632.1" class="kl" stroke-width="1"/><text x="28.1" y="636.4" font-size="13" font-weight="500" text-anchor="end" class="mu">0</text><line x1="36.1" y1="577.5" x2="326.0" y2="5